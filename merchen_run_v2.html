<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MERCHEN RUN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;background:#1a0830;}
#gc{display:block;position:fixed;top:0;left:0;touch-action:none;}
#livesDiv{position:fixed;top:12px;left:14px;font:700 22px/1 "Helvetica Neue",sans-serif;color:#ff80cc;text-shadow:0 1px 6px #000;z-index:5;pointer-events:none;}
#scoreDiv{position:fixed;top:12px;right:14px;font:700 22px/1 "Helvetica Neue",sans-serif;color:#ffe0ff;text-shadow:0 1px 6px #000;z-index:5;pointer-events:none;}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(20,0,40,0.85);}
#overlay h2{font:700 30px/1.4 "Helvetica Neue",sans-serif;color:#ffb0ff;margin-bottom:10px;text-align:center;}
#overlay p{font:400 18px/1.6 "Helvetica Neue",sans-serif;color:#dda0ff;margin-bottom:40px;text-align:center;}
#actionBtn{font:700 22px/1 "Helvetica Neue",sans-serif;color:#fff;background:linear-gradient(135deg,#a030e0,#6010c0);border:none;border-radius:50px;padding:20px 70px;cursor:pointer;}
#startOverlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(20,0,40,0.92);}
#startOverlay h1{font:700 30px/1.4 "Helvetica Neue",sans-serif;color:#ffb0ff;margin-bottom:12px;text-align:center;}
#startOverlay p{font:400 15px/1.9 "Helvetica Neue",sans-serif;color:#cc80ff;margin-bottom:4px;text-align:center;padding:0 30px;}
#startBtn{font:700 22px/1 "Helvetica Neue",sans-serif;color:#fff;background:linear-gradient(135deg,#e040a0,#a020c0);border:none;border-radius:50px;padding:20px 70px;cursor:pointer;margin-top:28px;}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="livesDiv">❤ 3</div>
<div id="scoreDiv">SCORE 0</div>
<div id="startOverlay">
  <h1>✨ MERCHEN RUN ✨</h1>
  <p>画面左側タップ → ジャンプ<br>空中でもう一回 → 二段ジャンプ<br>画面右側タップ → パンチ</p>
  <button id="startBtn">START !</button>
</div>
<div id="overlay">
  <h2 id="overlayTitle">GAME OVER</h2>
  <p id="overlayMsg">SCORE: 0</p>
  <button id="actionBtn">RETRY</button>
</div>

let W,H,dpr,GROUND,CAM_X;
function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr);
  GROUND=Math.floor(H*0.80);
}
resize();
window.addEventListener('resize',()=>{ resize(); if(gameStarted&&!gameOver&&!cleared) initLevel(); });

const GRAVITY=0.55,JUMP_V=-13,JUMP2_V=-11,SCROLL_SPD=2.2,LEVEL_W=6000;
const PUNCH_RANGE=64,PUNCH_H=24;

let score,lives,gameOver,gameStarted,cleared,frame;
let punchTimer,punchActive,invTimer,invActive,jumpCount;
let player,platforms,enemies,coins,particles,goal;

function mkPlayer(){
  return{x:120,y:0,w:52,h:80,vy:0,onGround:false,walkFrame:0};
}
function mkEnemy(x,type){
  const h=56,w=56;
  const baseY=type==='fly'?GROUND-150:GROUND-h;
  return{x,y:baseY,w,h,vx:type==='fly'?0:-1.4,type,dead:false,frame:0,floatY:0,floatDir:1,baseY};
}
function mkCoin(x,y){return{x,y,w:22,h:22,collected:false,frame:0};}

function spawnFX(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=2+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:30,maxLife:30,color,r:3+Math.random()*4});
  }
}

// ---- INPUT ----
function handleTouch(e){
  e.preventDefault();
  if(!gameStarted||gameOver||cleared)return;
  const t=e.changedTouches[0];
  if(t.clientX>W*0.72){ doPunch(); return; }
  if(player.onGround){ player.vy=JUMP_V; player.onGround=false; jumpCount=1; }
  else if(jumpCount===1){ player.vy=JUMP2_V; jumpCount=2; }
}
canvas.addEventListener('touchstart',handleTouch,{passive:false});
canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
canvas.addEventListener('touchend',e=>e.preventDefault(),{passive:false});
function doPunch(){ if(!punchActive){ punchActive=true; punchTimer=18; } }
function btnTouch(el,fn){
  el.addEventListener('touchstart',e=>{e.stopPropagation();e.preventDefault();fn();},{passive:false});
  el.addEventListener('click',fn);
}
btnTouch(startBtn,()=>{ startOverlay.style.display='none'; gameStarted=true; startGame(); });
btnTouch(actionBtn,()=>{ overlay.style.display='none'; startGame(); });

function startGame(){ score=0;lives=3;gameOver=false;cleared=false;frame=0; initLevel(); updateHUD(); }
function updateHUD(){ scoreDiv.textContent='SCORE '+score; livesDiv.textContent='❤ '+lives; }

// ---- PHYSICS ----
function collide(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }

function update(){
  if(!gameStarted||gameOver||cleared)return;
  frame++;
  CAM_X+=SCROLL_SPD;
  player.x+=SCROLL_SPD;
  player.vy+=GRAVITY;
  player.y+=player.vy;
  player.onGround=false;

  platforms.forEach(p=>{
    if(!collide(player,p))return;
    const oB=player.y+player.h-p.y, oT=p.y+p.h-player.y;
    const oL=player.x+player.w-p.x, oR=p.x+p.w-player.x;
    const m=Math.min(oB,oT,oL,oR);
    if(m===oB&&player.vy>=0){ player.y=p.y-player.h; player.vy=0; player.onGround=true; jumpCount=0; }
    else if(m===oT&&player.vy<0){ player.y=p.y+p.h; player.vy=0; }
    else if(m===oL){ player.x=p.x-player.w; }
    else if(m===oR){ player.x=p.x+p.w; }
  });

  if(punchActive){ punchTimer--; if(punchTimer<=0)punchActive=false; }
  if(invActive){ invTimer--; if(invTimer<=0)invActive=false; }
  if(player.onGround) player.walkFrame=(player.walkFrame+0.18)%4;

  const pBox=punchActive?{x:player.x+player.w,y:player.y+player.h*0.2,w:PUNCH_RANGE,h:PUNCH_H}:null;

  enemies.forEach(en=>{
    if(en.dead)return;
    en.frame++;
    if(en.type==='walk'){
      en.x+=en.vx;
      if(en.x<CAM_X-100||en.x>CAM_X+W+100) en.vx*=-1;
    } else {
      en.floatY+=0.045*en.floatDir;
      if(Math.abs(en.floatY)>26) en.floatDir*=-1;
      en.y=en.baseY+en.floatY;
      en.x-=1.2;
      if(en.x<CAM_X-120) en.x=CAM_X+W+120;
    }
    if(pBox&&collide(pBox,en)){
      en.dead=true; spawnFX(en.x+en.w/2,en.y+en.h/2,'#ff88ff',8);
      score+=100; updateHUD();
    }
    if(!invActive&&collide(player,en)){
      lives--; updateHUD(); invActive=true; invTimer=100;
      spawnFX(player.x+player.w/2,player.y+player.h/2,'#ff4444',6);
      if(lives<=0) triggerGameOver();
    }
  });

  coins.forEach(c=>{
    if(c.collected)return;
    c.frame++;
    if(collide(player,c)){ c.collected=true; score+=50; updateHUD(); spawnFX(c.x+11,c.y+11,'#ffee44',5); }
  });

  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; p.life--; });
  for(let i=particles.length-1;i>=0;i--) if(particles[i].life<=0) particles.splice(i,1);

  if(player.y>H+120){
    lives--; updateHUD();
    if(lives<=0) triggerGameOver();
    else{ player.x=Math.max(CAM_X+100,player.x); player.y=GROUND-player.h; player.vy=0; invActive=true; invTimer=100; }
  }
  const tCam=player.x-W*0.28;
  if(tCam>CAM_X) CAM_X=tCam;
  if(collide(player,goal)) triggerClear();
}

function triggerGameOver(){ gameOver=true; overlayTitle.textContent='GAME OVER'; overlayMsg.textContent='SCORE: '+score; actionBtn.textContent='RETRY'; overlay.style.display='flex'; }
function triggerClear(){ cleared=true; overlayTitle.textContent='STAGE CLEAR ✨'; overlayMsg.textContent='SCORE: '+score; actionBtn.textContent='もう一度'; overlay.style.display='flex'; }

// ---- DRAW ----
function drawBg(){
  const bg=IMG.bg;
  if(bg.complete&&bg.naturalWidth){
    const scale=H/bg.naturalHeight;
    const sw=bg.naturalWidth*scale;
    const offX=-(CAM_X*0.15)%sw;
    for(let i=-1;i<=Math.ceil(W/sw)+1;i++) ctx.drawImage(bg,offX+i*sw,0,sw,H);
  } else {
    ctx.fillStyle='#3a0870'; ctx.fillRect(0,0,W,H);
  }
}

function drawPlatform(p){
  const sx=p.x-CAM_X;
  if(sx+p.w<-10||sx>W+10) return;
  const tile=IMG.tile;
  if(!tile.complete||!tile.naturalWidth){
    ctx.fillStyle=p.type==='ground'?'#5020a0':'#8030d0';
    ctx.fillRect(sx, p.y, Math.min(p.w, W-sx+10), p.type==='ground'?H-p.y:p.h);
    return;
  }
  // tileSize: ground=p.h(=TILE_H=48)に合わせてスケール、block=p.h
  const tileSize = p.h;
  // ワールド座標でタイルを整列させてからスクリーン座標に変換
  const worldStart = Math.floor(p.x / tileSize) * tileSize;
  const worldEnd   = p.x + p.w;
  for(let wx=worldStart; wx<worldEnd; wx+=tileSize){
    const drawX = wx - CAM_X;
    if(drawX + tileSize < 0 || drawX > W) continue;
    const clampX  = Math.max(drawX, sx);
    const clampX2 = Math.min(drawX + tileSize, sx + p.w, W + tileSize);
    const drawW   = clampX2 - clampX;
    const srcX    = (clampX - drawX) / tileSize * tile.naturalWidth;
    const srcW    = drawW / tileSize * tile.naturalWidth;
    if(p.type==='ground'){
      for(let ty=p.y; ty<H; ty+=tileSize){
        const drawH2 = Math.min(tileSize, H - ty);
        const srcH   = drawH2 / tileSize * tile.naturalHeight;
        ctx.drawImage(tile, srcX,0, srcW,srcH, clampX,ty, drawW,drawH2);
      }
    } else {
      ctx.drawImage(tile, srcX,0, srcW,tile.naturalHeight, clampX,p.y, drawW,p.h);
    }
  }
}

function drawEnemy(en){
  if(en.dead)return;
  const sx=en.x-CAM_X;
  if(sx+en.w<-80||sx>W+80) return;
  const img=en.type==='walk'?IMG.enemyWalk:IMG.enemyFly;
  if(img.complete&&img.naturalWidth){
    const frames=2;
    const fw=img.naturalWidth/frames;
    const fi=Math.floor(en.frame/10)%frames;
    ctx.drawImage(img, fi*fw,0, fw,img.naturalHeight, sx,en.y, en.w,en.h);
  } else {
    ctx.fillStyle=en.type==='walk'?'#ff80b0':'#a040f0';
    ctx.beginPath(); ctx.arc(sx+en.w/2,en.y+en.h/2,en.w/2,0,Math.PI*2); ctx.fill();
  }
}

function drawCoin(c){
  if(c.collected)return;
  const sx=c.x-CAM_X;
  if(sx+c.w<0||sx>W) return;
  const bob=Math.sin(c.frame*0.09)*4;
  ctx.fillStyle='#ffdd00'; ctx.beginPath(); ctx.arc(sx+11,c.y+11+bob,11,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,200,80,0.6)'; ctx.beginPath(); ctx.arc(sx+9,c.y+9+bob,6,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#cc8800'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(sx+11,c.y+11+bob,11,0,Math.PI*2); ctx.stroke();
}

function drawGoal(){
  const sx=goal.x-CAM_X;
  if(sx+goal.w+150<0||sx-150>W) return;
  ctx.strokeStyle='#ffaadd'; ctx.lineWidth=7;
  ctx.beginPath(); ctx.arc(sx+goal.w/2,goal.y+goal.h,goal.w*1.8,Math.PI,0); ctx.stroke();
  ctx.strokeStyle='#dd66aa'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(sx-goal.w*0.8,goal.y+goal.h); ctx.lineTo(sx-goal.w*0.8,goal.y+goal.h*0.65); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx+goal.w*1.8,goal.y+goal.h); ctx.lineTo(sx+goal.w*1.8,goal.y+goal.h*0.65); ctx.stroke();
  ctx.fillStyle='#d0d0d0'; ctx.fillRect(sx+goal.w/2-4,goal.y,8,goal.h);
  const wave=Math.sin(frame*0.1)*10;
  ctx.fillStyle='#ff2288';
  ctx.beginPath(); ctx.moveTo(sx+goal.w/2+4,goal.y+4); ctx.lineTo(sx+goal.w/2+52+wave,goal.y+26); ctx.lineTo(sx+goal.w/2+4,goal.y+48); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px Helvetica Neue,sans-serif'; ctx.textAlign='center';
  ctx.shadowColor='#ff44aa'; ctx.shadowBlur=10;
  ctx.fillText('GOAL',sx+goal.w/2,goal.y-16);
  ctx.shadowBlur=0;
}

function drawPlayer(){
  const p=player, sx=p.x-CAM_X;
  const img=IMG.player;
  ctx.save();
  if(invActive&&Math.floor(invTimer/5)%2===0) ctx.globalAlpha=0.35;
  if(img.complete&&img.naturalWidth){
    const fw=img.naturalWidth/4;
    let fi = player.onGround ? Math.floor(player.walkFrame)%4 : 1;
    if(punchActive) fi=2;
    ctx.drawImage(img, fi*fw,0, fw,img.naturalHeight, sx-4,p.y-4, p.w+8,p.h+4);
  } else {
    ctx.fillStyle='#ff80c0';
    ctx.beginPath(); ctx.ellipse(sx+p.w/2,p.y+p.h/2,p.w/2,p.h/2,0,0,Math.PI*2); ctx.fill();
  }
  if(punchActive){
    ctx.fillStyle='rgba(255,255,80,0.9)';
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3+frame*0.3;
      ctx.beginPath(); ctx.arc(sx+p.w+44+Math.cos(a)*9,p.y+p.h*0.32+Math.sin(a)*9,5,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.save(); ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x-CAM_X,p.y,p.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

function drawMinimap(){
  const mw=110,mh=9,mx=(W-mw)/2,my=10;
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.roundRect(mx,my,mw,mh,5); ctx.fill();
  const prog=Math.min(CAM_X/LEVEL_W,1);
  ctx.fillStyle='#ff80cc'; ctx.beginPath(); ctx.roundRect(mx,my,mw*prog,mh,5); ctx.fill();
  ctx.font='bold 9px Helvetica Neue,sans-serif'; ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.textAlign='right';
  ctx.fillText('GOAL',mx+mw,my+8);
}

function drawHint(){
  if(frame<200){
    ctx.save(); ctx.globalAlpha=(1-frame/200)*0.9;
    ctx.fillStyle='#fff'; ctx.font='bold 15px Helvetica Neue,sans-serif'; ctx.textAlign='center';
    ctx.shadowColor='#000'; ctx.shadowBlur=5;
    ctx.fillText('画面左タップ → ジャンプ',W/2,H-86);
    ctx.fillText('画面右タップ → パンチ',W/2,H-60);
    ctx.shadowBlur=0; ctx.restore();
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  if(loaded<TOTAL){
    ctx.fillStyle='#1a0830'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffb0ff'; ctx.font='bold 20px sans-serif'; ctx.textAlign='center';
    ctx.fillText('Loading... '+loaded+'/'+TOTAL,W/2,H/2);
  } else if(gameStarted){
    update(); drawBg(); platforms.forEach(drawPlatform); drawGoal();
    coins.forEach(drawCoin); enemies.forEach(drawEnemy);
    drawParticles(); drawPlayer(); drawMinimap(); drawHint();
  }
  requestAnimationFrame(loop);
}
loop();
})();
</script>
