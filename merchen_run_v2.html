<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MERCHEN RUN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;background:#1a0830;}
#gc{display:block;position:fixed;top:0;left:0;touch-action:none;}
#livesDiv{position:fixed;top:12px;left:14px;font:700 22px/1 "Helvetica Neue",sans-serif;color:#ff80cc;text-shadow:0 1px 6px #000;z-index:5;pointer-events:none;}
#scoreDiv{position:fixed;top:12px;right:14px;font:700 22px/1 "Helvetica Neue",sans-serif;color:#ffe0ff;text-shadow:0 1px 6px #000;z-index:5;pointer-events:none;}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(20,0,40,0.85);}
#overlay h2{font:700 30px/1.4 "Helvetica Neue",sans-serif;color:#ffb0ff;margin-bottom:10px;text-align:center;}
#overlay p{font:400 18px/1.6 "Helvetica Neue",sans-serif;color:#dda0ff;margin-bottom:40px;text-align:center;}
#actionBtn{font:700 22px/1 "Helvetica Neue",sans-serif;color:#fff;background:linear-gradient(135deg,#a030e0,#6010c0);border:none;border-radius:50px;padding:20px 70px;cursor:pointer;}
#startOverlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(20,0,40,0.92);}
#startOverlay h1{font:700 30px/1.4 "Helvetica Neue",sans-serif;color:#ffb0ff;margin-bottom:12px;text-align:center;}
#startOverlay p{font:400 15px/1.9 "Helvetica Neue",sans-serif;color:#cc80ff;margin-bottom:4px;text-align:center;padding:0 30px;}
#startBtn{font:700 22px/1 "Helvetica Neue",sans-serif;color:#fff;background:linear-gradient(135deg,#e040a0,#a020c0);border:none;border-radius:50px;padding:20px 70px;cursor:pointer;margin-top:28px;}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="livesDiv">❤ 3</div>
<div id="scoreDiv">SCORE 0</div>
<div id="startOverlay">
  <h1>✨ MERCHEN RUN ✨</h1>
  <p>画面左タップ → ジャンプ<br>空中でもう一回 → 二段ジャンプ<br>画面右タップ → パンチ</p>
  <button id="startBtn">START !</button>
</div>
<div id="overlay">
  <h2 id="overlayTitle">GAME OVER</h2>
  <p id="overlayMsg">SCORE: 0</p>
  <button id="actionBtn">RETRY</button>
</div>

    {x:2250,y:GROUND-150,w:120,h:TH,type:'block'},
    {x:2520,y:GROUND-210,w:110,h:TH,type:'block'},
    {x:2820,y:GROUND-130,w:140,h:TH,type:'block'},
    {x:3120,y:GROUND-190,w:100,h:TH,type:'block'},
    {x:3420,y:GROUND-110,w:160,h:TH,type:'block'},
    {x:3720,y:GROUND-180,w:120,h:TH,type:'block'},
    {x:4020,y:GROUND-150,w:110,h:TH,type:'block'},
    {x:4320,y:GROUND-210,w:130,h:TH,type:'block'},
    {x:4620,y:GROUND-130,w:120,h:TH,type:'block'},
    {x:4920,y:GROUND-170,w:140,h:TH,type:'block'},
    {x:5220,y:GROUND-110,w:160,h:TH,type:'block'},
  ];
  enemies=[
    mkEnemy(440,'walk'),mkEnemy(680,'walk'),
    mkEnemy(1080,'fly'),mkEnemy(1280,'walk'),
    mkEnemy(1580,'walk'),mkEnemy(1840,'fly'),
    mkEnemy(2140,'walk'),mkEnemy(2440,'fly'),
    mkEnemy(2740,'walk'),mkEnemy(3040,'fly'),
    mkEnemy(3340,'walk'),mkEnemy(3640,'fly'),
    mkEnemy(3940,'walk'),mkEnemy(4240,'fly'),
    mkEnemy(4540,'walk'),mkEnemy(4840,'fly'),
    mkEnemy(5040,'walk'),mkEnemy(5340,'fly'),
  ];
  coins=[];
  [360,440,540,600,750,800,960,1000,1160,1380,1450,1580,1650,1790,1990,
   2270,2340,2590,2890,3190,3490,3790,4090,4390,4690,4990,5270
  ].forEach(function(x){coins.push(mkCoin(x,GROUND-210));});
  particles=[];
  goal={x:LEVEL_W-200,y:GROUND-260,w:60,h:260};
}

function spawnFX(x,y,color,n){
  for(var i=0;i<n;i++){
    var a2=Math.random()*Math.PI*2,s=2+Math.random()*4;
    particles.push({x:x,y:y,vx:Math.cos(a2)*s,vy:Math.sin(a2)*s-3,life:30,maxLife:30,color:color,r:3+Math.random()*4});
  }
}

function handleTouch(e){
  e.preventDefault();
  if(!gameStarted||gameOver||cleared)return;
  var t=e.changedTouches[0];
  if(t.clientX>W*0.72){doPunch();return;}
  if(player.onGround){player.vy=JUMP_V;player.onGround=false;jumpCount=1;}
  else if(jumpCount===1){player.vy=JUMP2_V;jumpCount=2;}
}
canvas.addEventListener('touchstart',handleTouch,{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();},{passive:false});
function doPunch(){if(!punchActive){punchActive=true;punchTimer=18;}}
function btnTouch(el,fn){
  el.addEventListener('touchstart',function(e){e.stopPropagation();e.preventDefault();fn();},{passive:false});
  el.addEventListener('click',fn);
}
btnTouch(startBtn,function(){startOverlay.style.display='none';gameStarted=true;startGame();});
btnTouch(actionBtn,function(){overlay.style.display='none';startGame();});

function startGame(){score=0;lives=3;gameOver=false;cleared=false;frame=0;initLevel();updateHUD();}
function updateHUD(){scoreDiv.textContent='SCORE '+score;livesDiv.textContent='❤ '+lives;}
function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function update(){
  if(!gameStarted||gameOver||cleared)return;
  frame++;
  player.x+=SPD;
  player.vy+=GRAVITY;
  player.y+=player.vy;
  player.onGround=false;
  for(var pi=0;pi<platforms.length;pi++){
    var p=platforms[pi];
    if(!collide(player,p))continue;
    var oB=player.y+player.h-p.y,oT=p.y+p.h-player.y;
    var oL=player.x+player.w-p.x,oR=p.x+p.w-player.x;
    var m=Math.min(oB,oT,oL,oR);
    if(m===oB&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.onGround=true;jumpCount=0;}
    else if(m===oT&&player.vy<0){player.y=p.y+p.h;player.vy=0;}
    else if(m===oL){player.x=p.x-player.w;}
    else if(m===oR){player.x=p.x+p.w;}
  }
  if(punchActive){punchTimer--;if(punchTimer<=0)punchActive=false;}
  if(invActive){invTimer--;if(invTimer<=0)invActive=false;}
  if(player.onGround)player.walkFrame=(player.walkFrame+0.18)%4;
  var pBox=punchActive?{x:player.x+player.w,y:player.y+player.h*0.2,w:PUNCH_RANGE,h:24}:null;
  for(var ei=0;ei<enemies.length;ei++){
    var en=enemies[ei];
    if(en.dead)continue;
    en.frame++;
    if(en.type==='walk'){
      en.x+=en.vx;
      if(en.x<CAM_X-100||en.x>CAM_X+W+100)en.vx*=-1;
    }else{
      en.floatY+=0.045*en.floatDir;
      if(Math.abs(en.floatY)>26)en.floatDir*=-1;
      en.y=en.baseY+en.floatY;
      en.x-=1.2;
      if(en.x<CAM_X-120)en.x=CAM_X+W+120;
    }
    if(pBox&&collide(pBox,en)){en.dead=true;spawnFX(en.x+en.w/2,en.y+en.h/2,'#ff88ff',8);score+=100;updateHUD();}
    if(!invActive&&collide(player,en)){
      lives--;updateHUD();invActive=true;invTimer=100;
      spawnFX(player.x+player.w/2,player.y+player.h/2,'#ff4444',6);
      if(lives<=0)triggerGameOver();
    }
  }
  for(var ci=0;ci<coins.length;ci++){
    var c=coins[ci];
    if(c.collected)continue;
    c.frame++;
    if(collide(player,c)){c.collected=true;score+=50;updateHUD();spawnFX(c.x+11,c.y+11,'#ffee44',5);}
  }
  for(var qi=particles.length-1;qi>=0;qi--){
    var pp=particles[qi];
    pp.x+=pp.vx;pp.y+=pp.vy;pp.vy+=0.2;pp.life--;
    if(pp.life<=0)particles.splice(qi,1);
  }
  if(player.y>H+120){
    lives--;updateHUD();
    if(lives<=0)triggerGameOver();
    else{player.x=Math.max(CAM_X+80,player.x);player.y=GROUND-player.h;player.vy=0;invActive=true;invTimer=100;}
  }
  var tCam=player.x-W*0.28;
  if(tCam>CAM_X)CAM_X=tCam;
  if(collide(player,goal))triggerClear();
}

function triggerGameOver(){gameOver=true;overlayTitle.textContent='GAME OVER';overlayMsg.textContent='SCORE: '+score;actionBtn.textContent='RETRY';overlay.style.display='flex';}
function triggerClear(){cleared=true;overlayTitle.textContent='STAGE CLEAR ✨';overlayMsg.textContent='SCORE: '+score;actionBtn.textContent='もう一度';overlay.style.display='flex';}

function drawBg(){
  var bg=IMG.bg;
  if(bg&&bg.complete&&bg.naturalWidth){
    var scale=H/bg.naturalHeight;
    var sw=bg.naturalWidth*scale;
    var offX=-(CAM_X*0.15)%sw;
    for(var i=-1;i<=Math.ceil(W/sw)+1;i++)ctx.drawImage(bg,offX+i*sw,0,sw,H);
  }else{ctx.fillStyle='#3a0870';ctx.fillRect(0,0,W,H);}
}

function drawPlatform(p){
  var sx=p.x-CAM_X;
  if(sx+p.w<-10||sx>W+10)return;
  var t=IMG.tile;
  var TW=80;

  if(p.type==='ground'){
    // 紫グラデで塗りつぶし
    var gg=ctx.createLinearGradient(0,GROUND,0,H);
    gg.addColorStop(0,'#6020b8');gg.addColorStop(1,'#2a0060');
    ctx.fillStyle=gg;ctx.fillRect(0,GROUND,W,H-GROUND);
    // タイルをオーバーレイ（グレー部分は透過済みなのでグラデが透ける）
    if(t&&t.complete&&t.naturalWidth){
      var offX2=-(CAM_X%TW);
      for(var tx=offX2-TW;tx<W+TW;tx+=TW){
        ctx.drawImage(t,tx,GROUND,TW,TW);
        ctx.drawImage(t,tx,GROUND+TW,TW,TW);
      }
    }
  }else{
    // 足場も紫グラデ下地
    ctx.fillStyle='#7030c0';
    ctx.fillRect(sx,p.y,p.w,p.h);
    // タイルオーバーレイ
    if(t&&t.complete&&t.naturalWidth){
      var offX3=-(CAM_X%TW);
      var startX=Math.floor((sx-offX3)/TW)*TW+offX3;
      for(var tx2=startX;tx2<sx+p.w;tx2+=TW){
        var dx=Math.max(tx2,sx);
        var dw=Math.min(tx2+TW,sx+p.w)-dx;
        if(dw<=0)continue;
        var srcX=t.naturalWidth*((dx-tx2)/TW);
        var srcW=t.naturalWidth*(dw/TW);
        ctx.drawImage(t,srcX,0,srcW,t.naturalHeight,dx,p.y,dw,p.h);
      }
    }
  }
}

function drawEnemy(en){
  if(en.dead)return;
  var sx=en.x-CAM_X;
  if(sx+en.w<-80||sx>W+80)return;
  var img=en.type==='walk'?IMG.enemyWalk:IMG.enemyFly;
  if(img&&img.complete&&img.naturalWidth){
    var fw=img.naturalWidth/2;
    var fi=Math.floor(en.frame/10)%2;
    ctx.drawImage(img,fi*fw,0,fw,img.naturalHeight,sx,en.y,en.w,en.h);
  }
}

function drawCoin(c){
  if(c.collected)return;
  var sx=c.x-CAM_X;
  if(sx+c.w<0||sx>W)return;
  var bob=Math.sin(c.frame*0.09)*4;
  ctx.fillStyle='#ffdd00';ctx.beginPath();ctx.arc(sx+11,c.y+11+bob,11,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,200,80,0.5)';ctx.beginPath();ctx.arc(sx+8,c.y+8+bob,6,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#cc8800';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(sx+11,c.y+11+bob,11,0,Math.PI*2);ctx.stroke();
}

function drawGoal(){
  var sx=goal.x-CAM_X;
  if(sx+goal.w+150<0||sx-150>W)return;
  ctx.strokeStyle='#ffaadd';ctx.lineWidth=7;
  ctx.beginPath();ctx.arc(sx+goal.w/2,goal.y+goal.h,goal.w*1.8,Math.PI,0);ctx.stroke();
  ctx.strokeStyle='#dd66aa';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(sx-goal.w*0.8,goal.y+goal.h);ctx.lineTo(sx-goal.w*0.8,goal.y+goal.h*0.65);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx+goal.w*1.8,goal.y+goal.h);ctx.lineTo(sx+goal.w*1.8,goal.y+goal.h*0.65);ctx.stroke();
  ctx.fillStyle='#d0d0d0';ctx.fillRect(sx+goal.w/2-4,goal.y,8,goal.h);
  var wave=Math.sin(frame*0.1)*10;
  ctx.fillStyle='#ff2288';
  ctx.beginPath();ctx.moveTo(sx+goal.w/2+4,goal.y+4);ctx.lineTo(sx+goal.w/2+52+wave,goal.y+26);ctx.lineTo(sx+goal.w/2+4,goal.y+48);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 22px Helvetica Neue,sans-serif';ctx.textAlign='center';
  ctx.shadowColor='#ff44aa';ctx.shadowBlur=10;
  ctx.fillText('GOAL',sx+goal.w/2,goal.y-16);ctx.shadowBlur=0;
}

function drawPlayer(){
  var p=player,sx=p.x-CAM_X;
  ctx.save();
  if(invActive&&Math.floor(invTimer/5)%2===0)ctx.globalAlpha=0.35;
  var img=IMG.player;
  if(img&&img.complete&&img.naturalWidth){
    var fw=img.naturalWidth/4;
    var fi=player.onGround?Math.floor(player.walkFrame)%4:1;
    if(punchActive)fi=2;
    ctx.drawImage(img,fi*fw,0,fw,img.naturalHeight,sx-4,p.y-4,p.w+8,p.h+4);
  }
  if(punchActive){
    ctx.fillStyle='rgba(255,255,80,0.9)';
    for(var i=0;i<6;i++){
      var ang=i*Math.PI/3+frame*0.3;
      ctx.beginPath();ctx.arc(sx+p.w+44+Math.cos(ang)*9,p.y+p.h*0.32+Math.sin(ang)*9,5,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();
}

function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var pp=particles[i];
    ctx.save();ctx.globalAlpha=pp.life/pp.maxLife;
    ctx.fillStyle=pp.color;ctx.beginPath();ctx.arc(pp.x-CAM_X,pp.y,pp.r,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}

function drawMinimap(){
  var mw=110,mh=9,mx=(W-mw)/2,my=10;
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.roundRect(mx,my,mw,mh,5);ctx.fill();
  ctx.fillStyle='#ff80cc';ctx.beginPath();ctx.roundRect(mx,my,mw*Math.min(CAM_X/LEVEL_W,1),mh,5);ctx.fill();
  ctx.font='bold 9px Helvetica Neue,sans-serif';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.textAlign='right';
  ctx.fillText('GOAL',mx+mw,my+8);
}

function drawHint(){
  if(frame<200){
    ctx.save();ctx.globalAlpha=(1-frame/200)*0.9;
    ctx.fillStyle='#fff';ctx.font='bold 15px Helvetica Neue,sans-serif';ctx.textAlign='center';
    ctx.shadowColor='#000';ctx.shadowBlur=5;
    ctx.fillText('画面左タップ → ジャンプ',W/2,H-86);
    ctx.fillText('画面右タップ → パンチ',W/2,H-60);
    ctx.shadowBlur=0;ctx.restore();
  }
}

function loop(){
  ctx.clearRect(0,0,W,H);
  if(loaded<TOTAL){
    ctx.fillStyle='#1a0830';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffb0ff';ctx.font='bold 20px sans-serif';ctx.textAlign='center';
    ctx.fillText('Loading... '+loaded+'/'+TOTAL,W/2,H/2);
    requestAnimationFrame(loop);return;
  }
  if(gameStarted){
    update();drawBg();
    platforms.forEach(function(p){drawPlatform(p);});
    drawGoal();
    coins.forEach(function(c){drawCoin(c);});
    enemies.forEach(function(en){drawEnemy(en);});
    drawParticles();drawPlayer();drawMinimap();drawHint();
  }
  requestAnimationFrame(loop);
}
loop();
})();
</script>
