<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>家族アルバム</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --amber:       #d4832a;
  --amber-dim:   rgba(212,131,42,0.22);
  --amber-light: #f5a93a;
  --bg:          #0f0e09;
  --bg2:         #1a1810;
  --bg3:         #232118;
  --border:      rgba(212,131,42,0.25);
  --text:        #e8e0cc;
  --text-dim:    #8a7f68;
  --radius:      .75rem;

  /* help modal */
  --help-accent:      #d4832a;
  --help-accent-dim:  rgba(212,131,42,0.22);
  --help-bg:          rgba(15,14,9,0.97);
  --help-border:      rgba(212,131,42,0.3);
  --help-text:        #e8e0cc;
  --help-text-dim:    #8a7f68;
  --help-section-bg:  rgba(212,131,42,0.1);
  --help-item-bg:     rgba(255,255,255,0.04);
  --help-btn-size:    2.4rem;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  font-size: 15px;
  overflow-x: hidden;
}

/* ===== LAYOUT ===== */
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-bottom: 4.5rem;
}

/* ===== HEADER ===== */
.app-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: .75rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.app-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--amber-light);
  letter-spacing: .06em;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  z-index: 80;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex;
}
.nav-btn {
  flex: 1;
  padding: .7rem .5rem .55rem;
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: .06em;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .2rem;
  transition: color .15s, background .15s;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}
.nav-btn .nav-icon { font-size: 1.3rem; line-height: 1; }
.nav-btn.active { color: var(--amber-light); }
.nav-btn:active { background: var(--amber-dim); }

/* ===== バッジ ===== */
.nav-badge {
  position: absolute;
  top: .4rem;
  right: calc(50% - 1.1rem);
  min-width: 1.1rem;
  height: 1.1rem;
  background: var(--amber);
  color: #fff;
  font-size: .6rem;
  font-weight: 700;
  border-radius: .55rem;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0 .25rem;
  line-height: 1;
  pointer-events: none;
}
.nav-badge.visible { display: flex; }

/* ===== SCREENS ===== */
.screen { display: none; flex: 1; flex-direction: column; }
.screen.active { display: flex; }

/* ===== SECTION CARD ===== */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: .9rem;
  margin: .75rem .75rem 0;
}
.card-label {
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--amber);
  text-transform: uppercase;
  margin-bottom: .6rem;
}

/* ===== FORM CONTROLS ===== */
input[type="text"], input[type="url"], textarea {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: .5rem;
  color: var(--text);
  font-size: .9rem;
  padding: .55rem .75rem;
  outline: none;
  margin-bottom: .5rem;
  font-family: inherit;
}
input:focus, textarea:focus { border-color: var(--amber); }
textarea { resize: none; }

.file-label {
  display: flex;
  align-items: center;
  gap: .5rem;
  background: var(--bg3);
  border: 1px dashed var(--border);
  border-radius: .5rem;
  padding: .55rem .75rem;
  font-size: .85rem;
  color: var(--text-dim);
  cursor: pointer;
  margin-bottom: .5rem;
  transition: border-color .15s;
}
.file-label:active { border-color: var(--amber); }
input[type="file"] { display: none; }

.btn {
  width: 100%;
  padding: .65rem;
  border: none;
  border-radius: .5rem;
  font-size: .9rem;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: .04em;
  transition: opacity .15s, transform .1s;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(.97); }
.btn-amber { background: var(--amber); color: #fff; }
.btn-amber:hover { background: var(--amber-light); }
.btn-ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
}
.btn-ghost:hover { border-color: var(--amber); color: var(--amber); }
.btn-sm {
  padding: .4rem .7rem;
  font-size: .78rem;
  width: auto;
}
.btn-row { display: flex; gap: .5rem; margin-top: .5rem; }

/* ===== STATUS ===== */
.status-msg {
  font-size: .78rem;
  text-align: center;
  padding: .3rem 0 0;
  font-weight: 700;
  min-height: 1.4rem;
}
.status-ok  { color: #5fcf85; }
.status-err { color: #e05555; }

/* ===== WEBP PREVIEW ===== */
.webp-preview-box {
  border: 1px solid var(--border);
  border-radius: .5rem;
  overflow: hidden;
  margin-bottom: .5rem;
  background: var(--bg3);
}
.webp-preview-box img {
  width: 100%;
  max-height: 180px;
  object-fit: contain;
  display: block;
  background: var(--bg3);
}
.webp-info {
  padding: .4rem .65rem;
  font-size: .72rem;
  color: var(--text-dim);
  display: flex;
  gap: .5rem;
  align-items: center;
  flex-wrap: wrap;
  border-top: 1px solid var(--border);
}
.webp-info .badge-webp {
  background: rgba(95,207,133,.15);
  color: #5fcf85;
  font-size: .65rem;
  font-weight: 700;
  padding: .1rem .4rem;
  border-radius: .25rem;
  flex-shrink: 0;
}
.webp-info .badge-fallback {
  background: rgba(212,131,42,.15);
  color: var(--amber-light);
  font-size: .65rem;
  font-weight: 700;
  padding: .1rem .4rem;
  border-radius: .25rem;
  flex-shrink: 0;
}

/* ===== 検索バー ===== */
.search-bar {
  display: flex;
  align-items: center;
  gap: .5rem;
  margin: .6rem .75rem .1rem;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: .5rem;
  padding: .45rem .7rem;
}
.search-icon { font-size: .95rem; flex-shrink: 0; color: var(--text-dim); }
.search-bar input[type="search"] {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-size: .88rem;
  font-family: inherit;
  margin: 0;
  padding: 0;
}
.search-bar input[type="search"]::placeholder { color: var(--text-dim); }
.search-bar input[type="search"]::-webkit-search-cancel-button { cursor: pointer; }

/* ===== フィルターバー ===== */
.filter-bar {
  display: flex;
  align-items: center;
  gap: .5rem;
  padding: .6rem .75rem .3rem;
}
.filter-bar select {
  flex: 1;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: .5rem;
  color: var(--text);
  font-size: .82rem;
  padding: .4rem .6rem;
  outline: none;
  font-family: inherit;
  -webkit-appearance: none;
  appearance: none;
  cursor: pointer;
}
.filter-bar select:focus { border-color: var(--amber); }
.filter-count {
  font-size: .72rem;
  color: var(--text-dim);
  white-space: nowrap;
  flex-shrink: 0;
}

/* ===== TIMELINE ===== */
.timeline {
  display: flex;
  flex-direction: column;
  gap: .65rem;
  padding: .4rem .75rem 0;
  flex: 1;
}
.timeline-empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  font-size: .85rem;
}

/* ===== MEDIA CARD ===== */
.media-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.media-thumb {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  background: var(--bg3);
  display: block;
}
/* Brave Shields誤爆回避：iframeは意図的にmedia-thumbと別クラスにする */
.yt-frame {
  width: 100%;
  aspect-ratio: 16/9;
  border: none;
  display: block;
  background: #000;
}
.media-thumb-placeholder {
  width: 100%;
  aspect-ratio: 16/9;
  background: var(--bg3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  color: var(--text-dim);
}
.play-overlay {
  position: relative;
  cursor: pointer;
}
.play-icon {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 2.8rem; height: 2.8rem;
  background: rgba(0,0,0,.6);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  color: #fff;
  pointer-events: none;
}
.media-meta {
  padding: .6rem .75rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
}
.media-title {
  font-size: .88rem;
  font-weight: 700;
  color: var(--text);
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.media-date {
  font-size: .7rem;
  color: var(--text-dim);
  flex-shrink: 0;
}
.del-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: .75rem;
  cursor: pointer;
  padding: .2rem .4rem;
  border-radius: .3rem;
  transition: color .15s, background .15s;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.del-btn:hover { color: #e05555; background: rgba(224,85,85,.1); }

.yt-open-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: .8rem;
  font-weight: 700;
  padding: .2rem .4rem;
  border-radius: .3rem;
  text-decoration: none;
  flex-shrink: 0;
  transition: color .15s, background .15s;
  -webkit-tap-highlight-color: transparent;
}
.yt-open-btn:hover { color: var(--amber-light); background: var(--amber-dim); }

/* ===== 編集ボタン ===== */
.edit-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: .75rem;
  cursor: pointer;
  padding: .2rem .4rem;
  border-radius: .3rem;
  transition: color .15s, background .15s;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.edit-btn:hover { color: var(--amber-light); background: var(--amber-dim); }

/* ===== SHARE SCREEN ===== */
.share-card {
  margin: .75rem .75rem 0;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.share-section {
  padding: .9rem;
  border-bottom: 1px solid var(--border);
}
.share-section:last-child { border-bottom: none; }
#qrContainer { margin-top: .75rem; display: flex; justify-content: center; }
#importArea {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: .5rem;
  color: var(--text);
  font-size: .82rem;
  padding: .55rem .75rem;
  width: 100%;
  height: 5rem;
  resize: none;
  font-family: inherit;
  margin-bottom: .5rem;
}

/* ===== PHOTO GRID ===== */
.photo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .5rem;
  padding: .4rem .75rem 0;
  flex: 1;
}
.photo-grid-empty {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 0;
  color: var(--text-dim);
  font-size: .85rem;
}
.photo-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.photo-card-img {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  background: var(--bg3);
  display: block;
  cursor: pointer;
}
.photo-card-placeholder {
  width: 100%;
  aspect-ratio: 1/1;
  background: var(--bg3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  color: var(--text-dim);
}
.photo-card-body {
  padding: .4rem .5rem .45rem;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: .2rem;
}
.photo-card-title {
  font-size: .78rem;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.photo-card-comment {
  font-size: .7rem;
  color: var(--text-dim);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-all;
}
.photo-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: .15rem;
}
.photo-card-date {
  font-size: .65rem;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: .2rem;
  flex-shrink: 0;
}
.shot-badge {
  font-size: .65rem;
  opacity: .75;
  flex-shrink: 0;
}
.photo-card-actions {
  display: flex;
  gap: .25rem;
  flex-shrink: 0;
}
/* モバイル向けタップ領域を44px相当に拡大 */
.photo-card-actions .edit-btn,
.photo-card-actions .del-btn {
  min-width: 2rem;
  min-height: 2rem;
  padding: .3rem .45rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .85rem;
  border-radius: .4rem;
  touch-action: manipulation;
}

/* コメント入力 */
#pComment {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: .5rem;
  color: var(--text);
  font-size: .85rem;
  padding: .55rem .75rem;
  outline: none;
  margin-bottom: .2rem;
  font-family: inherit;
  resize: none;
  height: 4.5rem;
}
#pComment:focus { border-color: var(--amber); }
.char-count {
  font-size: .7rem;
  color: var(--text-dim);
  text-align: right;
  margin-top: -.4rem;
  margin-bottom: .4rem;
}
.char-count.over { color: #e05555; }

/* ===== BADGE ===== */
.type-badge {
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: .07em;
  padding: .15rem .45rem;
  border-radius: .25rem;
  flex-shrink: 0;
}
.badge-video { background: rgba(212,131,42,.2); color: var(--amber-light); }
.badge-photo { background: rgba(95,207,133,.15); color: #5fcf85; }

/* ===== LIGHTBOX ===== */
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 950;
  background: rgba(0,0,0,.92);
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#lightbox.active { display: flex; }
#lbImg {
  max-width: 100%;
  max-height: 75vh;
  object-fit: contain;
  border-radius: .5rem;
  display: block;
  touch-action: pan-y;
}
.lb-meta {
  margin-top: .75rem;
  text-align: center;
  padding: 0 1rem;
}
.lb-title {
  font-size: .95rem;
  font-weight: 700;
  color: var(--text);
}
.lb-comment {
  font-size: .8rem;
  color: var(--text-dim);
  margin-top: .25rem;
  line-height: 1.5;
}
.lb-close {
  position: absolute;
  top: .75rem;
  right: .75rem;
  width: 2.4rem; height: 2.4rem;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.2);
  background: rgba(0,0,0,.6);
  color: #fff;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.lb-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 2.6rem; height: 2.6rem;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.2);
  background: rgba(0,0,0,.6);
  color: #fff;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
#lbPrev { left: .5rem; }
#lbNext { right: .5rem; }
.lb-counter {
  position: absolute;
  top: .85rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: .72rem;
  color: rgba(255,255,255,.5);
  letter-spacing: .06em;
}

/* ===== EDIT MODAL ===== */
#editOverlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 920;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
#editOverlay.active { display: flex; }
#editModal {
  width: 100%;
  max-width: 440px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 1rem;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,.6);
}
.edit-modal-header {
  padding: .85rem 1rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.edit-modal-title {
  font-size: .95rem;
  font-weight: 700;
  color: var(--amber-light);
}
.edit-modal-close {
  width: 2rem; height: 2rem;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-size: 1.1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.edit-modal-body { padding: 1rem; }
#editTitle {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: .5rem;
  color: var(--text);
  font-size: .9rem;
  padding: .55rem .75rem;
  outline: none;
  margin-bottom: .5rem;
  font-family: inherit;
}
#editTitle:focus { border-color: var(--amber); }
#editComment {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: .5rem;
  color: var(--text);
  font-size: .85rem;
  padding: .55rem .75rem;
  outline: none;
  font-family: inherit;
  resize: none;
  height: 4.5rem;
  margin-bottom: .25rem;
}
#editComment:focus { border-color: var(--amber); }
.edit-char-count {
  font-size: .7rem;
  color: var(--text-dim);
  text-align: right;
  margin-bottom: .6rem;
}
.edit-char-count.over { color: #e05555; }
#editStatus { margin-top: .3rem; }

/* ===== HELP MODAL CSS ===== */
#helpBtn {
  width: var(--help-btn-size);
  height: var(--help-btn-size);
  border-radius: 50%;
  border: 1.5px solid var(--help-border);
  background: var(--help-bg);
  color: var(--help-accent);
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .2s, transform .15s;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 0 10px rgba(212,131,42,.2);
}
#helpBtn:hover  { background: var(--help-accent-dim); transform: scale(1.08); }
#helpBtn:active { transform: scale(.95); }

#helpOverlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 910;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
#helpOverlay.active { display: flex; }

#helpModal {
  position: relative;
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  background: var(--help-bg);
  border: 1px solid var(--help-border);
  border-radius: 1rem;
  overflow: hidden;
  display: flex;
  flex-direction: column;

<script>
(function() {
/* ========================================================
   Utils
   ======================================================== */
function getYouTubeId(url) {
  if (!url) return null;
  // 対応形式：
  //   https://www.youtube.com/watch?v=XXXXXXXXXXX
  //   https://youtu.be/XXXXXXXXXXX
  //   https://youtube.com/shorts/XXXXXXXXXXX
  //   https://www.youtube.com/embed/XXXXXXXXXXX
  //   https://music.youtube.com/watch?v=XXXXXXXXXXX
  //   上記に ?si= ?t= &list= 等のパラメータが付いても正しく抽出
  var patterns = [
    /[?&]v=([A-Za-z0-9_-]{11})/,          // watch?v=
    /youtu\.be\/([A-Za-z0-9_-]{11})/,      // youtu.be/
    /\/shorts\/([A-Za-z0-9_-]{11})/,       // /shorts/
    /\/embed\/([A-Za-z0-9_-]{11})/,        // /embed/
    /\/v\/([A-Za-z0-9_-]{11})/             // /v/（旧形式）
  ];
  for (var i = 0; i < patterns.length; i++) {
    var m = url.match(patterns[i]);
    if (m && m[1].length === 11) return m[1];
  }
  return null;
}

/* WebP対応確認（canvasがwebp出力できるか一度だけチェック） */
var WEBP_SUPPORTED = (function() {
  var c = document.createElement('canvas');
  c.width = 1; c.height = 1;
  return c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
})();

function compressImage(file) {
  return new Promise(function(res, rej) {
    var img = new Image();
    var r = new FileReader();
    r.onload = function(e) { img.src = e.target.result; };
    r.onerror = function() { rej(new Error('ファイル読み込みに失敗しました')); };
    img.onload = function() {
      try {
        var MAX = 900;
        var scale = Math.min(1, MAX / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width  = img.width  * scale;
        c.height = img.height * scale;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        // WebP対応ブラウザはWebP、非対応はJPEGにフォールバック
        var dataUrl = WEBP_SUPPORTED
          ? c.toDataURL('image/webp', 0.80)
          : c.toDataURL('image/jpeg', 0.65);
        res(dataUrl);
      } catch(e2) { rej(e2); }
    };
    img.onerror = function() { rej(new Error('画像の読み込みに失敗しました')); };
    r.readAsDataURL(file);
  });
}

function fmtDate(ts) {
  var d = new Date(ts);
  return (d.getMonth()+1) + '/' + d.getDate();
}

function fmtYearMonth(ts) {
  var d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function fmtYearMonthLabel(ym) {
  var parts = ym.split('-');
  return parts[0] + '年' + parseInt(parts[1]) + '月';
}

/* EXIF から撮影日タイムスタンプを取得（バイナリ解析・外部ライブラリ不使用）
   DateTimeOriginal タグ(0x9003) を探してパース。取得できなければ null を返す */
function extractShotAt(file) {
  return new Promise(function(res) {
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var buf  = e.target.result;
        var view = new DataView(buf);
        // JPEGマジック確認
        if (view.getUint16(0) !== 0xFFD8) { res(null); return; }
        var offset = 2;
        while (offset < buf.byteLength - 4) {
          var marker = view.getUint16(offset);
          var len    = view.getUint16(offset + 2);
          if (marker === 0xFFE1) { // APP1 = EXIF
            var exifOffset = offset + 4;
            // "Exif\0\0" ヘッダ確認
            if (view.getUint32(exifOffset) !== 0x45786966) { res(null); return; }
            var tiffStart  = exifOffset + 6;
            var littleEnd  = view.getUint16(tiffStart) === 0x4949;
            var ifdOffset  = tiffStart + view.getUint32(tiffStart + 4, littleEnd);
            var numEntries = view.getUint16(ifdOffset, littleEnd);
            var found      = null;
            for (var i = 0; i < numEntries; i++) {
              var base = ifdOffset + 2 + i * 12;
              var tag  = view.getUint16(base, littleEnd);
              if (tag === 0x8769) { // ExifIFD pointer
                var exifIfd = tiffStart + view.getUint32(base + 8, littleEnd);
                var ne2     = view.getUint16(exifIfd, littleEnd);
                for (var j = 0; j < ne2; j++) {
                  var b2 = exifIfd + 2 + j * 12;
                  if (view.getUint16(b2, littleEnd) === 0x9003) { // DateTimeOriginal
                    var strOff = tiffStart + view.getUint32(b2 + 8, littleEnd);
                    var str = '';
                    for (var k = 0; k < 19; k++) str += String.fromCharCode(view.getUint8(strOff + k));
                    found = str; break;
                  }
                }
                break;
              }
            }
            if (!found) { res(null); return; }
            // "YYYY:MM:DD HH:MM:SS" → timestamp
            var p = found.split(/[: ]/);
            var d = new Date(+p[0], +p[1]-1, +p[2], +p[3], +p[4], +p[5]);
            res(isNaN(d.getTime()) ? null : d.getTime());
            return;
          }
          if (marker === 0xFFDA) break; // SOS
          offset += 2 + len;
        }
        res(null);
      } catch(err) { res(null); }
    };
    reader.onerror = function() { res(null); };
    // 先頭64KBだけ読めばEXIFは十分
    reader.readAsArrayBuffer(file.slice(0, 65536));
  });
}

function esc(str) {
  return String(str || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function status(elId, msg, type) {
  var el = document.getElementById(elId);
  if (!el) return;
  el.textContent = msg;
  el.className = 'status-msg' + (type === 'ok' ? ' status-ok' : type === 'err' ? ' status-err' : '');
}

/* ========================================================
   DOM refs（よく使うもの）
   ======================================================== */
var DOM = {
  vFilter:       document.getElementById('vFilter'),
  vCount:        document.getElementById('vCount'),
  pFilter:       document.getElementById('pFilter'),
  pCount:        document.getElementById('pCount'),
  badgeVideo:    document.getElementById('badgeVideo'),
  badgePhoto:    document.getElementById('badgePhoto'),
  videoTimeline: document.getElementById('videoTimeline'),
  photoTimeline: document.getElementById('photoTimeline'),
  lbImg:         document.getElementById('lbImg'),
  lbTitle:       document.getElementById('lbTitle'),
  lbComment:     document.getElementById('lbComment'),
  lbCounter:     document.getElementById('lbCounter'),
  lbPrev:        document.getElementById('lbPrev'),
  lbNext:        document.getElementById('lbNext'),
  lightbox:      document.getElementById('lightbox'),
  editOverlay:   document.getElementById('editOverlay'),
  editTitle:     document.getElementById('editTitle'),
  editComment:   document.getElementById('editComment'),
  editCharCount: document.getElementById('editCharCount')
};

/* ========================================================
   State
   ======================================================== */
var lbList    = [];   // 現在表示中の写真リスト
var lbIndex   = 0;
var lbImgCache = {}; // imageId -> dataURL
var editingId = null; // 編集中のメタID

/* ========================================================
   DB / STORAGE
   ======================================================== */
var META_KEY = 'familyAlbum_meta';
var SYNC_KEY = 'familyAlbum_sync';
var DB_NAME  = 'familyAlbumDB';
var STORE    = 'images';

function openDB() {
  return new Promise(function(res, rej) {
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function(e) { e.target.result.createObjectStore(STORE); };
    req.onsuccess = function(e) { res(e.target.result); };
    req.onerror   = rej;
  });
}
function saveImage(id, data) {
  return openDB().then(function(db) {
    return new Promise(function(res, rej) {
      var tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(data, id);
      tx.oncomplete = res;
      tx.onerror    = rej;
    });
  });
}
function getImage(id) {
  return openDB().then(function(db) {
    return new Promise(function(res) {
      var req = db.transaction(STORE, 'readonly').objectStore(STORE).get(id);
      req.onsuccess = function() { res(req.result); };
      req.onerror   = function() { res(null); };
    });
  });
}
function deleteImage(id) {
  return openDB().then(function(db) {
    var tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
  });
}

function loadMeta() { return JSON.parse(localStorage.getItem(META_KEY) || '[]'); }
function saveMeta(d) { localStorage.setItem(META_KEY, JSON.stringify(d)); }
function lastSync()  { return parseInt(localStorage.getItem(SYNC_KEY) || '0'); }
function setSync()   { localStorage.setItem(SYNC_KEY, Date.now()); }

/* ========================================================
   バッジ更新
   ======================================================== */
function updateBadges() {
  var meta = loadMeta();
  var vCount = 0; var pCount = 0;
  for (var i = 0; i < meta.length; i++) {
    if (meta[i].type === 'video') vCount++;
    else if (meta[i].type === 'photo') pCount++;
  }
  setBadge(DOM.badgeVideo, vCount);
  setBadge(DOM.badgePhoto, pCount);
}
function setBadge(el, n) {
  if (n > 0) {
    el.textContent = n > 99 ? '99+' : String(n);
    el.className = 'nav-badge visible';
  } else {
    el.className = 'nav-badge';
  }
}

/* ========================================================
   フィルターセレクト構築
   ======================================================== */
function buildFilter(type, selectEl) {
  var meta    = loadMeta().filter(function(x) { return x.type === type; });
  var ymSet   = {};
  var sortKey = (type === 'photo')
    ? ((document.getElementById('pSort') || {}).value || 'createdAt')
    : 'createdAt';

  for (var i = 0; i < meta.length; i++) {
    var ts = (sortKey === 'shotAt' && meta[i].shotAt) ? meta[i].shotAt : meta[i].createdAt;
    ymSet[fmtYearMonth(ts)] = true;
  }
  var yms     = Object.keys(ymSet).sort().reverse();
  var current = selectEl.value;
  selectEl.innerHTML = '<option value="">すべて</option>';
  for (var j = 0; j < yms.length; j++) {
    var opt = document.createElement('option');
    opt.value       = yms[j];
    opt.textContent = fmtYearMonthLabel(yms[j]);
    selectEl.appendChild(opt);
  }
  if (current && ymSet[current]) selectEl.value = current;
}

/* ========================================================
   TAB SWITCHING
   ======================================================== */
window.switchTab = function(tab) {
  var tabs = ['video','photo','share'];
  for (var i = 0; i < tabs.length; i++) {
    var t = tabs[i];
    var cap = t.charAt(0).toUpperCase() + t.slice(1);
    document.getElementById('screen' + cap).classList.toggle('active', t === tab);
    document.getElementById('nav'    + cap).classList.toggle('active', t === tab);
  }
  if (tab === 'video') renderVideos();
  if (tab === 'photo') renderPhotos().catch(function(e) { console.error(e); });
};

/* ========================================================
   VIDEO — 追加
   ======================================================== */
window.addVideo = function() {
  var title   = document.getElementById('vTitle').value.trim();
  var url     = document.getElementById('vUrl').value.trim();
  var videoId = getYouTubeId(url);

  if (!title || !videoId) {
    status('vStatus', '⚠️ タイトルと有効なYouTube URLを入力してください', 'err');
    return;
  }
  var meta = loadMeta();

/* ========================================================
   PHOTO — 追加
   ======================================================== */
window.onFileChange = async function(input) {
  var file = input.files[0];
  var wrap = document.getElementById('webpPreviewWrap');
  var info = document.getElementById('webpInfo');
  var prev = document.getElementById('webpPreviewImg');

  if (!file) {
    document.getElementById('pFileName').textContent = '写真を選ぶ…';
    wrap.style.display = 'none';
    return;
  }

  document.getElementById('pFileName').textContent = file.name;
  status('pStatus', '⏳ WebP変換中…', '');

  try {
    var originalKB   = Math.round(file.size / 1024);
    var converted    = await compressImage(file);
    var convertedKB  = Math.round((converted.length * 3 / 4) / 1024);
    var saved = originalKB > 0 ? Math.round((1 - convertedKB / originalKB) * 100) : 0;

    prev.src = converted;
    var badge = WEBP_SUPPORTED
      ? '<span class="badge-webp">WebP</span>'
      : '<span class="badge-fallback">JPEG</span>';
    info.innerHTML =
      badge +
      '元: ' + originalKB + 'KB → 変換後: ' + convertedKB + 'KB' +
      (saved > 0 ? ' <strong style="color:#5fcf85">▼' + saved + '%</strong>' : '');

    wrap.style.display = 'block';
    status('pStatus', '', '');
  } catch(e) {
    wrap.style.display = 'none';
    status('pStatus', '⚠️ プレビュー生成に失敗しました', 'err');
  }
};

window.updateCharCount = function() {
  var v  = document.getElementById('pComment').value.length;
  var el = document.getElementById('charCount');
  el.textContent = v + ' / 140';
  el.className   = 'char-count' + (v > 140 ? ' over' : '');
};

window.addPhoto = async function() {
  var title   = document.getElementById('pTitle').value.trim();
  var comment = document.getElementById('pComment').value.trim();
  var file    = document.getElementById('pFile').files[0];

  if (!title || !file) {
    status('pStatus', '⚠️ タイトルと写真を指定してください', 'err');
    return;
  }
  if (comment.length > 140) {
    status('pStatus', '⚠️ コメントは140文字以内にしてください', 'err');
    return;
  }
  status('pStatus', '⏳ 保存中…', '');
  try {
    var shotAt = await extractShotAt(file);

    // プレビュー済みのデータがあればそのまま使う（二重変換を防ぐ）
    var prev = document.getElementById('webpPreviewImg');
    var compressed = (prev && prev.src && prev.src.indexOf('data:image') === 0)
      ? prev.src
      : await compressImage(file);

    var imageId = 'img_' + Date.now();
    await saveImage(imageId, compressed);

    var meta = loadMeta();
    meta.push({ id: 'p_' + Date.now(), type: 'photo', title: title, comment: comment, imageId: imageId, createdAt: Date.now(), shotAt: shotAt });
    if (meta.length > 300) meta.shift();
    saveMeta(meta);

    document.getElementById('pTitle').value   = '';
    document.getElementById('pFile').value    = '';
    document.getElementById('pComment').value = '';
    document.getElementById('pFileName').textContent = '写真を選ぶ…';
    document.getElementById('webpPreviewWrap').style.display = 'none';
    prev.src = '';
    updateCharCount();
    status('pStatus', '✨ 写真を保存しました', 'ok');
    await renderPhotos();
    updateBadges();
  } catch(e) {
    status('pStatus', '⚠️ 保存に失敗しました', 'err');
    console.error(e);
  }
};

/* ========================================================
   PHOTO — 描画
   ======================================================== */
window.renderPhotos = async function() {
  buildFilter('photo', DOM.pFilter);
  var ym      = DOM.pFilter.value;
  var sortKey = (document.getElementById('pSort') || {}).value || 'createdAt';

  var all = loadMeta().filter(function(x) { return x.type === 'photo'; });

  // ソート
  all.sort(function(a, b) {
    var ta = (sortKey === 'shotAt' && a.shotAt) ? a.shotAt : a.createdAt;
    var tb = (sortKey === 'shotAt' && b.shotAt) ? b.shotAt : b.createdAt;
    return tb - ta;
  });

  // 年月フィルター（shotAt優先）
  var list = ym ? all.filter(function(x) {
    var ts = (sortKey === 'shotAt' && x.shotAt) ? x.shotAt : x.createdAt;
    return fmtYearMonth(ts) === ym;
  }) : all;

  // キーワード検索（タイトル・コメント）
  var q = (document.getElementById('pSearch') || {}).value || '';
  var qLower = q.trim().toLowerCase();
  if (qLower) list = list.filter(function(x) {
    return (x.title  || '').toLowerCase().indexOf(qLower) !== -1 ||
           (x.comment|| '').toLowerCase().indexOf(qLower) !== -1;
  });

  DOM.pCount.textContent = list.length + '件';
  DOM.photoTimeline.innerHTML = '';

  if (!list.length) {
    var emptyMsg = qLower ? '一致する写真がありません' : (ym ? 'この月の写真はありません' : '写真がまだありません');
    DOM.photoTimeline.innerHTML = '<div class="photo-grid-empty">' + emptyMsg + '</div>';
    return;
  }

  lbList = list.slice();

  for (var i = 0; i < list.length; i++) {
    var item    = list[i];
    var imgData = await getImage(item.imageId);
    if (imgData) lbImgCache[item.imageId] = imgData;

    var card = document.createElement('div');
    card.className = 'photo-card';

    var imgPart = imgData
      ? '<img class="photo-card-img" src="' + imgData + '" alt="' + esc(item.comment || item.title) + '" loading="lazy" onclick="openLightbox(' + i + ')">'
      : '<div class="photo-card-placeholder">🖼️</div>';

    var commentPart = item.comment
      ? '<div class="photo-card-comment">' + esc(item.comment) + '</div>'
      : '';

    // 表示日：撮影日優先
    var displayTs  = (item.shotAt) ? item.shotAt : item.createdAt;
    var shotBadge  = item.shotAt ? '<span class="shot-badge">📷</span>' : '';

    var id    = esc(item.id);
    var imgId = esc(item.imageId);

    card.innerHTML =
      imgPart +
      '<div class="photo-card-body">' +
        '<div class="photo-card-title">' + esc(item.title) + '</div>' +
        commentPart +
        '<div class="photo-card-footer">' +
          '<span class="photo-card-date">' + shotBadge + fmtDate(displayTs) + '</span>' +
          '<div class="photo-card-actions">' +
            '<button class="edit-btn" onclick="openEditModal(\'' + id + '\')">✏️</button>' +
            '<button class="del-btn"  onclick="removeItem(\'' + id + '\',\'photo\',\'' + imgId + '\')">🗑</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    DOM.photoTimeline.appendChild(card);
  }
};

window.openLightbox = async function(idx) {
  lbIndex = idx;
  await lbShow();
  DOM.lightbox.classList.add('active');
};

async function lbShow() {
  var item = lbList[lbIndex];
  if (!item) return;

  // 画像取得（キャッシュ優先）
  var imgData = lbImgCache[item.imageId] || (await getImage(item.imageId));
  if (imgData) lbImgCache[item.imageId] = imgData;

  DOM.lbImg.src        = imgData || '';
  DOM.lbTitle.textContent   = item.title || '';
  DOM.lbComment.textContent = item.comment || '';
  DOM.lbCounter.textContent = (lbIndex + 1) + ' / ' + lbList.length;
  DOM.lbPrev.style.display = lbIndex > 0 ? 'flex' : 'none';
  DOM.lbNext.style.display = lbIndex < lbList.length - 1 ? 'flex' : 'none';
}

window.lbMove = async function(dir) {
  var next = lbIndex + dir;
  if (next < 0 || next >= lbList.length) return;
  lbIndex = next;
  await lbShow();
};

window.closeLightbox = function() {
  DOM.lightbox.classList.remove('active');
};

/* ========================================================
   ZIP ダウンロード
   ======================================================== */
window.downloadZip = async function() {
  if (typeof JSZip === 'undefined') {
    alert('JSZipが読み込まれていません。オンライン環境で開いてください。');
    return;
  }
  var photos = loadMeta().filter(function(x) { return x.type === 'photo'; });
  if (!photos.length) {
    alert('写真がありません。');
    return;
  }

  var zip     = new JSZip();
  var folder  = zip.folder('family-album');
  var count   = 0;

  for (var i = 0; i < photos.length; i++) {
    var item    = photos[i];
    var imgData = await getImage(item.imageId);
    if (!imgData) continue;

    // data:image/jpeg;base64,... → base64部分だけ抽出
    var base64 = imgData.split(',')[1];
    if (!base64) continue;

    // ファイル名：日付_タイトル.jpg
    var d    = new Date((item.shotAt || item.createdAt));
    var dateStr = d.getFullYear() + ('0'+(d.getMonth()+1)).slice(-2) + ('0'+d.getDate()).slice(-2);
    var safeName = item.title.replace(/[\\/:*?"<>|]/g, '_').slice(0, 40);
    var ext      = imgData.indexOf('data:image/webp') === 0 ? '.webp' : '.jpg';
    var fileName = dateStr + '_' + safeName + '_' + (i+1) + ext;

    folder.file(fileName, base64, { base64: true });
    count++;
  }

  if (!count) { alert('保存できる写真がありません。'); return; }

  var blob = await zip.generateAsync({ type: 'blob' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href     = url;
  a.download = 'family-album_' + new Date().toISOString().slice(0,10) + '.zip';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

// スワイプ対応
(function() {
  var startX = 0;
  DOM.lightbox.addEventListener('touchstart', function(e) {
    startX = e.touches[0].clientX;
  }, { passive: true });
  DOM.lightbox.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 50) lbMove(dx < 0 ? 1 : -1);
  }, { passive: true });
  // 背景タップで閉じる（画像・ナビ以外）
  DOM.lightbox.addEventListener('click', function(e) {
    if (e.target === DOM.lightbox) closeLightbox();
  });
})();

window.openEditModal = function(id) {
  var meta = loadMeta();
  var item = null;
  for (var i = 0; i < meta.length; i++) {
    if (meta[i].id === id) { item = meta[i]; break; }
  }
  if (!item) return;

  editingId = id;
  DOM.editTitle.value   = item.title   || '';
  DOM.editComment.value = item.comment || '';
  updateEditCharCount();
  status('editStatus', '', '');
  DOM.editOverlay.classList.add('active');
};

window.closeEditModal = function() {
  DOM.editOverlay.classList.remove('active');
  editingId = null;
};

window.updateEditCharCount = function() {
  var v  = DOM.editComment.value.length;
  DOM.editCharCount.textContent = v + ' / 140';
  DOM.editCharCount.className   = 'edit-char-count' + (v > 140 ? ' over' : '');
};

window.saveEdit = function() {
  if (!editingId) return;
  var newTitle   = DOM.editTitle.value.trim();
  var newComment = DOM.editComment.value.trim();

  if (!newTitle) {
    status('editStatus', '⚠️ タイトルを入力してください', 'err');
    return;
  }
  if (newComment.length > 140) {
    status('editStatus', '⚠️ コメントは140文字以内にしてください', 'err');
    return;
  }

  var meta     = loadMeta();
  var itemType = 'photo';
  for (var i = 0; i < meta.length; i++) {
    if (meta[i].id === editingId) {
      itemType        = meta[i].type;
      meta[i].title   = newTitle;
      meta[i].comment = newComment;
      break;
    }
  }
  saveMeta(meta);
  closeEditModal();
  if (itemType === 'video') {
    renderVideos();
  } else {
    renderPhotos().catch(function(e) { console.error(e); });
  }
};

   DELETE
   ======================================================== */
window.removeItem = async function(id, type, imageId) {
  // confirm()はAndroid Braveでブロックされる場合があるためwindow.confirmを明示
  if (!window.confirm('削除しますか？')) return;
  saveMeta(loadMeta().filter(function(x) { return x.id !== id; }));
  if (type === 'photo' && imageId) {
    try { await deleteImage(imageId); } catch(e) { console.error(e); }
    delete lbImgCache[imageId];
    renderPhotos().catch(function(e) { console.error(e); });
  } else {
    renderVideos();
  }
  updateBadges();
};

/* ========================================================
   SHARE — エクスポート
   ======================================================== */
window.exportVideos = function() {
  var ls   = lastSync();
  var diff = loadMeta().filter(function(x) { return x.type === 'video' && x.createdAt > ls; });
  if (!diff.length) {
    status('exportStatus', '差分の動画がありません', 'err');
    return;
  }
  var txt = btoa(unescape(encodeURIComponent(JSON.stringify({ data: diff }))));
  navigator.clipboard.writeText(txt).then(function() {
    setSync();
    status('exportStatus', '✅ ' + diff.length + '件コピーしました', 'ok');
  }).catch(function() { status('exportStatus', 'コピー失敗', 'err'); });
};

window.showQR = function() {
  var ls   = lastSync();
  var diff = loadMeta().filter(function(x) { return x.type === 'video' && x.createdAt > ls; }).slice(0, 5);
  var qr   = document.getElementById('qrContainer');
  qr.innerHTML = '';

    qr.innerHTML = '<p style="font-size:.8rem;color:var(--text-dim);">差分の動画がありません</p>';
    return;

  new QRCode(qr, { text: txt, width: 160, height: 160 });
  setSync();
};

/* ========================================================
   SHARE — インポート
   ======================================================== */
window.importData = async function() {
  var raw = document.getElementById('importArea').value.trim();
  if (!raw) { status('importStatus', 'コードを貼り付けてください', 'err'); return; }
  try {
    var obj      = JSON.parse(decodeURIComponent(escape(atob(raw))));
    var incoming = obj.data || [];
    for (var i = 0; i < incoming.length; i++) {
      var item = incoming[i];
      if (item.type === 'photo' && item.imageDataBody) {
        await saveImage(item.imageId, item.imageDataBody);
        delete item.imageDataBody;
      }
    }
    var map = {};
    var all = loadMeta().concat(incoming);
    for (var j = 0; j < all.length; j++) {
      var x = all[j];
      if (!map[x.id] || x.createdAt > map[x.id].createdAt) map[x.id] = x;
    }
    var merged = [];
    var keys = Object.keys(map);
    for (var k = 0; k < keys.length; k++) merged.push(map[keys[k]]);
    saveMeta(merged);
    setSync();
    document.getElementById('importArea').value = '';
    status('importStatus', '✅ ' + incoming.length + '件を同期しました', 'ok');
    updateBadges();
  } catch(e) {
    status('importStatus', '⚠️ 同期エラー：正しいコードを確認してください', 'err');
    console.error(e);
  }
};

        '<div class="lesson-label">③ URL正規表現</div>' +
        'getYouTubeId()はパターン配列で順番にマッチし、必ず11桁のIDのみ返す設計。<br>' +
        'watch?v= / youtu.be/ / shorts/ / embed/ / v/ の5形式に対応。music.youtube.comも動作する。' +
        '<div class="lesson-label">④ 次回Claudeへの指示</div>' +
        '動画をバイナリ保存する設計には変えないこと。yt-frameクラスを維持すること。正規表現パターン配列を崩さないこと。'
    },
    {
      title: '写真転送はBase64のサイズ上限に注意',
      body:
        '<div class="lesson-label">① 問題</div>' +
        '写真1枚をBase64化するとJPEG800px・Q65でも100〜300KB、LINEコピペで2〜3枚が現実的な上限。' +
        '<div class="lesson-label">② 対処</div>' +
        '写真の差分コピー機能は実装せず「写真は共有タブ対象外」と割り切った。<br>' +
        '写真はローカル専用、動画のみ共有対象とした。' +
        '<div class="lesson-label">③ 次回Claudeへの指示</div>' +
        '写真のexportDiff的な機能を追加しないこと。写真共有の要求が来たら代替手段を案内すること。'

      title: 'ライトボックスはキャッシュ済みDataURLを再利用',
      body:
        '<div class="lesson-label">① 設計</div>' +
        'renderPhotos()でIndexedDBから読んだimgDataをlbImgCacheに保持し、ライトボックス表示時に再利用。<br>' +
        'フィルター変更のたびにDBを叩かないよう設計した。' +
        '<div class="lesson-label">② 注意</div>' +

        '<div class="lesson-label">③ 次回Claudeへの指示</div>' +
        'ライトボックスのlbListはrenderPhotos()で更新されるため、フィルター後のインデックスと一致する。'
    },
    {
      title: 'EXIF撮影日はバイナリ解析で取得（外部ライブラリ不使用）',
      body:
        '<div class="lesson-label">① 設計</div>' +
        'extractShotAt()がFileをArrayBufferで先頭64KBだけ読み、JPEG APP1セグメントから' +
        'DateTimeOriginal(0x9003)タグを手動パース。exifr等の外部ライブラリは使っていない。' +
        '<div class="lesson-label">② 取得できない場合</div>' +
        'EXIFなし・PNG・スクショ等はshotAt=nullになりcreatedAt（登録日）で表示。📷バッジは出ない。' +
        '<div class="lesson-label">③ 次回Claudeへの指示</div>' +

    {
      title: 'WebP変換は選択時にプレビュー済みデータを再利用',
      body:

        'onFileChange()で写真選択時にcompressImage()を呼びWebP変換→プレビュー表示。<br>' +
        'addPhoto()保存時はプレビューのsrc（data:image/webp...）をそのまま再利用し二重変換しない。' +
        '<div class="lesson-label">② フォールバック</div>' +
        'WEBP_SUPPORTED定数でcanvasのWebP出力対応を初期化時に1回だけチェック。<br>' +
        '非対応ブラウザは自動でJPEG(Q65)にフォールバックし、バッジ表示も切り替わる。' +

        'compressImage()のフォーマット分岐（WEBP_SUPPORTED）を崩さないこと。<br>' +

};

var COMMON_PROMPT =
'【前提条件（必ず守れ）】\n' +
'- ブラウザ単体アプリ（API・サーバーなし、vanilla HTML/CSS/JS）\n' +
'- 動画：YouTube ID保存 → ストリーミング再生（バイナリ保存禁止）\n' +
'- 写真：IndexedDB に WebP（非対応時はJPEG）で保存\n' +
'- WebP変換はonFileChange()時にプレビュー済み、addPhoto()で再利用（二重変換禁止）\n' +
'- WEBP_SUPPORTED定数で対応チェック済み（初期化時1回のみ）\n' +
'- localStorage / IndexedDB 使用あり\n' +
'- モバイル前提（Android Brave、タップ操作）\n' +
'- 既存機能を削除するな\n' +
'- UIを破壊するな\n' +
'- 写真の差分エクスポートは実装しない\n' +
'- EXIF撮影日はextractShotAt()で手動パース済み（exifr等の外部ライブラリ追加禁止）\n' +
'- ZIPはJSZip（cdnjs）を使用。写真共有用途に転用しないこと\n' +
'- iframeクラスはyt-frame固定（Brave Shields誤爆回避）\n' +
'- getYouTubeId()はパターン配列・11桁限定（正規表現を崩さないこと）\n';

function stripHtml(html) {
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  return (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
}
function buildPrompt() {
  var lines = [COMMON_PROMPT, '【このアプリの教訓（過去のバグ・制約）】'];
  for (var i = 0; i < helpData.lessons.length; i++) {
    var l = helpData.lessons[i];
    lines.push('・' + l.title + '\n  ' + stripHtml(l.body));
  }
  return lines.join('\n');
}
function copyPrompt() {
  navigator.clipboard.writeText(buildPrompt()).then(function() {
    alert('コピーしました！\nClaude にそのまま貼ってください。');
  }).catch(function() {
    alert('コピー失敗。手動でコピーしてください。');
  });
}

(function initHelpModal() {
  var overlay  = document.getElementById('helpOverlay');
  var body     = document.getElementById('helpBody');
  var openBtn  = document.getElementById('helpBtn');
  var closeBtn = document.getElementById('helpCloseBtn');

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderHelp() {
    body.innerHTML = '';
    body.appendChild(makeSection('📖 使い方',       helpData.howto,   'howto'));
    body.appendChild(makeSection('🧠 Claude用教訓', helpData.lessons, 'lesson'));
  }

  function makeSection(label, items, prefix) {
    var wrap  = document.createElement('div');
    var title = document.createElement('div');
    title.className   = 'help-section-title';
    title.textContent = label;
    wrap.appendChild(title);

    for (var i = 0; i < items.length; i++) {
      (function(item, idx) {
        var id      = prefix + '-' + idx;
        var row     = document.createElement('div');
        row.className = 'help-item';

        var trigger = document.createElement('button');
        trigger.className = 'help-item-trigger';
        trigger.setAttribute('aria-expanded', 'false');
        trigger.setAttribute('aria-controls', id);
        trigger.innerHTML = '<span>' + escHtml(item.title) + '</span><span class="help-chevron">▼</span>';

        var panel = document.createElement('div');
        panel.className = 'help-item-body';
        panel.id        = id;
        panel.innerHTML = item.body;

        trigger.onclick = function() {
          var isOpen = trigger.classList.contains('open');
          var triggers = wrap.querySelectorAll('.help-item-trigger.open');
          for (var t = 0; t < triggers.length; t++) {
            triggers[t].classList.remove('open');
            triggers[t].setAttribute('aria-expanded', 'false');
            document.getElementById(triggers[t].getAttribute('aria-controls')).classList.remove('open');
          }
          if (!isOpen) {
            trigger.classList.add('open');
            trigger.setAttribute('aria-expanded', 'true');
            panel.classList.add('open');
          }
        };

        row.appendChild(trigger);
        row.appendChild(panel);
        wrap.appendChild(row);
      })(items[i], i);
    }
    return wrap;
  }

  function openModal()  { renderHelp(); overlay.classList.add('active'); document.body.style.overflow = 'hidden'; }
  function closeModal() { overlay.classList.remove('active'); document.body.style.overflow = ''; }

  openBtn.onclick  = openModal;
  closeBtn.onclick = closeModal;
  document.getElementById('helpCopyPromptBtn').onclick = copyPrompt;
  overlay.onclick = function(e) { if (e.target === overlay) closeModal(); };
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
})();

// editOverlay 背景タップで閉じる
DOM.editOverlay.onclick = function(e) { if (e.target === DOM.editOverlay) closeEditModal(); };

updateBadges();

})(); // IIFE end
