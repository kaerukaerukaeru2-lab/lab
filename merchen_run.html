<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MERCHEN RUN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;background:#1a0830;}
#gc{display:block;position:fixed;top:0;left:0;touch-action:none;}
#livesDiv{position:fixed;top:12px;left:14px;font:700 20px/1 "Helvetica Neue",sans-serif;color:#ff80cc;text-shadow:0 0 8px #ff40aa;z-index:5;pointer-events:none;}
#scoreDiv{position:fixed;top:12px;right:14px;font:700 20px/1 "Helvetica Neue",sans-serif;color:#ffe0ff;text-shadow:0 0 8px #c060ff;z-index:5;pointer-events:none;}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(20,0,40,0.85);}
#overlay h2{font:700 30px/1.4 "Helvetica Neue",sans-serif;color:#ffb0ff;margin-bottom:10px;text-align:center;}
#overlay p{font:400 18px/1.6 "Helvetica Neue",sans-serif;color:#dda0ff;margin-bottom:40px;text-align:center;}
#actionBtn{font:700 22px/1 "Helvetica Neue",sans-serif;color:#fff;background:linear-gradient(135deg,#a030e0,#6010c0);border:none;border-radius:50px;padding:20px 70px;cursor:pointer;}
#startOverlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(20,0,40,0.92);}
#startOverlay h1{font:700 30px/1.4 "Helvetica Neue",sans-serif;color:#ffb0ff;margin-bottom:12px;text-align:center;}
#startOverlay p{font:400 16px/1.8 "Helvetica Neue",sans-serif;color:#cc80ff;margin-bottom:6px;text-align:center;padding:0 30px;}
#startBtn{font:700 22px/1 "Helvetica Neue",sans-serif;color:#fff;background:linear-gradient(135deg,#e040a0,#a020c0);border:none;border-radius:50px;padding:20px 70px;cursor:pointer;margin-top:28px;}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="livesDiv">❤ 3</div>
<div id="scoreDiv">SCORE 0</div>
<div id="startOverlay">
  <h1>✨ MERCHEN RUN ✨</h1>
  <p>画面左側タップ → ジャンプ<br>空中でもう一回 → 二段ジャンプ<br>画面右側タップ → パンチ</p>
  <button id="startBtn">START !</button>
</div>
<div id="overlay">
  <h2 id="overlayTitle">GAME OVER</h2>
  <p id="overlayMsg">SCORE: 0</p>
  <button id="actionBtn">RETRY</button>
</div>
<script>
(function(){
const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');
const scoreDiv=document.getElementById('scoreDiv');
const livesDiv=document.getElementById('livesDiv');
const overlay=document.getElementById('overlay');
const overlayTitle=document.getElementById('overlayTitle');
const overlayMsg=document.getElementById('overlayMsg');
const actionBtn=document.getElementById('actionBtn');
const startOverlay=document.getElementById('startOverlay');
const startBtn=document.getElementById('startBtn');

let W,H,dpr,GROUND,CAM_X;

function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr);
  GROUND=H*0.78;
}
resize();
window.addEventListener('resize',()=>{ resize(); if(gameStarted&&!gameOver&&!cleared) initLevel(); });

const GRAVITY=0.55, JUMP_V=-13, JUMP2_V=-11;
const SCROLL_SPD=2.2;
const PUNCH_RANGE=60, PUNCH_H=16;
const LEVEL_W=6000;

let score,lives,gameOver,gameStarted,cleared,frame;
let punchTimer,punchActive,invTimer,invActive,jumpCount;
let player,platforms,enemies,coins,particles,goal;

function mkPlayer(){
  return{x:120,y:GROUND-52,w:28,h:50,vx:0,vy:0,onGround:false,dead:false,walkFrame:0};
}
function mkEnemy(x,type){
  return{x,y:type==='fly'?GROUND-130:GROUND-38,w:34,h:38,vx:type==='fly'?0:-1.4,vy:0,type,hp:1,dead:false,frame:0,floatY:0,floatDir:1,baseY:type==='fly'?GROUND-130:GROUND-38};
}
function mkCoin(x,y){return{x,y,w:18,h:18,collected:false,frame:0};}

function initLevel(){
  CAM_X=0;
  player=mkPlayer(); jumpCount=0;
  punchActive=false; punchTimer=0;
  invActive=false; invTimer=0;

  platforms=[
    {x:0,y:GROUND,w:LEVEL_W,h:60,type:'ground'},
    {x:280,y:GROUND-110,w:110,h:16,type:'block'},
    {x:480,y:GROUND-160,w:120,h:16,type:'block'},
    {x:700,y:GROUND-120,w:100,h:16,type:'block'},
    {x:900,y:GROUND-80,w:160,h:16,type:'block'},
    {x:1100,y:GROUND-190,w:90,h:16,type:'block'},
    {x:1300,y:GROUND-130,w:110,h:16,type:'block'},
    {x:1500,y:GROUND-200,w:120,h:16,type:'block'},
    {x:1700,y:GROUND-100,w:90,h:16,type:'block'},
    {x:1900,y:GROUND-160,w:110,h:16,type:'block'},
    {x:2200,y:GROUND-140,w:100,h:16,type:'block'},
    {x:2500,y:GROUND-200,w:90,h:16,type:'block'},
    {x:2800,y:GROUND-120,w:120,h:16,type:'block'},
    {x:3100,y:GROUND-180,w:80,h:16,type:'block'},
    {x:3400,y:GROUND-100,w:140,h:16,type:'block'},
    {x:3700,y:GROUND-170,w:100,h:16,type:'block'},
    {x:4000,y:GROUND-140,w:90,h:16,type:'block'},
    {x:4300,y:GROUND-200,w:110,h:16,type:'block'},
    {x:4600,y:GROUND-120,w:100,h:16,type:'block'},
    {x:4900,y:GROUND-160,w:120,h:16,type:'block'},
    {x:5200,y:GROUND-100,w:150,h:16,type:'block'},
  ];

  enemies=[
    mkEnemy(420,'walk'),mkEnemy(660,'walk'),
    mkEnemy(1060,'fly'),mkEnemy(1260,'walk'),
    mkEnemy(1560,'walk'),mkEnemy(1820,'fly'),
    mkEnemy(2120,'walk'),mkEnemy(2420,'fly'),
    mkEnemy(2720,'walk'),mkEnemy(3020,'fly'),
    mkEnemy(3320,'walk'),mkEnemy(3620,'fly'),
    mkEnemy(3920,'walk'),mkEnemy(4220,'fly'),
    mkEnemy(4520,'walk'),mkEnemy(4820,'fly'),
    mkEnemy(5020,'walk'),mkEnemy(5320,'fly'),
  ];

  coins=[];
  [350,430,530,590,740,790,950,990,1140,1370,1430,1560,1630,1770,1970,2260,2320,2570,2870,3170,3470,3770,4070,4370,4670,4970,5260].forEach(x=>coins.push(mkCoin(x,GROUND-180)));

  particles=[];
  goal={x:LEVEL_W-180,y:GROUND-230,w:60,h:230};
}

function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=2+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:30,maxLife:30,color,r:3+Math.random()*4});
  }
}

// ---- INPUT ----
document.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!gameStarted||gameOver||cleared)return;
  const t=e.changedTouches[0];
  if(t.clientX>W*0.7){ doPunch(); return; }
  if(player.onGround){ player.vy=JUMP_V; player.onGround=false; jumpCount=1; }
  else if(jumpCount===1){ player.vy=JUMP2_V; jumpCount=2; }
},{passive:false});
document.addEventListener('touchend',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

function doPunch(){
  if(punchActive)return;
  punchActive=true; punchTimer=18;
}

startBtn.addEventListener('click',()=>{ startOverlay.style.display='none'; gameStarted=true; startGame(); });
actionBtn.addEventListener('click',()=>{ overlay.style.display='none'; startGame(); });
['touchstart'].forEach(ev=>{
  actionBtn.addEventListener(ev,e=>e.stopPropagation(),{passive:true});
  startBtn.addEventListener(ev,e=>e.stopPropagation(),{passive:true});
});

function startGame(){
  score=0; lives=3; gameOver=false; cleared=false; frame=0;
  initLevel(); updateHUD();
}
function updateHUD(){
  scoreDiv.textContent='SCORE '+score;
  livesDiv.textContent='❤ '+lives;
}

// ---- PHYSICS ----
function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function update(){
  if(!gameStarted||gameOver||cleared)return;
  frame++;

  CAM_X+=SCROLL_SPD;
  player.x+=SCROLL_SPD;

  player.vy+=GRAVITY;
  player.y+=player.vy;
  player.onGround=false;

  platforms.forEach(p=>{
    if(!collide(player,p))return;
    const oB=player.y+player.h-p.y, oT=p.y+p.h-player.y;
    const oL=player.x+player.w-p.x, oR=p.x+p.w-player.x;
    const m=Math.min(oB,oT,oL,oR);
    if(m===oB&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.onGround=true;jumpCount=0;}
    else if(m===oT&&player.vy<0){player.y=p.y+p.h;player.vy=0;}
    else if(m===oL){player.x=p.x-player.w;}
    else if(m===oR){player.x=p.x+p.w;}
  });

  if(punchActive){punchTimer--;if(punchTimer<=0)punchActive=false;}
  if(invActive){invTimer--;if(invTimer<=0)invActive=false;}
  if(player.onGround)player.walkFrame=(player.walkFrame+0.2)%4;

  const punchBox=punchActive?{x:player.x+player.w,y:player.y+player.h*0.3-PUNCH_H/2,w:PUNCH_RANGE,h:PUNCH_H}:null;

  enemies.forEach(en=>{
    if(en.dead)return;
    en.frame++;
    if(en.type==='walk'){
      en.x+=en.vx;
      if(en.x<CAM_X-60||en.x>CAM_X+W+60)en.vx*=-1;
    } else {
      en.floatY+=0.04*en.floatDir;
      if(Math.abs(en.floatY)>22)en.floatDir*=-1;
      en.y=en.baseY+en.floatY;
      en.x-=1.1;
      if(en.x<CAM_X-80)en.x=CAM_X+W+80;
    }
    if(punchBox&&collide(punchBox,en)){
      en.dead=true;
      spawnParticles(en.x+en.w/2,en.y+en.h/2,'#ff88ff',8);
      score+=100; updateHUD();
    }
    if(!invActive&&collide(player,en)){
      lives--; updateHUD();
      invActive=true; invTimer=100;
      spawnParticles(player.x+player.w/2,player.y+player.h/2,'#ff4444',6);
      if(lives<=0)triggerGameOver();
    }
  });

  coins.forEach(c=>{
    if(c.collected)return;
    c.frame++;
    if(collide(player,c)){c.collected=true;score+=50;updateHUD();spawnParticles(c.x+c.w/2,c.y+c.h/2,'#ffee44',5);}
  });

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--;});
  for(let i=particles.length-1;i>=0;i--)if(particles[i].life<=0)particles.splice(i,1);

  if(player.y>H+100){
    lives--; updateHUD();
    if(lives<=0)triggerGameOver();
    else{player.x=Math.max(CAM_X+80,player.x);player.y=GROUND-80;player.vy=0;invActive=true;invTimer=100;}
  }

  const targetCam=player.x-W*0.28;
  if(targetCam>CAM_X)CAM_X=targetCam;

  if(collide(player,goal))triggerClear();
}

function triggerGameOver(){gameOver=true;overlayTitle.textContent='GAME OVER';overlayMsg.textContent='SCORE: '+score;actionBtn.textContent='RETRY';overlay.style.display='flex';}
function triggerClear(){cleared=true;overlayTitle.textContent='STAGE CLEAR ✨';overlayMsg.textContent='SCORE: '+score;actionBtn.textContent='もう一度';overlay.style.display='flex';}

// ---- DRAW ----
function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1e0640');g.addColorStop(0.5,'#5a1480');g.addColorStop(1,'#b03868');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // stars
  ctx.fillStyle='rgba(255,220,255,0.8)';
  for(let i=0;i<50;i++){
    const sx=((i*173+frame*0.25)%LEVEL_W-CAM_X%W+W)%W;
    const sy=(i*83)%(H*0.58);
    const ss=0.8+Math.sin(i*1.3+frame*0.06)*0.8;
    ctx.beginPath();ctx.arc(sx,sy,ss,0,Math.PI*2);ctx.fill();
  }

  // clouds
  for(let i=0;i<7;i++){
    const cx=((i*340+200-(CAM_X*0.25))%LEVEL_W+LEVEL_W)%W;
    const cy=50+i*35;
    ctx.fillStyle='rgba(255,140,210,0.16)';
    ctx.beginPath();ctx.arc(cx,cy,55+i*8,0,Math.PI*2);
    ctx.arc(cx+55,cy+10,42,0,Math.PI*2);
    ctx.arc(cx+98,cy,48,0,Math.PI*2);
    ctx.fill();
  }

  // ground
  const gg=ctx.createLinearGradient(0,GROUND,0,H);
  gg.addColorStop(0,'#6828b0');gg.addColorStop(1,'#300050');
  ctx.fillStyle=gg;ctx.fillRect(0,GROUND,W,H-GROUND);

  // ground tiles
  ctx.fillStyle='rgba(180,80,255,0.28)';
  const ts=44;
  for(let i=0;i<Math.ceil(W/ts)+1;i++){
    ctx.fillRect(i*ts-(CAM_X%ts),GROUND,ts-2,9);
  }
}

function drawPlatform(p){
  const sx=p.x-CAM_X;
  if(sx+p.w<0||sx>W||p.type==='ground')return;
  ctx.fillStyle='#c050f8';
  ctx.beginPath();ctx.roundRect(sx,p.y,p.w,p.h,7);ctx.fill();
  ctx.fillStyle='rgba(255,200,255,0.45)';
  ctx.fillRect(sx+8,p.y+2,p.w-16,5);
  // star decorations
  ctx.fillStyle='rgba(255,240,100,0.6)';
  for(let i=0;i<Math.floor(p.w/40);i++){
    const sx2=sx+20+i*40;
    drawStar(sx2,p.y-6,5,5,0.5);
  }
}

function drawStar(cx,cy,r,pts,ratio){
  ctx.beginPath();
  for(let i=0;i<pts*2;i++){
    const rad=i%2===0?r:r*ratio;
    const a=i/pts*Math.PI-Math.PI/2;
    i===0?ctx.moveTo(cx+rad*Math.cos(a),cy+rad*Math.sin(a)):ctx.lineTo(cx+rad*Math.cos(a),cy+rad*Math.sin(a));
  }
  ctx.closePath();ctx.fill();
}

function drawEnemy(en){
  if(en.dead)return;
  const sx=en.x-CAM_X;
  if(sx+en.w<-30||sx>W+30)return;
  const t=en.frame;
  if(en.type==='walk'){
    const legAnim=Math.sin(t*0.18)*7;
    // legs
    ctx.strokeStyle='#cc2080';ctx.lineWidth=7;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(sx+10,en.y+en.h-8);ctx.lineTo(sx+10+legAnim,en.y+en.h+8);ctx.stroke();
    ctx.beginPath();ctx.moveTo(sx+en.w-10,en.y+en.h-8);ctx.lineTo(sx+en.w-10-legAnim,en.y+en.h+8);ctx.stroke();
    // body blob
    ctx.fillStyle='#ff60b0';
    ctx.beginPath();ctx.arc(sx+en.w/2,en.y+en.h*0.42,en.w*0.46,0,Math.PI*2);ctx.fill();
    // belly
    ctx.fillStyle='rgba(255,180,220,0.5)';
    ctx.beginPath();ctx.ellipse(sx+en.w/2,en.y+en.h*0.5,en.w*0.25,en.h*0.18,0,0,Math.PI*2);ctx.fill();
    // antennae
    ctx.strokeStyle='#ff80c0';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(sx+en.w*0.36,en.y+4);ctx.lineTo(sx+en.w*0.24,en.y-10);ctx.stroke();
    ctx.beginPath();ctx.moveTo(sx+en.w*0.64,en.y+4);ctx.lineTo(sx+en.w*0.76,en.y-10);ctx.stroke();
    ctx.fillStyle='#ffccee';
    ctx.beginPath();ctx.arc(sx+en.w*0.24,en.y-11,3.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(sx+en.w*0.76,en.y-11,3.5,0,Math.PI*2);ctx.fill();
    // eyes
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(sx+en.w*0.34,en.y+en.h*0.36,5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(sx+en.w*0.66,en.y+en.h*0.36,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#500040';
    ctx.beginPath();ctx.arc(sx+en.w*0.35,en.y+en.h*0.37,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(sx+en.w*0.67,en.y+en.h*0.37,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(sx+en.w*0.36,en.y+en.h*0.355,1,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(sx+en.w*0.68,en.y+en.h*0.355,1,0,Math.PI*2);ctx.fill();
  } else {
    const fy=en.y;
    // propeller
    ctx.fillStyle='rgba(80,200,255,0.85)';
    ctx.save();ctx.translate(sx+en.w/2,fy);ctx.rotate(t*0.18);
    ctx.fillRect(-20,-3,16,6);ctx.fillRect(4,-3,16,6);
    ctx.restore();
    ctx.fillStyle='#888';ctx.beginPath();ctx.arc(sx+en.w/2,fy,4,0,Math.PI*2);ctx.fill();
    // body
    ctx.fillStyle='#9030f0';
    ctx.beginPath();ctx.arc(sx+en.w/2,fy+en.h*0.48,en.w*0.44,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(180,100,255,0.4)';
    ctx.beginPath();ctx.ellipse(sx+en.w/2,fy+en.h*0.55,en.w*0.24,en.h*0.16,0,0,Math.PI*2);ctx.fill();
    // eyes
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(sx+en.w*0.34,fy+en.h*0.42,5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(sx+en.w*0.66,fy+en.h*0.42,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#200040';
    ctx.beginPath();ctx.arc(sx+en.w*0.35,fy+en.h*0.43,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(sx+en.w*0.67,fy+en.h*0.43,2.5,0,Math.PI*2);ctx.fill();
    // zigzag mouth
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
    ctx.beginPath();
    for(let i=0;i<5;i++)i===0?ctx.moveTo(sx+en.w*0.26+i*en.w*0.12,fy+en.h*(0.62+0.04*(i%2))):ctx.lineTo(sx+en.w*0.26+i*en.w*0.12,fy+en.h*(0.62+0.04*(i%2)));
    ctx.stroke();
  }
}

function drawCoin(c){
  if(c.collected)return;
  const sx=c.x-CAM_X;
  if(sx+c.w<0||sx>W)return;
  const bobY=Math.sin(c.frame*0.09)*4;
  const r=c.w/2;
  ctx.fillStyle='#ffdd00';ctx.beginPath();ctx.arc(sx+r,c.y+r+bobY,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,170,0,0.7)';ctx.beginPath();ctx.arc(sx+r-2,c.y+r+bobY-2,r*0.45,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#cc8800';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(sx+r,c.y+r+bobY,r,0,Math.PI*2);ctx.stroke();
}

function drawGoal(){
  const sx=goal.x-CAM_X;
  if(sx+goal.w+100<0||sx-100>W)return;
  // arch
  ctx.strokeStyle='#ffaadd';ctx.lineWidth=6;
  ctx.beginPath();ctx.arc(sx+goal.w/2,goal.y+goal.h,goal.w*1.7,Math.PI,0);ctx.stroke();
  ctx.strokeStyle='#cc5599';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(sx-goal.w*0.7,goal.y+goal.h);ctx.lineTo(sx-goal.w*0.7,goal.y+goal.h-goal.h*0.38);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx+goal.w*1.7,goal.y+goal.h);ctx.lineTo(sx+goal.w*1.7,goal.y+goal.h-goal.h*0.38);ctx.stroke();
  // pole
  ctx.fillStyle='#d0d0d0';ctx.fillRect(sx+goal.w/2-3,goal.y,6,goal.h);
  // flag wave
  const wave=Math.sin(frame*0.1)*8;
  ctx.fillStyle='#ff3388';
  ctx.beginPath();ctx.moveTo(sx+goal.w/2+3,goal.y+4);ctx.lineTo(sx+goal.w/2+44+wave,goal.y+20);ctx.lineTo(sx+goal.w/2+3,goal.y+38);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff4';
  ctx.beginPath();ctx.moveTo(sx+goal.w/2+3,goal.y+4);ctx.lineTo(sx+goal.w/2+25+wave,goal.y+12);ctx.lineTo(sx+goal.w/2+3,goal.y+20);ctx.closePath();ctx.fill();
  // GOAL text
  ctx.fillStyle='#fff';ctx.font='bold 22px Helvetica Neue,sans-serif';ctx.textAlign='center';
  ctx.fillText('GOAL',sx+goal.w/2,goal.y-14);
  // sparkles
  for(let i=0;i<4;i++){
    const a=frame*0.05+i*Math.PI/2;
    const sparx=sx+goal.w/2+Math.cos(a)*38;
    const spary=goal.y+goal.h*0.5+Math.sin(a)*38;
    ctx.fillStyle='rgba(255,240,80,0.8)';
    drawStar(sparx,spary,5,4,0.4);
  }
}

function drawPlayer(){
  const p=player;
  const sx=p.x-CAM_X;
  const t=frame;

  ctx.save();
  if(invActive&&Math.floor(invTimer/5)%2===0)ctx.globalAlpha=0.35;

  // shadow
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath();ctx.ellipse(sx+p.w/2,GROUND+3,p.w*0.5,5,0,0,Math.PI*2);ctx.fill();

  // legs
  const legSwing=p.onGround?Math.sin(t*0.22)*12:0;
  ctx.strokeStyle='#e878c8';ctx.lineWidth=9;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(sx+9,p.y+p.h-10);ctx.lineTo(sx+9+legSwing,p.y+p.h+10);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx+p.w-9,p.y+p.h-10);ctx.lineTo(sx+p.w-9-legSwing,p.y+p.h+10);ctx.stroke();
  ctx.fillStyle='#c04090';
  ctx.beginPath();ctx.ellipse(sx+9+legSwing,p.y+p.h+12,7,4,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(sx+p.w-9-legSwing,p.y+p.h+12,7,4,0,0,Math.PI*2);ctx.fill();

  // skirt
  ctx.fillStyle='#ff5898';
  ctx.beginPath();ctx.ellipse(sx+p.w/2,p.y+p.h*0.6,p.w*0.68,p.h*0.23,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,160,210,0.5)';
  for(let i=0;i<6;i++){const a=-0.7+i*0.28;ctx.beginPath();ctx.arc(sx+p.w/2+Math.sin(a)*p.w*0.54,p.y+p.h*0.64,6,0,Math.PI*2);ctx.fill();}

  // body
  ctx.fillStyle='#ffccea';
  ctx.beginPath();ctx.roundRect(sx+3,p.y+p.h*0.19,p.w-6,p.h*0.44,7);ctx.fill();
  // chest ribbon
  ctx.fillStyle='#ff1878';
  ctx.beginPath();ctx.moveTo(sx+p.w/2-7,p.y+p.h*0.33);ctx.lineTo(sx+p.w/2,p.y+p.h*0.42);ctx.lineTo(sx+p.w/2+7,p.y+p.h*0.33);ctx.lineTo(sx+p.w/2,p.y+p.h*0.24);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff88bb';ctx.beginPath();ctx.arc(sx+p.w/2,p.y+p.h*0.37,4.5,0,Math.PI*2);ctx.fill();

  // arms
  const armSwing=p.onGround?Math.sin(t*0.22)*9:0;
  if(punchActive){
    ctx.strokeStyle='#ffccea';ctx.lineWidth=8;
    ctx.beginPath();ctx.moveTo(sx+p.w,p.y+p.h*0.3);ctx.lineTo(sx+p.w+36,p.y+p.h*0.28);ctx.stroke();
    ctx.fillStyle='#ffaacc';ctx.beginPath();ctx.roundRect(sx+p.w+33,p.y+p.h*0.2,18,18,5);ctx.fill();
    // impact
    ctx.fillStyle='rgba(255,255,80,0.9)';
    for(let i=0;i<6;i++){const a=i*Math.PI/3+frame*0.3;drawStar(sx+p.w+52+Math.cos(a)*6,p.y+p.h*0.29+Math.sin(a)*6,5,4,0.4);}
  } else {
    ctx.strokeStyle='#ffccea';ctx.lineWidth=8;
    ctx.beginPath();ctx.moveTo(sx+3,p.y+p.h*0.31);ctx.lineTo(sx-12,p.y+p.h*0.31+armSwing);ctx.stroke();
    ctx.beginPath();ctx.moveTo(sx+p.w-3,p.y+p.h*0.31);ctx.lineTo(sx+p.w+12,p.y+p.h*0.31-armSwing);ctx.stroke();
  }

  // neck
  ctx.fillStyle='#ffe6cc';ctx.beginPath();ctx.ellipse(sx+p.w/2,p.y+p.h*0.17,5.5,7,0,0,Math.PI*2);ctx.fill();

  // head
  ctx.fillStyle='#ffe6cc';ctx.beginPath();ctx.ellipse(sx+p.w/2,p.y+p.h*0.07,p.w*0.46,p.h*0.23,0,0,Math.PI*2);ctx.fill();

  // hair
  ctx.fillStyle='#c84090';
  ctx.beginPath();ctx.ellipse(sx+p.w/2,p.y-p.h*0.02,p.w*0.46,p.h*0.19,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(sx-2,p.y+p.h*0.07,p.w*0.22,p.h*0.18,0.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(sx+p.w+2,p.y+p.h*0.07,p.w*0.22,p.h*0.18,-0.5,0,Math.PI*2);ctx.fill();
  // ponytail
  ctx.fillStyle='#dd5599';
  ctx.beginPath();ctx.moveTo(sx+p.w+1,p.y+p.h*0.05);ctx.quadraticCurveTo(sx+p.w+22,p.y+p.h*0.18,sx+p.w+16,p.y+p.h*0.4);ctx.quadraticCurveTo(sx+p.w+9,p.y+p.h*0.5,sx+p.w+1,p.y+p.h*0.38);ctx.closePath();ctx.fill();

  // big bow
  ctx.fillStyle='#ff1878';
  ctx.beginPath();ctx.ellipse(sx+p.w/2-10,p.y-7,10,6,0.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(sx+p.w/2+10,p.y-7,10,6,-0.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff88cc';ctx.beginPath();ctx.arc(sx+p.w/2,p.y-7,5,0,Math.PI*2);ctx.fill();

  // eyes
  ctx.fillStyle='#502050';
  ctx.beginPath();ctx.ellipse(sx+p.w/2-6,p.y+p.h*0.06,3.2,3.8,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(sx+p.w/2+6,p.y+p.h*0.06,3.2,3.8,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(sx+p.w/2-5,p.y+p.h*0.05,1.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx+p.w/2+7,p.y+p.h*0.05,1.3,0,Math.PI*2);ctx.fill();
  // cheeks
  ctx.save();ctx.globalAlpha=0.3;ctx.fillStyle='#ff5050';
  ctx.beginPath();ctx.ellipse(sx+p.w/2-10,p.y+p.h*0.1,5.5,3,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(sx+p.w/2+10,p.y+p.h*0.1,5.5,3,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // smile
  ctx.strokeStyle='#c06090';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(sx+p.w/2,p.y+p.h*0.11,4.5,0.15,Math.PI-0.15);ctx.stroke();

  ctx.restore();
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x-CAM_X,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}

function drawMinimap(){
  const mw=110,mh=9,mx=(W-mw)/2,my=10;
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.beginPath();ctx.roundRect(mx,my,mw,mh,5);ctx.fill();
  const prog=Math.min(CAM_X/LEVEL_W,1);
  ctx.fillStyle='#ff80cc';ctx.beginPath();ctx.roundRect(mx,my,mw*prog,mh,5);ctx.fill();
  ctx.font='bold 9px Helvetica Neue,sans-serif';ctx.fillStyle='rgba(255,255,255,0.7)';ctx.textAlign='right';
  ctx.fillText('GOAL',mx+mw,my+8);
}

function drawHint(){
  if(frame<200){
    ctx.save();ctx.globalAlpha=(1-frame/200)*0.88;
    ctx.fillStyle='rgba(255,210,255,0.95)';
    ctx.font='bold 15px Helvetica Neue,sans-serif';ctx.textAlign='center';
    ctx.fillText('画面左タップ → ジャンプ',W/2,H-88);
    ctx.fillText('画面右タップ → パンチ',W/2,H-62);
    ctx.restore();
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawBg();
  platforms.forEach(drawPlatform);
  drawGoal();
  coins.forEach(drawCoin);
  enemies.forEach(drawEnemy);
  drawParticles();
  drawPlayer();
  drawMinimap();
  drawHint();
}

function loop(){
  if(gameStarted){update();draw();}
  requestAnimationFrame(loop);
}
loop();
})();
</script>
</body>
</html>
