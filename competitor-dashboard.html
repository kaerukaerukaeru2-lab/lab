<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ガジェット価格ダッシュボード</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1117; --bg2: #1a1d27; --bg3: #222536;
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
  --text: #f0f0f5; --text2: #8b8fa8; --text3: #5a5e72;
  --accent: #378ADD; --radius: 10px; --radius-lg: 14px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.app { max-width: 980px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
.header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
.header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.header-sub { font-size: 12px; color: var(--text2); margin-top: 3px; margin-left: 28px; }
.badge-file { font-size: 12px; color: var(--text2); background: var(--bg3); border: 0.5px solid var(--border); border-radius: 20px; padding: 4px 12px; align-self: center; }
.status { text-align: center; padding: 3rem 1rem; color: var(--text2); font-size: 14px; }
.status .spin { display: inline-block; width: 24px; height: 24px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
.metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
.metric { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.metric .label { font-size: 11px; color: var(--text2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
.metric .value { font-size: 20px; font-weight: 600; }
.controls { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
.search-wrap { flex: 1; min-width: 160px; position: relative; }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
.search-wrap input { width: 100%; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 13px; padding: 8px 12px 8px 32px; outline: none; }
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--text3); }
select { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 13px; padding: 8px 10px; outline: none; cursor: pointer; }
.cat-scroll { display: flex; gap: 6px; margin-bottom: 1.25rem; overflow-x: auto; padding-bottom: 4px; }
.cat-scroll::-webkit-scrollbar { height: 3px; }
.cat-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
.cat-btn { flex-shrink: 0; font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 0.5px solid var(--border2); background: var(--bg3); color: var(--text2); cursor: pointer; white-space: nowrap; transition: all 0.12s; }
.cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.section-title { font-size: 11px; font-weight: 600; color: var(--text2); letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 10px; }
.chart-wrap { margin-bottom: 1.75rem; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.bar-label { font-size: 12px; color: var(--text); width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
.bar-track { flex: 1; background: var(--bg3); border-radius: 5px; height: 26px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 5px; display: flex; align-items: center; padding: 0 8px; transition: width 0.4s ease; min-width: 50px; }
.bar-val { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.9); white-space: nowrap; }
.table-outer { border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text2); background: var(--bg2); border-bottom: 0.5px solid var(--border); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 0.5px solid var(--border); color: var(--text); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }
td a { color: var(--accent); text-decoration: none; font-size: 12px; }
td a:hover { text-decoration: underline; }
.badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; }
.badge-low  { background: rgba(29,158,117,0.15); color: #5DCAA5; border: 0.5px solid rgba(29,158,117,0.3); }
.badge-mid  { background: rgba(55,138,221,0.15); color: #85B7EB; border: 0.5px solid rgba(55,138,221,0.3); }
.badge-high { background: rgba(216,90,48,0.15);  color: #F09975; border: 0.5px solid rgba(216,90,48,0.3); }
.cond-new  { background: rgba(29,158,117,0.12); color: #5DCAA5; font-size: 11px; padding: 1px 6px; border-radius: 4px; }
.cond-used { background: rgba(159,119,221,0.12); color: #C4A8F0; font-size: 11px; padding: 1px 6px; border-radius: 4px; }
.cond-junk { background: rgba(216,90,48,0.12); color: #F09975; font-size: 11px; padding: 1px 6px; border-radius: 4px; }
.empty-row td { text-align: center; padding: 2rem; color: var(--text3); font-size: 13px; }
.refresh-btn { display: flex; align-items: center; gap: 5px; font-size: 12px; padding: 6px 12px; border: 0.5px solid var(--border2); border-radius: var(--radius); cursor: pointer; color: var(--text2); background: var(--bg3); }
.refresh-btn:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div>
      <h1>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        ガジェット価格ダッシュボード
      </h1>
      <div class="header-sub">楽天市場データ · 毎日自動更新</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <button class="refresh-btn" onclick="loadData()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        更新
      </button>
      <div class="badge-file" id="file-badge">読み込み中...</div>
    </div>
  </div>

  <div id="status" class="status">
    <div class="spin"></div><br>データを取得しています...
  </div>

  <div id="main" style="display:none">
    <div class="metric-grid" id="metrics"></div>

    <div class="cat-scroll" id="cat-btns"></div>

    <div class="controls">
      <div class="search-wrap">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search" placeholder="商品名で検索...">
      </div>
      <select id="sort">
        <option value="none">並び替え: デフォルト</option>
        <option value="asc">価格: 低い順</option>
        <option value="desc">価格: 高い順</option>
      </select>
      <select id="cond">
        <option value="all">コンディション: 全て</option>
        <option value="新品">新品</option>
        <option value="中古">中古</option>
        <option value="ジャンク">ジャンク</option>
      </select>
    </div>

    <div class="chart-wrap">
      <div class="section-title">カテゴリ別平均価格</div>
      <div id="chart"></div>
    </div>

    <div class="section-title">商品一覧 (<span id="count">0</span>件)</div>
    <div class="table-outer">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th style="width:30%">商品名</th>
              <th style="width:12%">価格</th>
              <th style="width:12%">カテゴリ</th>
              <th style="width:12%">コンディション</th>
              <th style="width:20%">ショップ</th>
              <th style="width:14%">リンク</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
var CSV_URL = 'https://raw.githubusercontent.com/kaerukaerukaeru2-lab/lab/main/data/rakuten_gadgets.csv';
var BAR_COLORS = ["#378ADD","#1D9E75","#D85A30","#9F77DD","#D4537E","#639922","#BA7517","#E24B4A","#2BB5A0","#E07B39"];
var allData = [];
var filtered = [];
var currentCat = 'all';

function loadData() {
  document.getElementById('status').style.display = 'block';
  document.getElementById('main').style.display = 'none';
  document.getElementById('file-badge').textContent = '読み込み中...';

  var xhr = new XMLHttpRequest();
  xhr.open('GET', CSV_URL + '?t=' + Date.now(), true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      allData = parseCSV(xhr.responseText);
      document.getElementById('file-badge').textContent = allData.length + '件';
      document.getElementById('status').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      buildCatBtns();
      applyFilters();
    } else {
      document.getElementById('status').innerHTML = '<div style="color:#F09975">データの取得に失敗しました (HTTP ' + xhr.status + ')</div>';
    }
  };
  xhr.onerror = function() {
    document.getElementById('status').innerHTML = '<div style="color:#F09975">ネットワークエラーが発生しました</div>';
  };
  xhr.send();
}

function parseCSV(text) {
  var lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  // 列: 取得日時,カテゴリ,コンディション,商品名,価格,ショップ名,商品URL
  var result = [];
  for (var r = 1; r < lines.length; r++) {
    var line = lines[r];
    if (!line.trim()) continue;
    var cols = [];
    var cur = ''; var inQ = false;
    for (var c = 0; c < line.length; c++) {
      var ch = line[c];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur);
    var clean = cols.map(function(x){ return (x||'').replace(/^"|"$/g,'').trim(); });
    if (clean.length < 7) continue;
    var price = parseInt((clean[4]||'0').replace(/[^0-9]/g,''), 10) || 0;
    result.push({
      date: clean[0],
      category: clean[1],
      condition: clean[2],
      name: clean[3],
      price: price,
      shop: clean[5],
      url: clean[6]
    });
  }
  return result;
}

function buildCatBtns() {
  var cats = ['all'];
  allData.forEach(function(r){ if (cats.indexOf(r.category) === -1) cats.push(r.category); });
  document.getElementById('cat-btns').innerHTML = cats.map(function(c){
    return '<button class="cat-btn' + (c === 'all' ? ' active' : '') + '" onclick="setCat(\'' + c + '\')">' + (c === 'all' ? '全て' : c) + '</button>';
  }).join('');
}

function setCat(cat) {
  currentCat = cat;
  var btns = document.querySelectorAll('.cat-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.remove('active');
    if ((cat === 'all' && btns[i].textContent === '全て') || btns[i].textContent === cat) {
      btns[i].classList.add('active');
    }
  }
  applyFilters();
}

function fmt(n) { return n.toLocaleString('ja-JP'); }

function renderMetrics() {
  var prices = filtered.map(function(r){ return r.price; }).filter(function(p){ return p > 0; });
  var avg = prices.length ? Math.round(prices.reduce(function(a,b){return a+b;},0)/prices.length) : 0;
  var min = prices.length ? Math.min.apply(null,prices) : 0;
  var max = prices.length ? Math.max.apply(null,prices) : 0;
  var cats = [];
  filtered.forEach(function(r){ if (cats.indexOf(r.category)===-1) cats.push(r.category); });
  var items = [
    ['商品数', filtered.length + '件'],
    ['カテゴリ', cats.length + '種'],
    ['平均価格', '¥' + fmt(avg)],
    ['最安値', '¥' + fmt(min)],
    ['最高値', '¥' + fmt(max)]
  ];
  document.getElementById('metrics').innerHTML = items.map(function(item){
    return '<div class="metric"><div class="label">' + item[0] + '</div><div class="value">' + item[1] + '</div></div>';
  }).join('');
}

function renderChart() {
  var catAvg = {};
  var catCount = {};
  filtered.forEach(function(r){
    if (!r.price) return;
    catAvg[r.category] = (catAvg[r.category] || 0) + r.price;
    catCount[r.category] = (catCount[r.category] || 0) + 1;
  });
  var cats = Object.keys(catAvg).map(function(c){
    return { cat: c, avg: Math.round(catAvg[c] / catCount[c]) };
  }).sort(function(a,b){ return b.avg - a.avg; });
  var maxVal = cats.length ? cats[0].avg : 1;
  document.getElementById('chart').innerHTML = cats.length ? cats.map(function(c, i){
    var pct = Math.round((c.avg / maxVal) * 100);
    var color = BAR_COLORS[i % BAR_COLORS.length];
    return '<div class="bar-row"><div class="bar-label" title="' + c.cat + '">' + c.cat + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '">' +
      '<span class="bar-val">¥' + fmt(c.avg) + '</span></div></div></div>';
  }).join('') : '<div style="color:var(--text3);font-size:13px">データがありません</div>';
}

function renderTable() {
  document.getElementById('count').textContent = filtered.length;
  var tbody = document.getElementById('table-body');
  if (!filtered.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">一致するデータがありません</td></tr>';
    return;
  }
  var show = filtered.slice(0, 200);
  tbody.innerHTML = show.map(function(r){
    var condCls = r.condition === '新品' ? 'cond-new' : r.condition === '中古' ? 'cond-used' : 'cond-junk';
    var badgeCls = r.price < 5000 ? 'badge-low' : r.price < 30000 ? 'badge-mid' : 'badge-high';
    var link = r.url ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">楽天で見る ↗</a>' : '—';
    return '<tr>' +
      '<td style="font-size:12px;line-height:1.4">' + esc(r.name.substring(0,50)) + (r.name.length>50?'…':'') + '</td>' +
      '<td><span class="badge ' + badgeCls + '">¥' + fmt(r.price) + '</span></td>' +
      '<td style="font-size:12px;color:var(--text2)">' + esc(r.category) + '</td>' +
      '<td><span class="' + condCls + '">' + esc(r.condition) + '</span></td>' +
      '<td style="font-size:12px;color:var(--text2)">' + esc(r.shop.substring(0,20)) + '</td>' +
      '<td>' + link + '</td>' +
      '</tr>';
  }).join('');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function applyFilters() {
  var q = document.getElementById('search').value.toLowerCase();
  var sort = document.getElementById('sort').value;
  var cond = document.getElementById('cond').value;
  filtered = allData.filter(function(r){
    if (currentCat !== 'all' && r.category !== currentCat) return false;
    if (cond !== 'all' && r.condition !== cond) return false;
    if (q && r.name.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  if (sort === 'asc')  filtered.sort(function(a,b){ return a.price - b.price; });
  if (sort === 'desc') filtered.sort(function(a,b){ return b.price - a.price; });
  renderMetrics(); renderChart(); renderTable();
}

document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('sort').addEventListener('change', applyFilters);
document.getElementById('cond').addEventListener('change', applyFilters);

loadData();
</script>
</body>
</html>
