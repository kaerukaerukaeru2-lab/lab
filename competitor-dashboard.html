<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競合データ・ダッシュボード</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1117;
  --bg2: #1a1d27;
  --bg3: #222536;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #f0f0f5;
  --text2: #8b8fa8;
  --text3: #5a5e72;
  --accent: #378ADD;
  --accent2: #1D9E75;
  --accent3: #D85A30;
  --accent4: #9F77DD;
  --accent5: #D4537E;
  --radius: 10px;
  --radius-lg: 14px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 0;
}

.app {
  max-width: 960px;
  margin: 0 auto;
  padding: 2rem 1.25rem 4rem;
}

/* Header */
.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 2rem;
  flex-wrap: wrap;
  gap: 12px;
}
.header-left h1 {
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.header-left h1 svg { flex-shrink: 0; }
.header-sub {
  font-size: 13px;
  color: var(--text2);
  margin-top: 4px;
  margin-left: 30px;
}
#file-badge {
  font-size: 12px;
  color: var(--text2);
  background: var(--bg3);
  border: 0.5px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  align-self: center;
}

/* Upload zone */
.upload-zone {
  border: 1.5px dashed var(--border2);
  border-radius: var(--radius-lg);
  padding: 2.5rem 1.5rem;
  text-align: center;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  margin-bottom: 1.75rem;
}
.upload-zone:hover, .upload-zone.drag {
  background: var(--bg2);
  border-color: var(--accent);
}
.upload-icon { color: var(--text3); margin-bottom: 10px; }
.upload-zone p { font-size: 14px; color: var(--text2); margin-top: 4px; }
.upload-zone p.hint { font-size: 12px; color: var(--text3); margin-top: 4px; }
.upload-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  padding: 7px 16px;
  border: 0.5px solid var(--border2);
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--text);
  background: var(--bg3);
  margin-top: 14px;
  transition: background 0.12s;
}
.upload-btn:hover { background: var(--bg); border-color: var(--accent); }

/* Metrics */
.metric-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 1.75rem;
}
.metric {
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.metric .label {
  font-size: 11px;
  color: var(--text2);
  margin-bottom: 6px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.metric .value {
  font-size: 22px;
  font-weight: 600;
  color: var(--text);
}

/* Controls */
.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 1.25rem;
  flex-wrap: wrap;
}
.search-wrap {
  flex: 1;
  min-width: 180px;
  position: relative;
}
.search-wrap svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text3);
  pointer-events: none;
}
.search-wrap input {
  width: 100%;
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 13px;
  padding: 8px 12px 8px 34px;
  outline: none;
  transition: border-color 0.12s;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--text3); }
select#sort {
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 13px;
  padding: 8px 12px;
  outline: none;
  cursor: pointer;
}
select#sort:focus { border-color: var(--accent); }

/* Chart */
.section-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.chart-wrap { margin-bottom: 2rem; }
.bar-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.bar-label {
  font-size: 13px;
  color: var(--text);
  width: 140px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex-shrink: 0;
}
.bar-track {
  flex: 1;
  background: var(--bg3);
  border-radius: 6px;
  height: 30px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 6px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  transition: width 0.45s cubic-bezier(.4,0,.2,1);
  min-width: 60px;
}
.bar-val {
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
  white-space: nowrap;
}

/* Table */
.table-outer {
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.table-scroll { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  table-layout: fixed;
}
th {
  text-align: left;
  padding: 11px 16px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text2);
  background: var(--bg2);
  border-bottom: 0.5px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 12px 16px;
  border-bottom: 0.5px solid var(--border);
  color: var(--text);
  vertical-align: top;
  word-break: break-word;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.025); }
td a {
  color: var(--accent);
  text-decoration: none;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
td a:hover { text-decoration: underline; }
.badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  margin-top: 4px;
  letter-spacing: 0.04em;
}
.badge-low  { background: rgba(29,158,117,0.15); color: #5DCAA5; border: 0.5px solid rgba(29,158,117,0.3); }
.badge-mid  { background: rgba(55,138,221,0.15); color: #85B7EB; border: 0.5px solid rgba(55,138,221,0.3); }
.badge-high { background: rgba(216,90,48,0.15);  color: #F09975; border: 0.5px solid rgba(216,90,48,0.3);  }
.tag {
  display: inline-block;
  background: var(--bg3);
  border: 0.5px solid var(--border);
  border-radius: 4px;
  font-size: 11px;
  padding: 1px 7px;
  margin: 1px 2px 1px 0;
  color: var(--text2);
}
.empty-row td {
  text-align: center;
  padding: 2.5rem;
  color: var(--text3);
  font-size: 13px;
}

/* footer hint */
.hint-box {
  margin-top: 1.5rem;
  padding: 12px 16px;
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--text3);
  line-height: 1.7;
}
.hint-box strong { color: var(--text2); }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-left">
      <h1>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        競合データ・ダッシュボード
      </h1>
      <div class="header-sub">ManusのCSV出力を読み込んで分析</div>
    </div>
    <div id="file-badge">ダミーデータ表示中</div>
  </div>

  <div class="upload-zone" id="dropzone">
    <div class="upload-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </div>
    <p>CSVファイルをここにドラッグ＆ドロップ</p>
    <p class="hint">列: 企業名, 価格, 特徴, URL</p>
    <button class="upload-btn" onclick="document.getElementById('csv-input').click()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      ファイルを選択
    </button>
    <input type="file" id="csv-input" accept=".csv" style="display:none">
  </div>

  <div class="metric-grid" id="metrics"></div>

  <div class="controls">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="企業名・特徴で検索...">
    </div>
    <select id="sort">
      <option value="none">並び替え: デフォルト</option>
      <option value="asc">価格: 低い順</option>
      <option value="desc">価格: 高い順</option>
    </select>
  </div>

  <div class="chart-wrap">
    <div class="section-title">価格比較</div>
    <div id="chart"></div>
  </div>

  <div class="section-title">データ一覧</div>
  <div class="table-outer">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th style="width:22%">企業名</th>
            <th style="width:15%">価格（円）</th>
            <th style="width:43%">特徴</th>
            <th style="width:20%">URL</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <div class="hint-box">
    <strong>CSV形式について</strong><br>
    1行目はヘッダー行。列名は日本語・英語どちらも可（例: 企業名/company、価格/price、特徴/feature、URL）。
    価格列に ¥ や , が含まれていても自動で数値に変換します。文字コードはUTF-8推奨。
  </div>

</div>

<script>
var MOCK = [
  { name: "スタートアップA", price: 2980, features: "無料プラン有り, API連携, チームプラン対応", url: "https://example-a.com" },
  { name: "エンタープライズB", price: 12800, features: "SLA保証99.9%, 24時間サポート, カスタム契約", url: "https://example-b.com" },
  { name: "ミドルレンジC", price: 5500, features: "月次レポート, Slack連携, 10ユーザーまで無料", url: "https://example-c.com" }
];

var BAR_COLORS = ["#378ADD","#1D9E75","#D85A30","#9F77DD","#D4537E","#639922","#BA7517","#E24B4A"];
var allData = MOCK.slice();
var filtered = MOCK.slice();

function parseCSV(text) {
  var lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  var headers = lines[0].split(",").map(function(h){ return h.replace(/^"|"$/g,'').trim().toLowerCase(); });
  function idx(keywords) {
    for (var i = 0; i < headers.length; i++) {
      for (var k = 0; k < keywords.length; k++) {
        if (headers[i].indexOf(keywords[k]) !== -1) return i;
      }
    }
    return -1;
  }
  var nameIdx  = idx(['企業','company','name','名前']);
  var priceIdx = idx(['価格','price','料金','金額','cost']);
  var featIdx  = idx(['特徴','feature','説明','description','機能']);
  var urlIdx   = idx(['url','リンク','サイト','link','website']);
  var result = [];
  for (var r = 1; r < lines.length; r++) {
    var line = lines[r];
    if (!line.trim()) continue;
    var cols = [];
    var cur = ''; var inQ = false;
    for (var c = 0; c < line.length; c++) {
      var ch = line[c];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur);
    var clean = cols.map(function(x){ return (x||'').replace(/^"|"$/g,'').trim(); });
    var rawPrice = priceIdx >= 0 ? (clean[priceIdx] || '0') : '0';
    var price = parseInt(rawPrice.replace(/[^0-9]/g,''), 10) || 0;
    var name = nameIdx >= 0 ? (clean[nameIdx] || '') : '';
    if (!name) continue;
    result.push({
      name: name,
      price: price,
      features: featIdx >= 0 ? (clean[featIdx] || '-') : '-',
      url: urlIdx >= 0 ? (clean[urlIdx] || '') : ''
    });
  }
  return result;
}

function fmt(n) { return n.toLocaleString('ja-JP'); }

function renderMetrics() {
  var prices = filtered.map(function(r){ return r.price; }).filter(function(p){ return p > 0; });
  var avg = prices.length ? Math.round(prices.reduce(function(a,b){return a+b;},0) / prices.length) : 0;
  var min = prices.length ? Math.min.apply(null, prices) : 0;
  var max = prices.length ? Math.max.apply(null, prices) : 0;
  var items = [
    ['企業数', filtered.length + '社'],
    ['平均価格', '¥' + fmt(avg)],
    ['最安値',  '¥' + fmt(min)],
    ['最高値',  '¥' + fmt(max)]
  ];
  document.getElementById('metrics').innerHTML = items.map(function(item){
    return '<div class="metric"><div class="label">' + item[0] + '</div><div class="value">' + item[1] + '</div></div>';
  }).join('');
}

function renderChart() {
  var data = filtered.slice().sort(function(a,b){ return b.price - a.price; }).slice(0,8);
  var maxPrice = data.reduce(function(m,r){ return Math.max(m, r.price); }, 1);
  document.getElementById('chart').innerHTML = data.length
    ? data.map(function(r, i){
        var pct = Math.round((r.price / maxPrice) * 100);
        var color = BAR_COLORS[i % BAR_COLORS.length];
        return '<div class="bar-row">' +
          '<div class="bar-label" title="' + r.name + '">' + r.name + '</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '">' +
          '<span class="bar-val">¥' + fmt(r.price) + '</span></div></div></div>';
      }).join('')
    : '<div style="color:var(--text3);font-size:13px;padding:1rem 0">データがありません</div>';
}

function renderTable() {
  var tbody = document.getElementById('table-body');
  if (!filtered.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="4">一致するデータがありません</td></tr>';
    return;
  }
  tbody.innerHTML = filtered.map(function(r){
    var tags = r.features ? r.features.split(/[,、]/).map(function(f){ return f.trim(); }).filter(Boolean).map(function(f){
      return '<span class="tag">' + esc(f) + '</span>';
    }).join('') : '-';
    var link = r.url
      ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
        '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
        ' リンク</a>'
      : '<span style="color:var(--text3);font-size:12px">—</span>';
    var badgeCls = r.price < 5000 ? 'badge-low' : r.price < 10000 ? 'badge-mid' : 'badge-high';
    var badgeLbl = r.price < 5000 ? '低価格' : r.price < 10000 ? '中価格' : '高価格';
    return '<tr>' +
      '<td><div style="font-weight:600">' + esc(r.name) + '</div><span class="badge ' + badgeCls + '">' + badgeLbl + '</span></td>' +
      '<td style="font-weight:600;font-size:15px">¥' + fmt(r.price) + '</td>' +
      '<td>' + tags + '</td>' +
      '<td>' + link + '</td>' +
      '</tr>';
  }).join('');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function applyFilters() {
  var q = document.getElementById('search').value.toLowerCase();
  var sort = document.getElementById('sort').value;
  filtered = allData.filter(function(r){
    return r.name.toLowerCase().indexOf(q) !== -1 || r.features.toLowerCase().indexOf(q) !== -1;
  });
  if (sort === 'asc')  filtered.sort(function(a,b){ return a.price - b.price; });
  if (sort === 'desc') filtered.sort(function(a,b){ return b.price - a.price; });
  renderMetrics(); renderChart(); renderTable();
}

function loadCSV(text, filename) {
  var rows = parseCSV(text);
  if (!rows.length) { alert('CSVの解析に失敗しました。\n列名（企業名/価格/特徴/URL）を確認してください。'); return; }
  allData = rows;
  document.getElementById('file-badge').textContent = filename + '（' + rows.length + '件）';
  document.getElementById('dropzone').style.display = 'none';
  applyFilters();
}

document.getElementById('csv-input').addEventListener('change', function(e){
  var f = e.target.files[0]; if (!f) return;
  var reader = new FileReader();
  reader.onload = function(ev){ loadCSV(ev.target.result, f.name); };
  reader.readAsText(f, 'UTF-8');
});

var dz = document.getElementById('dropzone');
dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', function(){ dz.classList.remove('drag'); });
dz.addEventListener('drop', function(e){
  e.preventDefault(); dz.classList.remove('drag');
  var f = e.dataTransfer.files[0]; if (!f) return;
  var reader = new FileReader();
  reader.onload = function(ev){ loadCSV(ev.target.result, f.name); };
  reader.readAsText(f, 'UTF-8');
});

document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('sort').addEventListener('change', applyFilters);

applyFilters();
</script>
</body>
</html>
