<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>律ニュースチャンネル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ef;
    --card: #ffffff;
    --text: #1a1a1a;
    --sub: #6b6b6b;
    --border: #e2ddd6;
    --accent: #c0392b;
    --accent2: #2c3e50;
    --tag-bg: #f0ece4;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --tab-active: #1a1a1a;
    --tab-inactive: #9a9a9a;
    --weather-bg: #2c3e50;
    --mono: 'DM Mono', monospace;
    --sans: 'Noto Sans JP', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ── ヘッダー ── */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .brand-icon {
    font-size: 18px;
  }

  .brand-name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--accent);
  }

  /* 時計 */
  .clock-wrap {
    text-align: right;
  }

  #clock-time {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.04em;
    line-height: 1;
  }

  #clock-date {
    font-size: 11px;
    color: var(--sub);
    margin-top: 2px;
    font-family: var(--mono);
  }

  /* 天気バー */
  .weather-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--weather-bg);
    color: #fff;
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 12px;
    font-size: 13px;
    min-height: 44px;
  }

  .weather-bar.loading {
    opacity: 0.6;
  }

  #weather-icon { font-size: 22px; }

  .weather-info { flex: 1; }

  #weather-temp {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 500;
  }

  #weather-desc {
    font-size: 11px;
    opacity: 0.8;
    margin-top: 1px;
  }

  .weather-extra {
    text-align: right;
    font-size: 11px;
    opacity: 0.75;
    line-height: 1.6;
  }

  /* タブ */
  .tabs {
    display: flex;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
    border-top: 1px solid var(--border);
    margin: 0 -16px;
    padding: 0 16px;
  }

  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 500;
    color: var(--tab-inactive);
    border: none;
    background: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
    font-family: var(--sans);
  }

  .tab.active {
    color: var(--tab-active);
    border-bottom-color: var(--accent);
  }

  /* メインコンテンツ */
  main {
    padding: 14px 12px;
  }

  /* ニュースカード */
  .news-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .news-card {
    background: var(--card);
    border-radius: 12px;
    padding: 14px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform 0.15s, box-shadow 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .news-card:active {
    transform: scale(0.98);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  .card-top {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .card-thumb {
    width: 72px;
    height: 56px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--tag-bg);
  }

  .card-thumb-placeholder {
    width: 72px;
    height: 56px;
    border-radius: 8px;
    background: var(--tag-bg);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .card-body { flex: 1; min-width: 0; }

  .card-title {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    color: var(--text);
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .card-source {
    font-size: 11px;
    color: var(--sub);
    font-weight: 500;
  }

  .card-dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--border);
  }

  .card-time {
    font-size: 11px;
    color: var(--sub);
    font-family: var(--mono);
  }

  .card-desc {
    margin-top: 8px;
    font-size: 12px;
    color: var(--sub);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ローディング */
  .loading-wrap {
    padding: 40px 0;
    text-align: center;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 13px;
    color: var(--sub);
  }

  /* エラー */
  .error-wrap {
    padding: 32px 16px;
    text-align: center;
  }

  .error-icon { font-size: 36px; margin-bottom: 10px; }

  .error-msg {
    font-size: 13px;
    color: var(--sub);
    line-height: 1.6;
  }

  .retry-btn {
    margin-top: 14px;
    padding: 8px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 20px;
    font-size: 13px;
    font-family: var(--sans);
    cursor: pointer;
  }

  /* フッター */
  footer {
    text-align: center;
    padding: 20px;
    font-size: 11px;
    color: #bbb;
  }

  /* カードフェードイン */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .news-card {
    animation: fadeUp 0.3s ease both;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="brand">
      <span class="brand-icon">📰</span>
      <span class="brand-name">律ニュースチャンネル</span>
    </div>
    <div class="clock-wrap">
      <div id="clock-time">--:--:--</div>
      <div id="clock-date">----/--/--</div>
    </div>
  </div>

  <div class="weather-bar loading" id="weather-bar">
    <span id="weather-icon">🌤</span>
    <div class="weather-info">
      <div id="weather-temp">-- °C</div>
      <div id="weather-desc">取得中...</div>
    </div>
    <div class="weather-extra">
      <div id="weather-humid">湿度 --%</div>
      <div id="weather-wind">風速 -- m/s</div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-genre="general">🗾 国内全般</button>
    <button class="tab" data-genre="tech">💻 テック</button>
    <button class="tab" data-genre="entertainment">🎭 エンタメ</button>
    <button class="tab" data-genre="sports">⚽ スポーツ</button>
    <button class="tab" data-genre="business">📈 経済</button>
  </div>
</header>

<main>
  <div id="news-container">
    <div class="loading-wrap">
      <div class="spinner"></div>
      <div class="loading-text">ニュース取得中...</div>
    </div>
  </div>
</main>

<footer>律ニュースチャンネル · RSS配信</footer>

<script>
// ── RSS フィード設定 ──
const FEEDS = {
  general: [
    { url: 'https://www3.nhk.or.jp/rss/news/cat0.xml', name: 'NHK' },
    { url: 'https://feeds.asahi.com/asahi/newsheadlines.rss', name: '朝日新聞' },
  ],
  tech: [
    { url: 'https://feeds.feedburner.com/gizmodo/japan', name: 'Gizmodo JP' },
    { url: 'https://rss.itmedia.co.jp/rss/2.0/news_bursts.xml', name: 'ITmedia' },
  ],
  entertainment: [
    { url: 'https://www.oricon.co.jp/rss/news/', name: 'ORICON' },
    { url: 'https://natalie.mu/music/feed/news', name: 'ナタリー' },
  ],
  sports: [
    { url: 'https://www.sponichi.co.jp/rss/news/baseball/flash/', name: 'スポニチ' },
    { url: 'https://hochi.news/rss/sports', name: 'スポーツ報知' },
  ],
  business: [
    { url: 'https://feeds.japan.cnet.com/rss/cnet/all.rdf', name: 'CNET Japan' },
    { url: 'https://itpro.nikkeibp.co.jp/rss/itpro.rdf', name: '日経XTECH' },
  ],
};

const RSS2JSON = 'https://api.rss2json.com/v1/api.json?rss_url=';
const WMO_CODES = {
  0:'☀️晴れ',1:'🌤うす曇',2:'⛅曇り',3:'☁️曇り',
  45:'🌫霧',48:'🌫霧',
  51:'🌦小雨',53:'🌧雨',55:'🌧強雨',
  61:'🌦小雨',63:'🌧雨',65:'🌧強雨',
  71:'❄️小雪',73:'❄️雪',75:'❄️大雪',
  80:'🌦にわか雨',81:'🌧にわか雨',82:'⛈強いにわか雨',
  95:'⛈雷雨',96:'⛈雷雨',99:'⛈激しい雷雨',
};

let currentGenre = 'general';

// ── 時計 ──
function updateClock() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('clock-time').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const days = ['日','月','火','水','木','金','土'];
  document.getElementById('clock-date').textContent =
    `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} (${days[now.getDay()]})`;
}
updateClock();
setInterval(updateClock, 1000);

// ── 天気 ──
async function fetchWeather() {
  try {
    const pos = await new Promise((res, rej) =>
      navigator.geolocation.getCurrentPosition(res, rej, { timeout: 8000 })
    );
    const { latitude: lat, longitude: lon } = pos.coords;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=Asia/Tokyo`;
    const r = await fetch(url);
    const d = await r.json();
    const c = d.current;
    const wmo = WMO_CODES[c.weather_code] || '🌡天気';
    const icon = wmo.match(/^(\S+)/)[1];
    const desc = wmo.replace(/^\S+/, '').trim();
    document.getElementById('weather-icon').textContent = icon;
    document.getElementById('weather-temp').textContent = `${Math.round(c.temperature_2m)} °C`;
    document.getElementById('weather-desc').textContent = desc;
    document.getElementById('weather-humid').textContent = `湿度 ${c.relative_humidity_2m}%`;
    document.getElementById('weather-wind').textContent = `風速 ${c.wind_speed_10m} m/s`;
    document.getElementById('weather-bar').classList.remove('loading');
  } catch(e) {
    document.getElementById('weather-desc').textContent = '位置情報を許可してください';
    document.getElementById('weather-bar').classList.remove('loading');
  }
}
fetchWeather();

// ── ニュース取得 ──
async function fetchFeed(feedObj) {
  try {
    const apiUrl = `${RSS2JSON}${encodeURIComponent(feedObj.url)}&count=6`;
    const r = await fetch(apiUrl);
    const text = await r.text();
    let d;
    try { d = JSON.parse(text); } catch(e) {
      console.warn(`[${feedObj.name}] JSON parse error:`, text.slice(0,200));
      window._debugLog = (window._debugLog||[]);
      window._debugLog.push(`${feedObj.name}: JSONパースエラー → ${text.slice(0,100)}`);
      return [];
    }
    if (d.status !== 'ok') {
      console.warn(`[${feedObj.name}] status:`, d.status, d.message);
      window._debugLog = (window._debugLog||[]);
      window._debugLog.push(`${feedObj.name}: status=${d.status} / ${d.message||''}`);
      return [];
    }
    return (d.items || []).map(item => ({
      title: item.title,
      link: item.link,
      desc: item.description ? item.description.replace(/<[^>]*>/g, '').trim() : '',
      source: feedObj.name,
      thumb: item.thumbnail || item.enclosure?.link || null,
      pubDate: item.pubDate,
    }));
  } catch(e) {
    console.warn(`[${feedObj.name}] fetch error:`, e.message);
    window._debugLog = (window._debugLog||[]);
    window._debugLog.push(`${feedObj.name}: fetchエラー → ${e.message}`);
    return [];
  }
}

async function loadNews(genre) {
  const container = document.getElementById('news-container');
  container.innerHTML = `<div class="loading-wrap"><div class="spinner"></div><div class="loading-text">ニュース取得中...</div></div>`;

  const feeds = FEEDS[genre] || [];
  const results = await Promise.all(feeds.map(fetchFeed));
  const items = results.flat();

  if (!items.length) {
    const logs = (window._debugLog||[]).join('<br>');
    container.innerHTML = `
      <div class="error-wrap">
        <div class="error-icon">📭</div>
        <div class="error-msg">ニュースを取得できませんでした。<br>しばらくしてから再試行してください。</div>
        <button class="retry-btn" onclick="window._debugLog=[];loadNews('${genre}')">再試行</button>
        ${logs ? `<div style="margin-top:16px;text-align:left;font-size:11px;color:#888;background:#f0f0f0;padding:10px;border-radius:8px;word-break:break-all;line-height:1.8">${logs}</div>` : ''}
      </div>`;
    return;
  }

  // 日付でソート（新しい順）
  items.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

  const GENRE_EMOJI = { general:'🗾', tech:'💻', entertainment:'🎭', sports:'⚽', business:'📈' };

  const html = items.map((item, i) => {
    const timeStr = formatTime(item.pubDate);
    const thumbHtml = item.thumb
      ? `<img class="card-thumb" src="${escHtml(item.thumb)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'card-thumb-placeholder\\'>${GENRE_EMOJI[genre]}</div>'">`
      : `<div class="card-thumb-placeholder">${GENRE_EMOJI[genre]}</div>`;

    return `
      <a class="news-card" href="${escHtml(item.link)}" target="_blank" rel="noopener noreferrer" style="animation-delay:${i*0.04}s">
        <div class="card-top">
          ${thumbHtml}
          <div class="card-body">
            <div class="card-title">${escHtml(item.title)}</div>
          </div>
        </div>
        <div class="card-meta">
          <span class="card-source">${escHtml(item.source)}</span>
          <span class="card-dot"></span>
          <span class="card-time">${timeStr}</span>
        </div>
        ${item.desc ? `<div class="card-desc">${escHtml(item.desc.slice(0, 100))}</div>` : ''}
      </a>`;
  }).join('');

  container.innerHTML = `<div class="news-list">${html}</div>`;
}

function formatTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const now = new Date();
  const diff = Math.floor((now - d) / 60000);
  if (diff < 1) return 'たった今';
  if (diff < 60) return `${diff}分前`;
  if (diff < 1440) return `${Math.floor(diff/60)}時間前`;
  const pad = n => String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── タブ ──
document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentGenre = tab.dataset.genre;
  loadNews(currentGenre);
});

// ── 初期ロード ──
window.addEventListener('load', () => {
  loadNews(currentGenre);
});
</script>
</body>
</html>
