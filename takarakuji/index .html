<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宝くじ当選番号案内</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a3a6b;--navy2:#2a4f8f;--navy-light:#e8eef8;
  --accent:#2563c8;--bg:#f5f7fa;--white:#fff;
  --border:#dde3ed;--text:#1a1a2e;--text2:#4a5568;--text3:#8a9ab5;
  --radius:8px;--shadow:0 1px 4px rgba(0,0,0,0.08);
}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}

/* ヘッダー */
header{background:var(--navy);color:#fff;padding:0 1rem;position:sticky;top:0;z-index:20}
.header-inner{max-width:680px;margin:0 auto;display:flex;align-items:center;height:52px;gap:10px}
.back-btn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px 8px;display:none;line-height:1}
.site-name{font-size:16px;font-weight:700;letter-spacing:0.04em;flex:1}
.header-sub{font-size:11px;color:rgba(255,255,255,0.6);font-weight:400;margin-left:6px}

/* 画面切り替え */
.screen{display:none;max-width:680px;margin:0 auto;padding:1.25rem 1rem 4rem}
.screen.active{display:block}

/* ===== 表紙 ===== */
.top-section-title{font-size:13px;font-weight:700;color:var(--navy);letter-spacing:0.08em;margin-bottom:0.75rem;margin-top:1.25rem;padding-left:4px;border-left:3px solid var(--navy);padding-left:8px}
.loto-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;margin-bottom:0.625rem;box-shadow:var(--shadow);cursor:pointer;transition:all 0.15s;text-decoration:none;color:inherit}
.loto-card:active{background:var(--navy-light)}
.loto-card-left{display:flex;flex-direction:column;gap:4px}
.loto-card-name{font-size:16px;font-weight:700;color:var(--navy)}
.loto-card-latest{font-size:11px;color:var(--text3)}
.loto-card-nums{font-size:13px;font-weight:600;color:var(--text2);margin-top:2px}
.loto-card-arrow{font-size:18px;color:var(--accent)}
.wide-btn{display:block;width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:30px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:0.05em;margin-top:1rem;text-align:center}
.info-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:0.625rem;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--accent);font-size:14px;font-weight:600}

/* ===== 詳細画面 ===== */
.detail-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px}
.detail-date{font-size:14px;color:var(--text2);margin-bottom:1.25rem}
.detail-table{width:100%;border-collapse:collapse;margin-bottom:0.75rem}
.detail-table th{background:var(--navy-light);text-align:left;font-size:13px;font-weight:700;color:var(--navy);padding:10px 12px;border:1px solid var(--border)}
.detail-table td{padding:12px;border:1px solid var(--border);background:var(--white);font-size:15px;font-weight:700;letter-spacing:0.15em}
.prize-table{width:100%;border-collapse:collapse;margin-bottom:0.75rem;font-size:14px}
.prize-table th{background:var(--navy-light);padding:8px 12px;border:1px solid var(--border);text-align:left;font-size:13px;font-weight:700;color:var(--navy)}
.prize-table td{padding:10px 12px;border:1px solid var(--border);background:var(--white)}
.prize-table tr:nth-child(even) td{background:#fafbfd}
.info-box{background:var(--white);border:1px solid var(--border);border-radius:4px;margin-bottom:0.75rem;overflow:hidden}
.info-box-header{background:var(--navy-light);padding:8px 12px;font-size:13px;font-weight:700;color:var(--navy);border-bottom:1px solid var(--border)}
.info-box-body{padding:12px;font-size:15px;font-weight:700}
.no-data{color:var(--text3);font-size:13px}

/* 予測ゲームボタン */
.game-entry{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;margin-top:1rem;text-align:center}
.game-entry p{font-size:13px;color:var(--text2);margin-bottom:0.75rem}
.game-btn{background:var(--navy);color:#fff;border:none;border-radius:var(--radius);padding:11px 32px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:0.05em}

/* 予測ゲーム画面 */
#game-screen{text-align:center}
.type-tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:1.5rem}
.tab-btn{font-size:13px;padding:7px 16px;border-radius:var(--radius);cursor:pointer;border:1.5px solid var(--border);background:var(--white);color:var(--text2);transition:all 0.15s;font-weight:500}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.balls-stage{display:flex;justify-content:center;align-items:center;gap:8px;min-height:80px;flex-wrap:wrap;margin:1.5rem 0}
.g-ball{width:60px;height:60px;border-radius:50%;background:#f0f4fb;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--text3);opacity:0;transform:scale(0.4) translateY(20px);transition:opacity 0.3s cubic-bezier(.34,1.56,.64,1),transform 0.3s cubic-bezier(.34,1.56,.64,1)}
.g-ball.show{opacity:1;transform:scale(1) translateY(0)}
.g-ball.b-bonus{background:#fff0e8;border-color:#d46a1a;color:#7a3a00}
.g-ball.b-0{background:#e8f0fb;border-color:#4a7fd4;color:#1a4a9a}
.g-ball.b-1{background:#fdecea;border-color:#d45a4a;color:#9a1a1a}
.g-ball.b-2{background:#e8f8ee;border-color:#4ab86a;color:#1a6a3a}
.g-ball.b-3{background:#fdf6e8;border-color:#d4a84a;color:#7a5a0a}
.g-ball.b-4{background:#f0e8fb;border-color:#8a4ad4;color:#4a1a7a}
.g-ball.b-5{background:#e8f8fb;border-color:#4ab8d4;color:#1a5a7a}
.g-ball.b-6{background:#fce8f4;border-color:#d44a8a;color:#7a1a4a}
.slot-display{font-size:28px;letter-spacing:4px;min-height:40px;margin:0.5rem 0}
.draw-btn{font-size:15px;font-weight:700;padding:13px 44px;border-radius:var(--radius);cursor:pointer;border:none;background:var(--navy);color:#fff;letter-spacing:0.05em;transition:all 0.15s}
.draw-btn:active{transform:scale(0.97)}
.draw-btn:disabled{opacity:0.5;cursor:not-allowed}
.result-text{font-size:13px;color:var(--text2);min-height:24px;margin-top:0.75rem}

footer{background:var(--navy);color:rgba(255,255,255,0.5);text-align:center;padding:1.25rem 1rem;font-size:11px}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <button class="back-btn" id="back-btn" onclick="goBack()">&#8249;</button>
    <div class="site-name" id="header-title">宝くじ当選番号案内<span class="header-sub"></span></div>
  </div>
</header>

<!-- 表紙 -->
<div class="screen active" id="screen-top">
  <div class="top-section-title">ロト</div>
  <div class="loto-card" onclick="showDetail('loto7')">
    <div class="loto-card-left">
      <div class="loto-card-name">ロト7</div>
      <div class="loto-card-latest" id="top-loto7-meta">読み込み中...</div>
    </div>
    <div class="loto-card-arrow">&#9654;</div>
  </div>
  <div class="loto-card" onclick="showDetail('loto6')">
    <div class="loto-card-left">
      <div class="loto-card-name">ロト6</div>
      <div class="loto-card-latest" id="top-loto6-meta">読み込み中...</div>
    </div>
    <div class="loto-card-arrow">&#9654;</div>
  </div>
  <div class="loto-card" onclick="showDetail('mini')">
    <div class="loto-card-left">
      <div class="loto-card-name">ミニロト</div>
      <div class="loto-card-latest" id="top-mini-meta">読み込み中...</div>
    </div>
    <div class="loto-card-arrow">&#9654;</div>
  </div>

  <div class="top-section-title" style="margin-top:1.5rem">ナンバーズ</div>
  <div class="loto-card" onclick="showDetail('n4')">
    <div class="loto-card-left">
      <div class="loto-card-name">ナンバーズ4</div>
      <div class="loto-card-latest" id="top-n4-meta">読み込み中...</div>
    </div>
    <div class="loto-card-arrow">&#9654;</div>
  </div>
  <div class="loto-card" onclick="showDetail('n3')">
    <div class="loto-card-left">
      <div class="loto-card-name">ナンバーズ3</div>
      <div class="loto-card-latest" id="top-n3-meta">読み込み中...</div>
    </div>
    <div class="loto-card-arrow">&#9654;</div>
  </div>

  <div class="top-section-title" style="margin-top:1.5rem">その他</div>
  <div class="info-card" onclick="showGame()">&#127921; 予測ゲーム機</div>
  <div class="info-card" onclick="showDetail('scratch')">&#9654; スクラッチ発売情報</div>
</div>

<!-- 詳細画面 -->
<div class="screen" id="screen-detail">
  <div id="detail-content"></div>
</div>

<!-- 予測ゲーム画面 -->
<div class="screen" id="screen-game" id="game-screen">
  <div style="text-align:center">
    <div class="type-tabs">
      <button class="tab-btn active" onclick="setGameType('loto6',this)">ロト6</button>
      <button class="tab-btn" onclick="setGameType('loto7',this)">ロト7</button>
      <button class="tab-btn" onclick="setGameType('n3',this)">ナンバーズ3</button>
      <button class="tab-btn" onclick="setGameType('n4',this)">ナンバーズ4</button>
    </div>
    <div class="balls-stage" id="balls-stage"></div>
    <div class="slot-display" id="slot-display"></div>
    <button class="draw-btn" id="draw-btn" onclick="startDraw()">予想番号を引く</button>
    <div class="result-text" id="result-text"></div>
  </div>
</div>

<footer>当選番号は公式サイトでご確認ください。予測はエンターテインメントです。</footer>

<script>
var DATA_URL='takarakuji_data.json';
var appData=null;
var gameType='loto6';
var running=false;
var audioCtx=null;
var currentScreen='top';

function getAudioCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function showScreen(id,title){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')});
  document.getElementById('screen-'+id).classList.add('active');
  document.getElementById('header-title').textContent=title||'宝くじ当選番号案内';
  document.getElementById('back-btn').style.display=(id==='top')?'none':'block';
  currentScreen=id;
  window.scrollTo(0,0);
}

function goBack(){showScreen('top','宝くじ当選番号案内');}

function loadData(){
  fetch(DATA_URL+'?t='+Date.now())
    .then(function(r){return r.json()})
    .then(function(d){appData=d;renderTop();})
    .catch(function(){appData=getDefault();renderTop();});
}

function getDefault(){
  return{loto6:{latest:{},history:[]},loto7:{latest:{},history:[]},mini:{latest:{},history:[]},n3:{latest:{},history:[]},n4:{latest:{},history:[]},scratch:{current:[],upcoming:[]}};
}

function fmt(d){
  if(!d||!d.date)return '---';
  return '第'+d.round+'回 '+d.date;
}

function renderTop(){
  var keys=['loto7','loto6','mini','n4','n3'];
  keys.forEach(function(k){
    var el=document.getElementById('top-'+k+'-meta');
    if(!el)return;
    var d=appData[k]&&appData[k].latest;
    if(d&&d.date){
      el.textContent=fmt(d);
    }else{
      el.textContent='データなし';
    }
  });
}

var NAMES={loto7:'ロト7',loto6:'ロト6',mini:'ミニロト',n3:'ナンバーズ3',n4:'ナンバーズ4',scratch:'スクラッチ発売情報'};
var HAS_BONUS={loto7:true,loto6:true,mini:true,n3:false,n4:false};
var PRIZE_LABELS={
  loto7:['1等','2等','3等','4等','5等','6等'],
  loto6:['1等','2等','3等','4等','5等'],
  mini:['1等','2等','3等','4等','5等'],
  n3:['ストレート','ボックス','セット（ストレート）','セット（ボックス）'],
  n4:['ストレート','ボックス','セット（ストレート）','セット（ボックス）']
};

function showDetail(key){
  if(key==='scratch'){
    renderScratch();
    showScreen('detail',NAMES[key]);
    return;
  }
  var d=appData[key]&&appData[key].latest;
  var hist=appData[key]&&appData[key].history||[];
  var name=NAMES[key];
  var html='';

  if(!d||!d.date){
    html='<p class="no-data">データなし</p>';
  }else{
    html+='<div class="detail-title">'+name+'抽せん数字一覧表</div>';
    html+='<div class="detail-date">第'+d.round+'回 &nbsp;'+d.date+'抽せん</div>';

    // 本数字
    var numsStr=(d.numbers||[]).map(function(n){return ('0'+n).slice(-2)}).join(' ');
    html+='<table class="detail-table"><tr><th>本数字</th></tr><tr><td>'+numsStr+'</td></tr></table>';

    // ボーナス数字
    if(HAS_BONUS[key]&&d.bonus!==undefined&&d.bonus!==''){
      var bonusArr=Array.isArray(d.bonus)?d.bonus:[d.bonus];
      html+='<table class="detail-table"><tr><th>ボーナス数字</th></tr><tr><td>'+bonusArr.map(function(n){return ('0'+n).slice(-2)}).join(' &nbsp; ')+'</td></tr></table>';
    }

    // 等級表
    if(d.prizes&&d.prizes.length>0){
      html+='<table class="prize-table"><tr><th>等級</th><th>口数</th><th>当せん金額</th></tr>';
      d.prizes.forEach(function(p){
        html+='<tr><td>'+p.rank+'</td><td>'+p.count+'</td><td>'+p.amount+'</td></tr>';
      });
      html+='</table>';
    }

    // 販売実績・キャリーオーバー
    if(d.sales){
      html+='<div class="info-box"><div class="info-box-header">販売実績金額</div><div class="info-box-body">'+d.sales+'</div></div>';
    }
    if(d.carryover!==undefined&&d.carryover!==''){
      html+='<div class="info-box"><div class="info-box-header">キャリーオーバー</div><div class="info-box-body">'+d.carryover+'</div></div>';
    }
  }

  // 過去データ
  if(hist.length>0){
    html+='<div class="top-section-title" style="margin-top:1.5rem">過去の当せん番号</div>';
    html+='<table class="prize-table"><tr><th>抽選日</th><th>回号</th><th>本数字</th>'+(HAS_BONUS[key]?'<th>B</th>':'')+'</tr>';
    hist.forEach(function(h){
      var nums=(h.numbers||[]).map(function(n){return ('0'+n).slice(-2)}).join(' ');
      html+='<tr><td>'+h.date+'</td><td>第'+h.round+'回</td><td style="letter-spacing:0.1em;font-weight:600">'+nums+'</td>';
      if(HAS_BONUS[key])html+='<td style="font-weight:600">'+('0'+(h.bonus||'')).slice(-2)+'</td>';
      html+='</tr>';
    });
    html+='</table>';
  }

  // 予測ゲームへ
  html+='<div class="game-entry"><p>'+name+'の予想番号を自動生成</p><button class="game-btn" onclick="showGame()">予測ゲームで試す</button></div>';

  document.getElementById('detail-content').innerHTML=html;
  showScreen('detail',name+'当選番号案内');
}

function renderScratch(){
  var all=(appData.scratch.current||[]).concat(appData.scratch.upcoming||[]);
  var html='';
  if(!all.length){html='<p class="no-data">データなし</p>';}
  else{
    all.forEach(function(s){
      var badge=s.status==='new'?'<span style="background:#e8f4fd;color:#1a5fa0;border:1px solid #aad0f0;font-size:10px;padding:2px 8px;border-radius:3px;font-weight:600">発売中</span>':s.status==='soon'?'<span style="background:#fdf6e8;color:#8a5a00;border:1px solid #f0d080;font-size:10px;padding:2px 8px;border-radius:3px;font-weight:600">予告</span>':'';
      html+='<div style="background:#fff;border:1px solid #dde3ed;border-radius:8px;padding:1rem 1.25rem;margin-bottom:0.625rem;box-shadow:0 1px 4px rgba(0,0,0,0.08)">';
      html+=badge+'<div style="font-size:15px;font-weight:700;margin-top:4px">'+s.name+'</div>';
      html+='<div style="font-size:13px;color:#2a4f8f;font-weight:600">'+s.price+'円</div>';
      if(s.date)html+='<div style="font-size:11px;color:#8a9ab5;margin-top:2px">'+s.date+'</div>';
      html+='</div>';
    });
  }
  document.getElementById('detail-content').innerHTML=html;
}

function showGame(){showScreen('game','予測ゲーム機');}

// ゲーム機
var GTYPES={
  loto6:{count:6,max:43,bonus:true,bonusMax:43},
  loto7:{count:7,max:37,bonus:true,bonusMax:37},
  n3:{count:3,max:9,bonus:false,digits:true},
  n4:{count:4,max:9,bonus:false,digits:true}
};

function setGameType(type,btn){
  if(running)return;
  gameType=type;
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  document.getElementById('balls-stage').innerHTML='';
  document.getElementById('result-text').textContent='';
  document.getElementById('slot-display').textContent='';
}

function playTick(){
  var c=getAudioCtx();
  var o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);
  o.type='sine';o.frequency.value=660+Math.random()*440;
  g.gain.setValueAtTime(0.1,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.08);
  o.start();o.stop(c.currentTime+0.09);
}

function playFanfare(){
  var c=getAudioCtx();
  [523,659,784,1047].forEach(function(f,i){
    var o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(0,c.currentTime+i*0.09);
    g.gain.linearRampToValueAtTime(0.08,c.currentTime+i*0.09+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+i*0.09+0.2);
    o.start(c.currentTime+i*0.09);o.stop(c.currentTime+i*0.09+0.22);
  });
}

function getRandNums(count,max,sorted,digits){
  if(digits){var a=[];for(var i=0;i<count;i++)a.push(Math.floor(Math.random()*(max+1)));return a;}
  var pool=[],i;for(i=1;i<=max;i++)pool.push(i);
  var result=[];
  for(i=0;i<count;i++){var idx=Math.floor(Math.random()*pool.length);result.push(pool.splice(idx,1)[0]);}
  if(sorted)result.sort(function(a,b){return a-b});
  return result;
}

function startDraw(){
  if(running)return;
  getAudioCtx().resume();
  running=true;
  var btn=document.getElementById('draw-btn');btn.disabled=true;
  var t=GTYPES[gameType];
  var stage=document.getElementById('balls-stage');
  var slotDiv=document.getElementById('slot-display');
  var resDiv=document.getElementById('result-text');
  stage.innerHTML='';slotDiv.textContent='';resDiv.textContent='';
  var nums=getRandNums(t.count,t.max,!t.digits,t.digits);
  var bonus=null;
  if(t.bonus){
    var pool2=[];for(var i=1;i<=t.bonusMax;i++){if(nums.indexOf(i)<0)pool2.push(i);}
    bonus=pool2[Math.floor(Math.random()*pool2.length)];
  }
  var balls=[];
  for(var j=0;j<t.count;j++){
    var d=document.createElement('div');
    d.className='g-ball b-'+j;d.textContent='?';
    stage.appendChild(d);balls.push(d);
  }
  var bonusBall=null;
  if(t.bonus){
    var sep=document.createElement('span');
    sep.style.cssText='font-size:16px;color:#8a9ab5;margin:0 2px;align-self:center';
    sep.textContent='+';stage.appendChild(sep);
    bonusBall=document.createElement('div');
    bonusBall.className='g-ball b-bonus';bonusBall.textContent='?';
    stage.appendChild(bonusBall);
  }
  var frames=['🎯','⭐','🍀','💡','🔢','✨'];var fi=0;
  var slotTimer=setInterval(function(){slotDiv.textContent=frames[fi%frames.length];fi++;},120);
  var delay=0;
  balls.forEach(function(b,i){
    setTimeout(function(){playTick();b.classList.add('show');b.textContent=nums[i];},delay);
    delay+=500;
  });
  if(bonusBall){
    setTimeout(function(){playTick();bonusBall.classList.add('show');bonusBall.textContent=bonus;},delay);
    delay+=500;
  }
  setTimeout(function(){
    clearInterval(slotTimer);slotDiv.textContent='✓';playFanfare();
    resDiv.innerHTML=t.bonus?'本数字：<strong>'+nums.join('&nbsp;&nbsp;')+'</strong>&nbsp;&nbsp;ボーナス：<strong style="color:#d46a1a">'+bonus+'</strong>':'予想番号：<strong>'+nums.join('&nbsp;&nbsp;')+'</strong>';
    running=false;btn.disabled=false;
  },delay+200);
}

document.addEventListener('DOMContentLoaded',function(){loadData()});
</script>
