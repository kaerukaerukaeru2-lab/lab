<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宝くじ — 当選番号・予測・情報</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;
  --bg2:#12121a;
  --bg3:#1a1a26;
  --border:#2a2a3a;
  --gold:#f0b429;
  --gold2:#ffd166;
  --text:#e8e8f0;
  --text2:#9090a8;
  --text3:#5a5a72;
  --red:#e24b4a;
  --green:#3cb371;
  --radius:12px;
  --radius-sm:8px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}

/* ヘッダー */
header{padding:1.5rem 1rem 1rem;text-align:center;border-bottom:0.5px solid var(--border)}
.site-title{font-size:26px;font-weight:700;letter-spacing:0.05em;color:var(--gold)}
.site-sub{font-size:12px;color:var(--text3);margin-top:2px;letter-spacing:0.1em}

/* ナビ */
nav{display:flex;overflow-x:auto;gap:0;border-bottom:0.5px solid var(--border);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.nav-btn{flex:0 0 auto;padding:10px 18px;font-size:13px;color:var(--text2);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all 0.15s}
.nav-btn.active{color:var(--gold);border-bottom-color:var(--gold)}

/* メインコンテンツ */
main{max-width:640px;margin:0 auto;padding:0 0 4rem}
.section{display:none;padding:1.25rem 1rem}
.section.active{display:block}

/* セクションタイトル */
.sec-title{font-size:13px;color:var(--text3);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:1rem;padding-bottom:0.5rem;border-bottom:0.5px solid var(--border)}

/* 当選番号カード */
.result-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:0.75rem}
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem}
.result-name{font-size:14px;font-weight:600;color:var(--gold2)}
.result-meta{font-size:11px;color:var(--text3)}
.ball-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.num-ball{width:44px;height:44px;border-radius:50%;background:var(--bg3);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--text)}
.num-ball.bonus{border-color:var(--red);color:var(--red)}
.num-ball.empty{color:var(--text3);font-size:12px;font-weight:400}
.plus-sep{color:var(--text3);font-size:12px;margin:0 2px}
.no-data{font-size:13px;color:var(--text3);padding:0.5rem 0}

/* 数字ボールカラー（ロト6風） */
.c1{background:#1a2a3a;border-color:#3a6a9a;color:#7ab8e8}
.c2{background:#2a1a1a;border-color:#9a3a3a;color:#e87a7a}
.c3{background:#1a2a1a;border-color:#3a8a3a;color:#7ae87a}
.c4{background:#2a2a1a;border-color:#8a8a3a;color:#e8e87a}
.c5{background:#2a1a2a;border-color:#8a3a8a;color:#e87ae8}
.c6{background:#1a2a2a;border-color:#3a8a8a;color:#7ae8e8}
.c7{background:#2a1a1a;border-color:#a06020;color:#f0a050}

/* スクラッチカード */
.scratch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.scratch-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:0.875rem;transition:border-color 0.15s}
.scratch-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;margin-bottom:6px;font-weight:500}
.badge-new{background:#1a2a1a;color:var(--green);border:0.5px solid var(--green)}
.badge-soon{background:#2a2a1a;color:var(--gold);border:0.5px solid var(--gold)}
.badge-end{background:#2a1a1a;color:var(--text3);border:0.5px solid var(--text3)}
.scratch-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px}
.scratch-price{font-size:12px;color:var(--text3)}
.scratch-date{font-size:11px;color:var(--text3);margin-top:4px}

/* 予測ゲーム機 */
#game-section{text-align:center}
.type-tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:1.5rem}
.tab-btn{font-size:13px;padding:7px 16px;border-radius:var(--radius-sm);cursor:pointer;border:0.5px solid var(--border);background:var(--bg2);color:var(--text2);transition:all 0.15s;font-weight:400}
.tab-btn.active{background:var(--bg3);color:var(--gold);border-color:var(--gold);font-weight:500}
.balls-stage{display:flex;justify-content:center;align-items:center;gap:10px;min-height:88px;flex-wrap:wrap;margin:1.5rem 0}
.g-ball{width:68px;height:68px;border-radius:50%;background:var(--bg3);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:var(--text2);opacity:0;transform:scale(0.4) translateY(20px);transition:opacity 0.35s cubic-bezier(.34,1.56,.64,1),transform 0.35s cubic-bezier(.34,1.56,.64,1)}
.g-ball.show{opacity:1;transform:scale(1) translateY(0)}
.g-ball.b-bonus{border-color:var(--red);color:var(--red)}
.g-ball.b-0{border-color:#3a6a9a;color:#7ab8e8;background:#0f1f2f}
.g-ball.b-1{border-color:#9a3a3a;color:#e87a7a;background:#2a0f0f}
.g-ball.b-2{border-color:#3a8a3a;color:#7ae87a;background:#0f2a0f}
.g-ball.b-3{border-color:#8a8a3a;color:#e8e87a;background:#2a2a0f}
.g-ball.b-4{border-color:#8a3a8a;color:#e87ae8;background:#2a0f2a}
.g-ball.b-5{border-color:#3a8a8a;color:#7ae8e8;background:#0f2a2a}
.g-ball.b-6{border-color:#a06020;color:#f0a050;background:#2a1a0f}
.draw-btn{font-size:15px;font-weight:600;padding:14px 48px;border-radius:var(--radius);cursor:pointer;border:1.5px solid var(--gold);background:transparent;color:var(--gold);letter-spacing:0.05em;transition:all 0.15s}
.draw-btn:hover{background:rgba(240,180,41,0.08)}
.draw-btn:active{transform:scale(0.97)}
.draw-btn:disabled{opacity:0.4;cursor:not-allowed}
.slot-display{font-size:32px;letter-spacing:6px;min-height:44px;margin:0.75rem 0}
.result-text{font-size:13px;color:var(--text2);min-height:24px;margin-top:0.75rem;line-height:1.8}

/* 過去データ */
.history-table{width:100%;border-collapse:collapse;font-size:13px}
.history-table th{text-align:left;font-size:11px;color:var(--text3);font-weight:500;padding:6px 8px;border-bottom:0.5px solid var(--border)}
.history-table td{padding:8px;border-bottom:0.5px solid var(--border);color:var(--text2);vertical-align:middle}
.history-table td:first-child{color:var(--text3);font-size:12px;white-space:nowrap}
.mini-balls{display:flex;gap:4px;flex-wrap:wrap}
.mini-ball{width:28px;height:28px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--text2)}
.mini-ball.bonus{border-color:var(--red);color:var(--red)}
.history-type-sel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.h-tab{font-size:12px;padding:5px 12px;border-radius:var(--radius-sm);cursor:pointer;border:0.5px solid var(--border);background:var(--bg2);color:var(--text2);transition:all 0.15s}
.h-tab.active{color:var(--gold);border-color:var(--gold);background:var(--bg3)}

/* フッター */
footer{text-align:center;padding:1.5rem 1rem;font-size:11px;color:var(--text3);border-top:0.5px solid var(--border)}
</style>
</head>
<body>

<header>
  <div class="site-title">🎰 宝くじ</div>
  <div class="site-sub">当選番号 · 予測 · スクラッチ情報</div>
</header>

<nav>
  <button class="nav-btn active" onclick="showSection('result','result-tab')">当選番号</button>
  <button class="nav-btn" onclick="showSection('scratch','scratch-tab')">スクラッチ</button>
  <button class="nav-btn" onclick="showSection('game','game-tab')">予測ゲーム</button>
  <button class="nav-btn" onclick="showSection('history','history-tab')">過去データ</button>
</nav>

<main>

<section id="result" class="section active">
  <div class="sec-title">最新当選番号</div>
  <div id="result-cards"></div>
</section>

<section id="scratch" class="section">
  <div class="sec-title">発売中 · 予告</div>
  <div id="scratch-list"></div>
</section>

<section id="game" class="section" id="game-section">
  <div class="sec-title">予測ゲーム機</div>
  <div class="type-tabs">
    <button class="tab-btn active" onclick="setGameType('loto6',this)">ロト6</button>
    <button class="tab-btn" onclick="setGameType('loto7',this)">ロト7</button>
    <button class="tab-btn" onclick="setGameType('n3',this)">ナンバーズ3</button>
    <button class="tab-btn" onclick="setGameType('n4',this)">ナンバーズ4</button>
  </div>
  <div class="balls-stage" id="balls-stage"></div>
  <div class="slot-display" id="slot-display"></div>
  <button class="draw-btn" id="draw-btn" onclick="startDraw()">🎰 予想を引く</button>
  <div class="result-text" id="result-text"></div>
</section>

<section id="history" class="section">
  <div class="sec-title">過去の当選番号</div>
  <div class="history-type-sel">
    <button class="h-tab active" onclick="showHistory('loto6',this)">ロト6</button>
    <button class="h-tab" onclick="showHistory('loto7',this)">ロト7</button>
    <button class="h-tab" onclick="showHistory('n3',this)">ナンバーズ3</button>
    <button class="h-tab" onclick="showHistory('n4',this)">ナンバーズ4</button>
  </div>
  <div id="history-table-wrap"></div>
</section>

</main>

<footer>当選番号は公式サイトでご確認ください · このサイトの予測はエンターテインメントです</footer>

<script>
var DATA_URL='takarakuji_data.json';
var appData=null;
var gameType='loto6';
var running=false;
var audioCtx=null;

function getAudioCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

// ナビ切り替え
function showSection(id,tabId){
  document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active')});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active')});
  document.getElementById(id).classList.add('active');
  event.currentTarget.classList.add('active');
}

// データ読み込み
function loadData(){
  fetch(DATA_URL+'?t='+Date.now())
    .then(function(r){return r.json()})
    .then(function(d){
      appData=d;
      renderResult();
      renderScratch();
      renderHistory('loto6');
    })
    .catch(function(){
      appData=getDefaultData();
      renderResult();
      renderScratch();
      renderHistory('loto6');
    });
}

function getDefaultData(){
  return{
    loto6:{latest:{date:'',round:'',numbers:[],bonus:''},history:[]},
    loto7:{latest:{date:'',round:'',numbers:[],bonus:''},history:[]},
    n3:{latest:{date:'',round:'',numbers:[]},history:[]},
    n4:{latest:{date:'',round:'',numbers:[]},history:[]},
    scratch:{current:[],upcoming:[]}
  };
}

// 当選番号描画
function renderResult(){
  var c=document.getElementById('result-cards');
  c.innerHTML='';
  var types=[
    {key:'loto6',name:'ロト6',bonus:true},
    {key:'loto7',name:'ロト7',bonus:true},
    {key:'n3',name:'ナンバーズ3',bonus:false},
    {key:'n4',name:'ナンバーズ4',bonus:false}
  ];
  types.forEach(function(t){
    var d=appData[t.key].latest;
    var card=document.createElement('div');
    card.className='result-card';
    var header='<div class="result-header"><span class="result-name">'+t.name+'</span>';
    if(d.date)header+='<span class="result-meta">第'+d.round+'回 '+d.date+'</span>';
    header+='</div>';
    var balls='<div class="ball-row">';
    if(d.numbers&&d.numbers.length>0){
      d.numbers.forEach(function(n,i){
        var cl='num-ball c'+(i%7);
        balls+='<div class="'+cl+'">'+n+'</div>';
      });
      if(t.bonus&&d.bonus){
        balls+='<span class="plus-sep">+</span>';
        balls+='<div class="num-ball bonus">'+d.bonus+'</div>';
      }
    }else{
      balls+='<span class="no-data">データなし — 更新してください</span>';
    }
    balls+='</div>';
    card.innerHTML=header+balls;
    c.appendChild(card);
  });
}

// スクラッチ描画
function renderScratch(){
  var c=document.getElementById('scratch-list');
  c.innerHTML='';
  var all=(appData.scratch.current||[]).concat(appData.scratch.upcoming||[]);
  if(all.length===0){
    c.innerHTML='<p class="no-data">データなし</p>';
    return;
  }
  var grid=document.createElement('div');
  grid.className='scratch-grid';
  all.forEach(function(s){
    var card=document.createElement('div');
    card.className='scratch-card';
    var badge='';
    if(s.status==='new')badge='<span class="scratch-badge badge-new">発売中</span>';
    else if(s.status==='soon')badge='<span class="scratch-badge badge-soon">発売予告</span>';
    else badge='<span class="scratch-badge badge-end">販売終了</span>';
    var date=s.date?'<div class="scratch-date">'+s.date+'</div>':'';
    card.innerHTML=badge+'<div class="scratch-name">'+s.name+'</div><div class="scratch-price">'+s.price+'円</div>'+date;
    grid.appendChild(card);
  });
  c.appendChild(grid);
}

// 過去データ描画
function renderHistory(type){
  var wrap=document.getElementById('history-table-wrap');
  var hist=appData[type].history;
  if(!hist||hist.length===0){
    wrap.innerHTML='<p class="no-data" style="padding:1rem 0">データなし</p>';
    return;
  }
  var hasBonus=(type==='loto6'||type==='loto7');
  var html='<table class="history-table"><thead><tr><th>日付</th><th>回</th><th>本数字</th>'+(hasBonus?'<th>B</th>':'')+'</tr></thead><tbody>';
  hist.forEach(function(h){
    html+='<tr><td>'+h.date+'</td><td>'+h.round+'</td><td><div class="mini-balls">';
    h.numbers.forEach(function(n,i){
      html+='<div class="mini-ball c'+(i%7)+'">'+n+'</div>';
    });
    html+='</div></td>';
    if(hasBonus)html+='<td><div class="mini-ball bonus">'+(h.bonus||'')+'</div></td>';
    html+='</tr>';
  });
  html+='</tbody></table>';
  wrap.innerHTML=html;
}

function showHistory(type,btn){
  document.querySelectorAll('.h-tab').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  renderHistory(type);
}

// ゲーム機
var GTYPES={
  loto6:{count:6,max:43,bonus:true,bonusMax:43},
  loto7:{count:7,max:37,bonus:true,bonusMax:37},
  n3:{count:3,max:9,bonus:false,digits:true},
  n4:{count:4,max:9,bonus:false,digits:true}
};

function setGameType(type,btn){
  if(running)return;
  gameType=type;
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  document.getElementById('balls-stage').innerHTML='';
  document.getElementById('result-text').textContent='';
  document.getElementById('slot-display').textContent='';
}

function playTick(){
  var c=getAudioCtx();
  var o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);
  o.type='sine';
  o.frequency.value=660+Math.random()*440;
  g.gain.setValueAtTime(0.12,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.09);
  o.start();o.stop(c.currentTime+0.09);
}

function playFanfare(){
  var c=getAudioCtx();
  var melody=[523,659,784,1047,784,1047,1319];
  melody.forEach(function(f,i){
    var o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type='square';o.frequency.value=f;
    g.gain.setValueAtTime(0,c.currentTime+i*0.09);
    g.gain.linearRampToValueAtTime(0.07,c.currentTime+i*0.09+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+i*0.09+0.2);
    o.start(c.currentTime+i*0.09);
    o.stop(c.currentTime+i*0.09+0.22);
  });
}

function getRandNums(count,max,sorted,digits){
  if(digits){var a=[];for(var i=0;i<count;i++)a.push(Math.floor(Math.random()*(max+1)));return a;}
  var pool=[],i;
  for(i=1;i<=max;i++)pool.push(i);
  var result=[];
  for(i=0;i<count;i++){var idx=Math.floor(Math.random()*pool.length);result.push(pool.splice(idx,1)[0]);}
  if(sorted)result.sort(function(a,b){return a-b});
  return result;
}

function startDraw(){
  if(running)return;
  getAudioCtx().resume();
  running=true;
  var btn=document.getElementById('draw-btn');
  btn.disabled=true;
  var t=GTYPES[gameType];
  var stage=document.getElementById('balls-stage');
  var slotDiv=document.getElementById('slot-display');
  var resDiv=document.getElementById('result-text');
  stage.innerHTML='';slotDiv.textContent='';resDiv.textContent='';

  var nums=getRandNums(t.count,t.max,!t.digits,t.digits);
  var bonus=null;
  if(t.bonus){
    var pool2=[];
    for(var i=1;i<=t.bonusMax;i++){if(nums.indexOf(i)<0)pool2.push(i);}
    bonus=pool2[Math.floor(Math.random()*pool2.length)];
  }

  var balls=[];
  for(var j=0;j<t.count;j++){
    var d=document.createElement('div');
    d.className='g-ball b-'+j;
    d.textContent='?';
    stage.appendChild(d);
    balls.push(d);
  }
  var bonusBall=null;
  if(t.bonus){
    var sep=document.createElement('span');
    sep.style.cssText='font-size:18px;color:#5a5a72;margin:0 2px;align-self:center';
    sep.textContent='+';
    stage.appendChild(sep);
    bonusBall=document.createElement('div');
    bonusBall.className='g-ball b-bonus';
    bonusBall.textContent='?';
    stage.appendChild(bonusBall);
  }

  var frames=['🎰','💰','7️⃣','⭐','🍀','💎','🎲','👑'];
  var fi=0;
  var slotTimer=setInterval(function(){
    slotDiv.textContent=frames[fi%frames.length];fi++;
  },110);

  var delay=0;
  balls.forEach(function(b,i){
    setTimeout(function(){
      playTick();
      b.classList.add('show');
      b.textContent=nums[i];
    },delay);
    delay+=550;
  });

  if(bonusBall){
    setTimeout(function(){
      playTick();
      bonusBall.classList.add('show');
      bonusBall.textContent=bonus;
    },delay);
    delay+=550;
  }

  setTimeout(function(){
    clearInterval(slotTimer);
    slotDiv.textContent='🎉';
    playFanfare();
    resDiv.innerHTML=t.bonus
      ?'本数字：<strong>'+nums.join(' &nbsp;–&nbsp; ')+'</strong>&nbsp;&nbsp;ボーナス：<strong style="color:var(--red)">'+bonus+'</strong>'
      :'予想番号：<strong>'+nums.join(' &nbsp;–&nbsp; ')+'</strong>';
    running=false;
    btn.disabled=false;
  },delay+200);
}

document.addEventListener('DOMContentLoaded',function(){loadData()});
</script>
</body>
</html>
