<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ガジェット価格ダッシュボード</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1117; --bg2: #1a1d27; --bg3: #222536;
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
  --text: #f0f0f5; --text2: #8b8fa8; --text3: #5a5e72;
  --accent: #378ADD; --radius: 10px; --radius-lg: 14px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.app { max-width: 980px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
.header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
.header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.header-sub { font-size: 12px; color: var(--text2); margin-top: 3px; margin-left: 28px; }
.badge-file { font-size: 12px; color: var(--text2); background: var(--bg3); border: 0.5px solid var(--border); border-radius: 20px; padding: 4px 12px; align-self: center; }
.status { text-align: center; padding: 3rem 1rem; color: var(--text2); font-size: 14px; }
.status .spin { display: inline-block; width: 24px; height: 24px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
.metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
.metric { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.metric .label { font-size: 11px; color: var(--text2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
.metric .value { font-size: 20px; font-weight: 600; }
.controls { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
.search-wrap { flex: 1; min-width: 160px; position: relative; }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
.search-wrap input { width: 100%; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 13px; padding: 8px 12px 8px 32px; outline: none; }
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--text3); }
select { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 13px; padding: 8px 10px; outline: none; cursor: pointer; }
.cat-scroll { display: flex; gap: 6px; margin-bottom: 1rem; overflow-x: auto; padding-bottom: 4px; }
.cat-scroll::-webkit-scrollbar { height: 3px; }
.cat-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
.cat-btn { flex-shrink: 0; font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 0.5px solid var(--border2); background: var(--bg3); color: var(--text2); cursor: pointer; white-space: nowrap; transition: all 0.12s; }
.cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.star-btn { border-color: rgba(255,180,0,0.4); color: #FFB800; }
.star-btn.active { background: #FFB800; color: #000; border-color: #FFB800; }
.filter-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.filter-label { font-size: 11px; color: var(--text3); white-space: nowrap; }
.cond-btn, .price-btn { font-size: 12px; padding: 4px 11px; border-radius: 20px; border: 0.5px solid var(--border2); background: var(--bg3); color: var(--text2); cursor: pointer; white-space: nowrap; transition: all 0.12s; -webkit-tap-highlight-color: transparent; }
.cond-btn.active { background: #9F77DD; color: #fff; border-color: #9F77DD; }
.price-btn.active { background: #1D9E75; color: #fff; border-color: #1D9E75; }
.section-title { font-size: 11px; font-weight: 600; color: var(--text2); letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 10px; }
.chart-wrap { margin-bottom: 1.75rem; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.bar-label { font-size: 12px; color: var(--text); width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
.bar-track { flex: 1; background: var(--bg3); border-radius: 5px; height: 26px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 5px; display: flex; align-items: center; padding: 0 8px; transition: width 0.4s ease; min-width: 50px; }
.bar-val { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.9); white-space: nowrap; }
.table-outer { border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text2); background: var(--bg2); border-bottom: 0.5px solid var(--border); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 0.5px solid var(--border); color: var(--text); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }
td a { color: var(--accent); text-decoration: none; font-size: 12px; }
td a:hover { text-decoration: underline; }
.badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; }
.badge-low  { background: rgba(29,158,117,0.15); color: #5DCAA5; border: 0.5px solid rgba(29,158,117,0.3); }
.badge-mid  { background: rgba(55,138,221,0.15); color: #85B7EB; border: 0.5px solid rgba(55,138,221,0.3); }
.badge-high { background: rgba(216,90,48,0.15);  color: #F09975; border: 0.5px solid rgba(216,90,48,0.3); }
.cond-new  { background: rgba(29,158,117,0.12); color: #5DCAA5; font-size: 11px; padding: 1px 6px; border-radius: 4px; }
.cond-used { background: rgba(159,119,221,0.12); color: #C4A8F0; font-size: 11px; padding: 1px 6px; border-radius: 4px; }
.cond-junk { background: rgba(216,90,48,0.12); color: #F09975; font-size: 11px; padding: 1px 6px; border-radius: 4px; }
.empty-row td { text-align: center; padding: 2rem; color: var(--text3); font-size: 13px; }
.action-btn { background: none; border: none; cursor: pointer; font-size: 18px; padding: 4px 8px; opacity: 0.6; transition: opacity .15s, transform .15s; -webkit-tap-highlight-color: transparent; color: var(--text); }
.action-btn:hover { opacity: 1; transform: scale(1.2); }
.action-btn.starred { opacity: 1; color: #FFB800; }
.pickup-banner { background: linear-gradient(135deg, rgba(255,180,0,0.12), rgba(255,120,0,0.08)); border: 1px solid rgba(255,180,0,0.3); border-radius: var(--radius-lg); padding: 1rem 1.2rem; margin-bottom: 1.5rem; cursor: pointer; transition: border-color .2s; }
.pickup-banner:hover { border-color: rgba(255,180,0,0.6); }
.pickup-banner-top { display: flex; align-items: center; justify-content: space-between; }
.pickup-banner-title { font-size: 16px; font-weight: 700; color: #FFB800; display: flex; align-items: center; gap: 8px; }
.pickup-banner-sub { font-size: 12px; color: var(--text2); margin-top: 4px; }
.pickup-banner-arrow { font-size: 18px; color: #FFB800; transition: transform .2s; }
.pickup-banner.open .pickup-banner-arrow { transform: rotate(90deg); }
.pickup-area { display: none; margin-top: 1rem; border-top: 1px solid rgba(255,180,0,0.2); padding-top: 1rem; }
.pickup-area.open { display: block; }
.pickup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.pickup-card { background: var(--bg2); border: 0.5px solid rgba(255,180,0,0.2); border-radius: var(--radius); padding: 12px; }
.pickup-card-name { font-size: 12px; color: var(--text); line-height: 1.4; margin-bottom: 8px; }
.pickup-card-price { font-size: 16px; font-weight: 700; color: #FFB800; margin-bottom: 6px; }
.pickup-card-link { font-size: 12px; color: var(--accent); text-decoration: none; }
.pickup-card-link:hover { text-decoration: underline; }
.pickup-empty { font-size: 13px; color: var(--text3); text-align: center; padding: 1rem; }
.refresh-btn { display: flex; align-items: center; gap: 5px; font-size: 12px; padding: 6px 12px; border: 0.5px solid var(--border2); border-radius: var(--radius); cursor: pointer; color: var(--text2); background: var(--bg3); }
.refresh-btn:hover { color: var(--text); border-color: var(--accent); }
.pagination { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 1rem; flex-wrap: wrap; }
.page-btn { font-size: 12px; padding: 5px 11px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg3); color: var(--text2); cursor: pointer; transition: all 0.12s; }
.page-btn:hover { border-color: var(--accent); color: var(--text); }
.page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.page-btn:disabled { opacity: 0.35; cursor: default; }
.page-info { font-size: 12px; color: var(--text2); }

/* ===== PRODUCT CARDS ===== */
#card-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
.prod-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px; }
.prod-card-tags { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.card-manual-badge { font-size: 10px; background: rgba(255,180,0,0.2); color: #FFB800; border: 0.5px solid rgba(255,180,0,0.4); border-radius: 4px; padding: 1px 6px; }
.prod-card-name { font-size: 13px; line-height: 1.6; color: var(--text); margin-bottom: 10px; word-break: break-all; }
.prod-card-price { margin-bottom: 10px; }
.prod-card-price .badge { font-size: 14px; padding: 3px 10px; }
.prod-card-actions { display: flex; align-items: center; justify-content: space-between; }
.prod-card-link { font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; padding: 6px 14px; border: 0.5px solid var(--accent); border-radius: var(--radius); }
.prod-card-link:active { opacity: 0.7; }

/* ===== ADMIN PANEL ===== */
#adminOverlay { display: none; position: fixed; inset: 0; z-index: 920; background: rgba(0,0,0,.7); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 1rem; }
#adminOverlay.active { display: flex; }
#adminModal { position: relative; width: 100%; max-width: 480px; max-height: 88vh; background: rgba(10,12,22,0.98); border: 1px solid rgba(255,180,0,0.35); border-radius: 1rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 40px rgba(0,0,0,.7); }
#adminModal .adm-header { padding: .9rem 1.2rem; border-bottom: 1px solid rgba(255,180,0,0.25); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; background: rgba(255,180,0,0.06); }
#adminModal .adm-title { font-size: 1rem; font-weight: 700; color: #FFB800; letter-spacing: .05em; }
#adminCloseBtn { width: 2rem; height: 2rem; border-radius: 50%; border: 1px solid rgba(255,180,0,0.3); background: transparent; color: #8b8fa8; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
#adminBody { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: .9rem; flex: 1; }
.adm-section { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: #FFB800; text-transform: uppercase; margin-bottom: .6rem; margin-top: .8rem; }
.adm-section:first-child { margin-top: 0; }
.adm-form { display: flex; flex-direction: column; gap: 8px; background: rgba(255,255,255,.03); border: 0.5px solid rgba(255,180,0,0.2); border-radius: .6rem; padding: .8rem; margin-bottom: .8rem; }
.adm-input { background: rgba(255,255,255,.06); border: 0.5px solid rgba(255,255,255,.12); border-radius: .4rem; color: #f0f0f5; font-size: 13px; padding: 8px 10px; outline: none; width: 100%; }
.adm-input:focus { border-color: #FFB800; }
.adm-input::placeholder { color: #5a5e72; }
.adm-select { background: rgba(255,255,255,.06); border: 0.5px solid rgba(255,255,255,.12); border-radius: .4rem; color: #f0f0f5; font-size: 13px; padding: 8px 10px; outline: none; width: 100%; cursor: pointer; }
.adm-btn { background: #FFB800; color: #000; font-size: 13px; font-weight: 700; border: none; border-radius: .4rem; padding: 9px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.adm-btn:active { opacity: .8; }
.adm-list { display: flex; flex-direction: column; gap: 6px; }
.adm-item { background: rgba(255,255,255,.04); border: 0.5px solid rgba(255,255,255,.08); border-radius: .5rem; padding: 8px 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.adm-item-info { flex: 1; min-width: 0; }
.adm-item-name { font-size: 12px; color: #f0f0f5; line-height: 1.4; margin-bottom: 3px; }
.adm-item-meta { font-size: 11px; color: #8b8fa8; }
.adm-del { background: none; border: none; color: #F09975; font-size: 16px; cursor: pointer; padding: 0 4px; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
.adm-empty { font-size: 13px; color: #5a5e72; text-align: center; padding: .8rem; }

/* ===== HELP MODAL ===== */
:root {
  --help-accent: #378ADD;
  --help-accent-dim: rgba(55,138,221,0.22);
  --help-bg: rgba(10,12,22,0.97);
  --help-border: rgba(55,138,221,0.28);
  --help-text: #d0d4f0;
  --help-text-dim: #6878a0;
  --help-section-bg: rgba(55,138,221,0.1);
  --help-item-bg: rgba(255,255,255,0.04);
  --help-btn-size: 2.4rem;
}
#helpBtn { position: fixed; top: 1rem; right: 1rem; z-index: 900; width: var(--help-btn-size); height: var(--help-btn-size); border-radius: 50%; border: 1.5px solid var(--help-border); background: var(--help-bg); color: var(--help-accent); font-size: 1.1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s, transform .15s; -webkit-tap-highlight-color: transparent; box-shadow: 0 0 10px rgba(55,138,221,0.2); }
#helpBtn:hover { background: var(--help-accent-dim); transform: scale(1.08); }
#helpBtn:active { transform: scale(.95); }
#helpOverlay { display: none; position: fixed; inset: 0; z-index: 910; background: rgba(0,0,0,.65); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 1rem; }
#helpOverlay.active { display: flex; }
#helpModal { position: relative; width: 100%; max-width: 480px; max-height: 85vh; background: var(--help-bg); border: 1px solid var(--help-border); border-radius: 1rem; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 40px rgba(0,0,0,.6); }
#helpModal .help-header { padding: .9rem 1.2rem; border-bottom: 1px solid var(--help-border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
#helpModal .help-header-title { font-size: 1rem; font-weight: 700; color: var(--help-accent); letter-spacing: .05em; }
#helpCloseBtn { width: 2rem; height: 2rem; border-radius: 50%; border: 1px solid var(--help-border); background: transparent; color: var(--help-text-dim); font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color .15s, background .15s; -webkit-tap-highlight-color: transparent; }
#helpCloseBtn:hover { color: #fff; background: rgba(255,255,255,.08); }
#helpBody { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: .8rem .8rem 1.2rem; flex: 1; }
.help-section-title { display: flex; align-items: center; gap: .4rem; font-size: .75rem; font-weight: 700; letter-spacing: .12em; color: var(--help-accent); text-transform: uppercase; background: var(--help-section-bg); border-radius: .45rem; padding: .45rem .7rem; margin-bottom: .4rem; margin-top: .6rem; }
.help-section-title:first-child { margin-top: 0; }
.help-item { border-radius: .5rem; overflow: hidden; margin-bottom: .3rem; }
.help-item-trigger { width: 100%; text-align: left; background: var(--help-item-bg); border: 1px solid transparent; border-radius: .5rem; color: var(--help-text); font-size: .88rem; font-weight: 600; padding: .6rem .8rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: .5rem; transition: border-color .15s, background .15s; -webkit-tap-highlight-color: transparent; }
.help-item-trigger:hover { border-color: var(--help-border); }
.help-item-trigger.open { border-color: var(--help-accent-dim); border-bottom-left-radius: 0; border-bottom-right-radius: 0; background: rgba(55,138,221,0.08); }
.help-item-trigger .help-chevron { font-size: .7rem; color: var(--help-text-dim); transition: transform .2s; flex-shrink: 0; }
.help-item-trigger.open .help-chevron { transform: rotate(180deg); }
.help-item-body { display: none; background: rgba(255,255,255,.025); border: 1px solid var(--help-accent-dim); border-top: none; border-bottom-left-radius: .5rem; border-bottom-right-radius: .5rem; padding: .65rem .85rem .75rem; font-size: .83rem; color: var(--help-text); line-height: 1.65; }
.help-item-body.open { display: block; }
.help-item-body strong { color: #fff; font-weight: 700; }
.help-item-body code { font-family: 'Courier New', monospace; font-size: .78rem; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.08); border-radius: .25rem; padding: .05em .35em; color: #a0e0ff; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div>
      <h1>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        ガジェット価格ダッシュボード
      </h1>
      <div class="header-sub">楽天市場データ · 毎日自動更新</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <button class="refresh-btn" onclick="loadData()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        更新
      </button>
      <div class="badge-file" id="file-badge">読み込み中...</div>
    </div>
  </div>

  <div id="status" class="status">
    <div class="spin"></div><br>データを取得しています...
  </div>

  <div id="main" style="display:none">

    <!-- PickUpバナー -->
    <div class="pickup-banner" id="pickupBanner" onclick="togglePickup()">
      <div class="pickup-banner-top">
        <div class="pickup-banner-title">⭐ 編集部おすすめ PickUp</div>
        <div class="pickup-banner-arrow">▶</div>
      </div>
      <div class="pickup-banner-sub">厳選したおすすめ商品はこちら → タップして見る</div>
      <div class="pickup-area" id="pickupArea">
        <div class="pickup-grid" id="pickupGrid"></div>
      </div>
    </div>

    <div class="metric-grid" id="metrics"></div>

    <div class="cat-scroll" id="cat-btns"></div>

    <div class="controls">
      <div class="search-wrap">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search" placeholder="スペース区切りでAND検索..." oninput="applyFilters()">
      </div>
      <select id="sort" onchange="applyFilters()">
        <option value="none">並び替え</option>
        <option value="asc">価格: 安い順</option>
        <option value="desc">価格: 高い順</option>
      </select>
    </div>
    <div class="filter-row">
      <span class="filter-label">コンディション：</span>
      <button class="cond-btn active" data-v="all" onclick="setCond('all')">全て</button>
      <button class="cond-btn" data-v="新品" onclick="setCond('新品')">新品</button>
      <button class="cond-btn" data-v="中古" onclick="setCond('中古')">中古</button>
      <button class="cond-btn" data-v="ジャンク" onclick="setCond('ジャンク')">ジャンク</button>
    </div>
    <div class="filter-row">
      <span class="filter-label">価格帯：</span>
      <button class="price-btn active" data-v="all" onclick="setPriceRange('all')">全て</button>
      <button class="price-btn" data-v="low" onclick="setPriceRange('low')">〜3万</button>
      <button class="price-btn" data-v="mid" onclick="setPriceRange('mid')">3〜10万</button>
      <button class="price-btn" data-v="high" onclick="setPriceRange('high')">10万〜</button>
    </div>

    <div class="chart-wrap">
      <div class="section-title">カテゴリ別平均価格</div>
      <div id="chart"></div>
    </div>

    <div class="section-title">商品一覧 (<span id="count">0</span>件)</div>
    <div id="card-grid"></div>
    <div id="pagination" class="pagination"></div>
  </div>

</div>

<!-- ADMIN PANEL -->
<div id="adminOverlay" role="dialog" aria-modal="true">
  <div id="adminModal">
    <div class="adm-header">
      <span class="adm-title">🔧 管理パネル</span>
      <button id="adminCloseBtn" aria-label="閉じる">✕</button>
    </div>
    <div id="adminBody">
      <div class="adm-section">➕ 商品を手動追加</div>
      <div class="adm-form">
        <input class="adm-input" id="adm-name" placeholder="商品名（コピペ）" type="text">
        <select class="adm-select" id="adm-cat"></select>
        <select class="adm-select" id="adm-cond">
          <option value="新品">新品</option>
          <option value="中古">中古</option>
          <option value="ジャンク">ジャンク</option>
        </select>
        <input class="adm-input" id="adm-price" placeholder="価格（数字のみ）" type="number" min="0">
        <input class="adm-input" id="adm-url" placeholder="アフィリエイトURL（貼り付け）" type="url">
        <button class="adm-btn" onclick="adminAdd()">追加する</button>
      </div>
      <div class="adm-section">📋 手動追加済みリスト</div>
      <div class="adm-list" id="adm-list"></div>
    </div>
  </div>
</div>

<!-- HELP MODAL -->
<button id="helpBtn" aria-label="ヘルプを開く">❓</button>
<div id="helpOverlay" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div id="helpModal">
    <div class="help-header">
      <span class="help-header-title" id="helpTitle">📋 ヘルプ</span>
      <button id="helpCloseBtn" aria-label="閉じる">✕</button>
    </div>
    <div id="helpBody"></div>
  </div>
</div>

<script>
var CSV_URL = 'https://raw.githubusercontent.com/kaerukaerukaeru2-lab/lab/main/data/rakuten_gadgets.csv';
var CSV_ENABLED = false; // trueにするとCSV自動取得ON
var BAR_COLORS = ["#378ADD","#1D9E75","#D85A30","#9F77DD","#D4537E","#639922","#BA7517","#E24B4A","#2BB5A0","#E07B39"];
var allData = [];
var manualData = (function(){ try { return JSON.parse(localStorage.getItem('gadget_manual') || '[]'); } catch(e){ return []; } })();
var filtered = [];
var pickupList = (function(){ try { return JSON.parse(localStorage.getItem('gadget_pickup') || '[]'); } catch(e){ return []; } })();
var blockList = (function(){ try { return JSON.parse(localStorage.getItem('gadget_blocklist') || '[]'); } catch(e){ return []; } })();
var currentCat = 'all';
var currentCond = 'all';
var currentPrice = 'all';
var currentPage = 1;
var PAGE_SIZE = 100;



function buildAllData(csvData) {
  try { manualData = JSON.parse(localStorage.getItem('gadget_manual') || '[]'); } catch(e) { manualData = []; }
  var manualRows = [];
  for (var mi = 0; mi < manualData.length; mi++) {
    var m = manualData[mi];
    manualRows.push({ date: m.date||'', category: m.category, condition: m.condition, name: m.name, price: m.price, shop: '手動追加', url: m.url, isManual: true });
  }
  allData = (csvData || []).concat(manualRows);
  document.getElementById('file-badge').textContent = allData.length + '件';
}

function loadData() {
  document.getElementById('status').style.display = 'block';
  document.getElementById('main').style.display = 'none';
  document.getElementById('file-badge').textContent = '読み込み中...';

  if (!CSV_ENABLED) {
    // CSV OFFモード：手動データのみ
    buildAllData([]);
    document.getElementById('status').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    buildCatBtns();
    renderPickup();
    applyFilters();
    return;
  }

  var xhr = new XMLHttpRequest();
  xhr.open('GET', CSV_URL + '?t=' + Date.now(), true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      buildAllData(parseCSV(xhr.responseText));
      document.getElementById('status').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      buildCatBtns();
      renderPickup();
      applyFilters();
    } else {
      // CSVエラーでも手動データは表示
      buildAllData([]);
      document.getElementById('status').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      buildCatBtns();
      renderPickup();
      applyFilters();
    }
  };
  xhr.onerror = function() {
    buildAllData([]);
    document.getElementById('status').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    buildCatBtns();
    renderPickup();
    applyFilters();
  };
  xhr.send();
}

function parseCSV(text) {
  var lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  // 列: 取得日時,カテゴリ,コンディション,商品名,価格,ショップ名,商品URL
  var result = [];
  for (var r = 1; r < lines.length; r++) {
    var line = lines[r];
    if (!line.trim()) continue;
    var cols = [];
    var cur = ''; var inQ = false;
    for (var c = 0; c < line.length; c++) {
      var ch = line[c];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur);
    var clean = cols.map(function(x){ return (x||'').replace(/^"|"$/g,'').trim(); });
    if (clean.length < 7) continue;
    var price = parseInt((clean[4]||'0').replace(/[^0-9]/g,''), 10) || 0;
    result.push({
      date: clean[0],
      category: clean[1],
      condition: clean[2],
      name: clean[3],
      price: price,
      shop: clean[5],
      url: clean[6]
    });
  }
  return result;
}

function buildCatBtns() {
  var cats = ['all'];
  allData.forEach(function(r){ if (cats.indexOf(r.category) === -1) cats.push(r.category); });
  var starBtn = '<button class="cat-btn star-btn' + (currentCat === 'starred' ? ' active' : '') + '" onclick="setCat(\'starred\')">⭐ おすすめ(' + pickupList.length + ')</button>';
  var catBtns = cats.map(function(c){
    return '<button class="cat-btn' + (c === currentCat ? ' active' : '') + '" onclick="setCat(\'' + c + '\')">' + (c === 'all' ? '全て' : c) + '</button>';
  }).join('');
  document.getElementById('cat-btns').innerHTML = starBtn + catBtns;
}

function setCat(cat) {
  currentCat = cat;
  var btns = document.querySelectorAll('.cat-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.remove('active');
    if ((cat === 'all' && btns[i].textContent === '全て') || btns[i].textContent === cat) {
      btns[i].classList.add('active');
    }
  }
  applyFilters();
}

function fmt(n) { return n.toLocaleString('ja-JP'); }

function renderMetrics() {
  var prices = filtered.map(function(r){ return r.price; }).filter(function(p){ return p > 0; });
  var avg = prices.length ? Math.round(prices.reduce(function(a,b){return a+b;},0)/prices.length) : 0;
  var min = prices.length ? Math.min.apply(null,prices) : 0;
  var max = prices.length ? Math.max.apply(null,prices) : 0;
  var cats = [];
  filtered.forEach(function(r){ if (cats.indexOf(r.category)===-1) cats.push(r.category); });
  var items = [
    ['商品数', filtered.length + '件'],
    ['カテゴリ', cats.length + '種'],
    ['平均価格', '¥' + fmt(avg)],
    ['最安値', '¥' + fmt(min)],
    ['最高値', '¥' + fmt(max)]
  ];
  document.getElementById('metrics').innerHTML = items.map(function(item){
    return '<div class="metric"><div class="label">' + item[0] + '</div><div class="value">' + item[1] + '</div></div>';
  }).join('');
}

function renderChart() {
  var catAvg = {};
  var catCount = {};
  filtered.forEach(function(r){
    if (!r.price) return;
    catAvg[r.category] = (catAvg[r.category] || 0) + r.price;
    catCount[r.category] = (catCount[r.category] || 0) + 1;
  });
  var cats = Object.keys(catAvg).map(function(c){
    return { cat: c, avg: Math.round(catAvg[c] / catCount[c]) };
  }).sort(function(a,b){ return b.avg - a.avg; });
  var maxVal = cats.length ? cats[0].avg : 1;
  document.getElementById('chart').innerHTML = cats.length ? cats.map(function(c, i){
    var pct = Math.round((c.avg / maxVal) * 100);
    var color = BAR_COLORS[i % BAR_COLORS.length];
    return '<div class="bar-row"><div class="bar-label" title="' + c.cat + '">' + c.cat + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '">' +
      '<span class="bar-val">¥' + fmt(c.avg) + '</span></div></div></div>';
  }).join('') : '<div style="color:var(--text3);font-size:13px">データがありません</div>';
}

function renderTable() {
  document.getElementById('count').textContent = filtered.length;
  var grid = document.getElementById('card-grid');
  if (!filtered.length) {
    grid.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text3);font-size:13px">一致する商品がありません</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  var totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  if (currentPage > totalPages) currentPage = 1;
  var start = (currentPage - 1) * PAGE_SIZE;
  var show = filtered.slice(start, start + PAGE_SIZE);
  grid.innerHTML = show.map(function(r, i){
    var condCls = r.condition === '新品' ? 'cond-new' : r.condition === '中古' ? 'cond-used' : 'cond-junk';
    var badgeCls = r.price < 5000 ? 'badge-low' : r.price < 30000 ? 'badge-mid' : 'badge-high';
    var isStarred = pickupList.some(function(p){ return p.url === r.url; });
    var manualBadge = r.isManual ? '<span class="card-manual-badge">手動</span>' : '';
    var idx = start + i;
    return '<div class="prod-card">' +
      '<div class="prod-card-tags">' +
        '<span class="' + condCls + '">' + esc(r.condition) + '</span>' +
        '<span style="font-size:11px;color:var(--text2);margin-left:4px">' + esc(r.category) + '</span>' +
        manualBadge +
      '</div>' +
      '<div class="prod-card-name">' + esc(r.name) + '</div>' +
      '<div class="prod-card-price"><span class="badge ' + badgeCls + '">¥' + fmt(r.price) + '</span></div>' +
      '<div class="prod-card-actions">' +
        (r.url ? '<a class="prod-card-link" href="' + esc(r.url) + '" target="_blank" rel="noopener">楽天で見る ↗</a>' : '<span style="color:var(--text3);font-size:12px">リンクなし</span>') +
        '<div style="display:flex;gap:4px">' +
          '<button class="action-btn' + (isStarred?' starred':'') + '" onclick="toggleStar(' + idx + ')" title="おすすめに追加" style="font-size:20px">' + (isStarred?'★':'☆') + '</button>' +
          '<button class="action-btn" onclick="blockItem(' + idx + ')" title="非表示にする">❌</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
  renderPagination(totalPages);
}

function togglePickup() {
  var banner = document.getElementById('pickupBanner');
  var area = document.getElementById('pickupArea');
  banner.classList.toggle('open');
  area.classList.toggle('open');
}

function renderPickup() {
  var grid = document.getElementById('pickupGrid');
  if (!pickupList.length) {
    grid.innerHTML = '<div class="pickup-empty">おすすめ商品はまだ登録されていません</div>';
    return;
  }
  grid.innerHTML = pickupList.map(function(p){
    return '<div class="pickup-card">' +
      '<div class="pickup-card-name">' + esc(p.name.substring(0,60)) + '</div>' +
      '<div class="pickup-card-price">¥' + fmt(p.price) + '</div>' +
      '<a class="pickup-card-link" href="' + esc(p.url) + '" target="_blank" rel="noopener">楽天で見る ↗</a>' +
      '</div>';
  }).join('');
}

function toggleStar(idx) {
  var r = filtered[idx];
  if (!r) return;
  var exists = -1;
  for (var i = 0; i < pickupList.length; i++) { if (pickupList[i].url === r.url) { exists = i; break; } }
  if (exists >= 0) {
    pickupList.splice(exists, 1);
  } else {
    pickupList.push({ name: r.name, price: r.price, url: r.url, category: r.category });
  }
  localStorage.setItem('gadget_pickup', JSON.stringify(pickupList));
  buildCatBtns();
  applyFilters();
}

function blockItem(idx) {
  var r = filtered[idx];
  if (!r) return;
  blockList.push(r.url);
  allData = allData.filter(function(d){ return d.url !== r.url; });
  localStorage.setItem('gadget_blocklist', JSON.stringify(blockList));
  applyFilters();
}

function saveManual() {
  localStorage.setItem('gadget_manual', JSON.stringify(manualData));
}

function renderPagination(totalPages) {
  var pg = document.getElementById('pagination');
  if (totalPages <= 1) { pg.innerHTML = ''; return; }
  var html = '';
  html += '<button class="page-btn" onclick="goPage(' + (currentPage-1) + ')"' + (currentPage===1?' disabled':'') + '>＜</button>';
  var start = Math.max(1, currentPage - 2);
  var end = Math.min(totalPages, currentPage + 2);
  if (start > 1) html += '<button class="page-btn" onclick="goPage(1)">1</button>' + (start > 2 ? '<span class="page-info">…</span>' : '');
  for (var i = start; i <= end; i++) {
    html += '<button class="page-btn' + (i===currentPage?' active':'') + '" onclick="goPage(' + i + ')">' + i + '</button>';
  }
  if (end < totalPages) html += (end < totalPages-1 ? '<span class="page-info">…</span>' : '') + '<button class="page-btn" onclick="goPage(' + totalPages + ')">' + totalPages + '</button>';
  html += '<button class="page-btn" onclick="goPage(' + (currentPage+1) + ')"' + (currentPage===totalPages?' disabled':'') + '>＞</button>';
  html += '<span class="page-info">' + currentPage + '/' + totalPages + 'ページ</span>';
  pg.innerHTML = html;
}

function goPage(p) {
  currentPage = p;
  renderTable();
  window.scrollTo(0, document.getElementById('table-body').getBoundingClientRect().top + window.scrollY - 60);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function applyFilters() {
  var q = document.getElementById('search').value.toLowerCase().trim();
  var sort = document.getElementById('sort').value;
  var keywords = [];
  if (q) {
    var parts = q.split(/\s+/);
    for (var ki = 0; ki < parts.length; ki++) {
      if (parts[ki].length > 0) keywords.push(parts[ki]);
    }
  }
  filtered = allData.filter(function(r){
    if (!r.isManual && blockList.indexOf(r.url) >= 0) return false;
    if (currentCat === 'starred') {
      if (!pickupList.some(function(p){ return p.url === r.url; })) return false;
    } else if (currentCat !== 'all' && r.category !== currentCat) return false;
    if (currentCond !== 'all' && r.condition !== currentCond) return false;
    if (currentPrice === 'low'  && r.price >= 30000) return false;
    if (currentPrice === 'mid'  && (r.price < 30000 || r.price >= 100000)) return false;
    if (currentPrice === 'high' && r.price < 100000) return false;
    if (keywords.length > 0) {
      var name = r.name.toLowerCase();
      for (var k = 0; k < keywords.length; k++) {
        if (name.indexOf(keywords[k]) === -1) return false;
      }
    }
    return true;
  });
  if (sort === 'asc')  filtered.sort(function(a,b){ return a.price - b.price; });
  if (sort === 'desc') filtered.sort(function(a,b){ return b.price - a.price; });
  currentPage = 1;
  renderMetrics(); renderChart(); renderTable();
}

function setCond(c) {
  currentCond = c;
  var btns = document.querySelectorAll('.cond-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', btns[i].dataset.v === c);
  }
  applyFilters();
}

function setPriceRange(p) {
  currentPrice = p;
  var btns = document.querySelectorAll('.price-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', btns[i].dataset.v === p);
  }
  applyFilters();
}

// search/sort handled by inline oninput/onchange
// cond filter handled by setCond()

loadData();

/* ===== ADMIN PANEL JS ===== */
(function initAdmin() {
  var overlay = document.getElementById('adminOverlay');
  var closeBtn = document.getElementById('adminCloseBtn');
  var helpBtn = document.getElementById('helpBtn');
  var tapCount = 0;
  var tapTimer = null;

  // ❓を3回連続タップで管理パネル、1回タップでヘルプ
  helpBtn.addEventListener('click', function() {
    tapCount++;
    if (tapTimer) clearTimeout(tapTimer);
    if (tapCount >= 3) {
      tapCount = 0;
      openAdmin();
      return;
    }
    tapTimer = setTimeout(function() {
      if (tapCount === 1 && window._openHelpModal) window._openHelpModal();
      tapCount = 0;
    }, 400);
  });

  function openAdmin() {
    buildAdmCatSelect();
    renderAdmList();
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeAdmin() {
    overlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  closeBtn.onclick = closeAdmin;
  overlay.onclick = function(e) { if (e.target === overlay) closeAdmin(); };

  function buildAdmCatSelect() {
    var sel = document.getElementById('adm-cat');
    var cats = [];
    allData.forEach(function(r){ if (!r.isManual && cats.indexOf(r.category) === -1) cats.push(r.category); });
    // よく使う固定カテゴリも追加
    var defaults = ['iPhone','Android_Galaxy','Android_Xperia','Android_Pixel','Android_AQUOS','Android_その他','アクセサリー_ケース','アクセサリー_フィルム','アクセサリー_充電器'];
    defaults.forEach(function(d){ if (cats.indexOf(d) === -1) cats.push(d); });
    sel.innerHTML = cats.map(function(c){ return '<option value="' + c + '">' + c + '</option>'; }).join('');
  }

  function renderAdmList() {
    var list = document.getElementById('adm-list');
    if (!manualData.length) {
      list.innerHTML = '<div class="adm-empty">まだ手動追加した商品はありません</div>';
      return;
    }
    list.innerHTML = manualData.map(function(m, i) {
      return '<div class="adm-item">' +
        '<div class="adm-item-info">' +
          '<div class="adm-item-name">' + esc(m.name.substring(0, 40)) + (m.name.length > 40 ? '…' : '') + '</div>' +
          '<div class="adm-item-meta">¥' + fmt(m.price) + ' · ' + esc(m.category) + ' · ' + esc(m.condition) + '</div>' +
        '</div>' +
        '<button class="adm-del" onclick="adminDel(' + i + ')">🗑</button>' +
      '</div>';
    }).join('');
  }

  function mergeManualToAllData() {
    var csvOnly = allData.filter(function(d){ return !d.isManual; });
    try { manualData = JSON.parse(localStorage.getItem('gadget_manual') || '[]'); } catch(e) { manualData = []; }
    var manualRows = [];
    for (var mi = 0; mi < manualData.length; mi++) {
      var m = manualData[mi];
      manualRows.push({ date: m.date||'', category: m.category, condition: m.condition, name: m.name, price: m.price, shop: '手動追加', url: m.url, isManual: true });
    }
    allData = csvOnly.concat(manualRows);
    document.getElementById('file-badge').textContent = allData.length + '件';
  }

  window.adminAdd = function() {
    var name = document.getElementById('adm-name').value.trim();
    var cat = document.getElementById('adm-cat').value;
    var cond = document.getElementById('adm-cond').value;
    var price = parseInt(document.getElementById('adm-price').value, 10) || 0;
    var url = document.getElementById('adm-url').value.trim();
    if (!name || !url) return;
    var item = { name: name, category: cat, condition: cond, price: price, url: url, date: new Date().toISOString().slice(0,10) };
    manualData.push(item);
    saveManual();
    mergeManualToAllData();
    buildCatBtns();
    applyFilters();
    document.getElementById('adm-name').value = '';
    document.getElementById('adm-price').value = '';
    document.getElementById('adm-url').value = '';
    renderAdmList();
  };

  window.adminDel = function(i) {
    manualData.splice(i, 1);
    saveManual();
    mergeManualToAllData();
    buildCatBtns();
    applyFilters();
    renderAdmList();
  };
})();

(function initHelpModal() {
  var overlay = document.getElementById('helpOverlay');
  var body = document.getElementById('helpBody');
  var closeBtn = document.getElementById('helpCloseBtn');

  function renderHelp() {
    body.innerHTML = '';
    var wrap = document.createElement('div');
    var title = document.createElement('div');
    title.className = 'help-section-title';
    title.textContent = '📖 使い方';
    wrap.appendChild(title);
    helpData.howto.forEach(function(item, i) {
      var id = 'howto-' + i;
      var row = document.createElement('div');
      row.className = 'help-item';
      var trigger = document.createElement('button');
      trigger.className = 'help-item-trigger';
      trigger.setAttribute('aria-expanded', 'false');
      trigger.setAttribute('aria-controls', id);
      trigger.innerHTML = '<span>' + escH(item.title) + '</span><span class="help-chevron">▼</span>';
      var panel = document.createElement('div');
      panel.className = 'help-item-body';
      panel.id = id;
      panel.innerHTML = item.body;
      trigger.onclick = function() {
        var isOpen = trigger.classList.contains('open');
        wrap.querySelectorAll('.help-item-trigger.open').forEach(function(t) {
          t.classList.remove('open');
          t.setAttribute('aria-expanded', 'false');
          document.getElementById(t.getAttribute('aria-controls')).classList.remove('open');
        });
        if (!isOpen) {
          trigger.classList.add('open');
          trigger.setAttribute('aria-expanded', 'true');
          panel.classList.add('open');
        }
      };
      row.appendChild(trigger);
      row.appendChild(panel);
      wrap.appendChild(row);
    });
    body.appendChild(wrap);
  }

  function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function openModal() { renderHelp(); overlay.classList.add('active'); document.body.style.overflow = 'hidden'; }
  function closeModal() { overlay.classList.remove('active'); document.body.style.overflow = ''; }

  // helpBtnは3タップでadmin、1タップでhelpを開く（adminパネルJSのtapCountが3未満の間はhelpを開く）
  window._openHelpModal = openModal;
  closeBtn.onclick = closeModal;
  overlay.onclick = function(e) { if (e.target === overlay) closeModal(); };
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
})();
</script>
</body>
</html>
