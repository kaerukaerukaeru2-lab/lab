name: 楽天ガジェット価格収集

on:
  schedule:
    - cron: "0 1 * * *"   # 毎日 日本時間 10:00 (UTC 01:00) に実行
  workflow_dispatch:        # 手動実行ボタンも有効化

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: スクレイピング実行
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python scraper/rakuten_scraper.py

      - name: CSVをコミット＆プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rakuten_gadgets.csv
          git diff --cached --quiet || git commit -m "データ更新: $(date '+%Y-%m-%d')"
          git push

      - name: Netlifyへ直接デプロイ
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=. --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} --site=${{ secrets.NETLIFY_SITE_ID }}
