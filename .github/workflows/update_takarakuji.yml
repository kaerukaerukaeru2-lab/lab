name: 宝くじ当選番号更新

on:
  schedule:
    # 毎日21:00 JST (12:00 UTC) に実行
    - cron: '0 12 * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install requests beautifulsoup4

      - name: スクレイピング実行
        run: python takarakuji/scrape_takarakuji.py

      - name: JSONをコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add takarakuji/takarakuji_data.json
          git diff --staged --quiet || git commit -m "自動更新: 宝くじ当選番号 $(date '+%Y-%m-%d')"
          git push
